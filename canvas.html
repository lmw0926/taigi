<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台語學習通 - 進階增強版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        .word-card { transition: all 0.3s ease; }
        .word-card.playing { 
            border-color: #6366f1; 
            background-color: #eef2ff; 
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.2);
            transform: scale(1.02);
        }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* 拖拉樣式 */
        .draggable { cursor: grab; user-select: none; }
        .draggable:active { cursor: grabbing; }
        .drop-zone { transition: all 0.2s; }
        .drop-zone.drag-over { background-color: #e0e7ff; border-color: #6366f1; transform: scale(1.05); }
        .matched-item { opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 導覽列 -->
    <header class="sticky top-0 z-20 bg-white shadow-sm border-b border-slate-200 p-4">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-indigo-600">台語學習通</h1>
                <nav class="flex bg-slate-100 p-1 rounded-xl">
                    <button id="navStudy" class="px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600">學習</button>
                    <button id="navGame" class="px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500 hover:text-indigo-600 transition-all">遊戲</button>
                </nav>
            </div>

            <div id="studyControls" class="flex items-center gap-2">
                <select id="categorySelect" class="bg-slate-100 border-none rounded-lg px-3 py-2 text-sm font-medium text-slate-700 focus:ring-2 focus:ring-indigo-500">
                    <option value="all">載入中...</option>
                </select>
                <div id="dataStatus" class="text-xs text-slate-400 bg-slate-50 px-2 py-1 rounded">資料: 0</div>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 sm:p-6 max-w-4xl w-full mx-auto">
        <!-- 載入中 -->
        <div id="loadingOverlay" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p id="loadingText" class="text-slate-500 font-medium text-center px-4">正在載入台語資料庫...</p>
        </div>

        <!-- 學習視圖 -->
        <div id="studyView" class="hidden">
            <div class="flex flex-wrap gap-2 mb-6">
                <button id="playPageBtn" class="flex-1 py-3 bg-indigo-100 text-indigo-700 font-bold rounded-xl hover:bg-indigo-200 transition-all flex items-center justify-center gap-2">
                    <span>📄 播放本頁</span>
                </button>
                <button id="playAllBtn" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-all flex items-center justify-center gap-2">
                    <span>🔁 播放全部 (自動翻頁)</span>
                </button>
                <button id="stopPlayBtn" class="hidden px-6 py-3 bg-rose-100 text-rose-600 font-bold rounded-xl hover:bg-rose-200 transition-all">停止播放</button>
            </div>

            <div id="wordGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            
            <div id="pagination" class="flex items-center justify-center gap-6 mt-10 mb-20">
                <button id="prevPage" class="p-3 rounded-full bg-white shadow-sm border border-slate-200 text-slate-600 disabled:opacity-30">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
                </button>
                <span id="pageInfo" class="font-bold text-slate-600 text-sm italic">PAGE 1 / 1</span>
                <button id="nextPage" class="p-3 rounded-full bg-white shadow-sm border border-slate-200 text-slate-600 disabled:opacity-30">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
                </button>
            </div>
        </div>

        <!-- 遊戲視圖 -->
        <div id="gameView" class="hidden">
            <!-- 遊戲首頁 -->
            <div id="gameStartScreen" class="py-12 bg-white rounded-3xl shadow-xl border border-slate-100 px-8 text-center">
                <div class="text-6xl mb-6">🎮</div>
                <h2 class="text-3xl font-bold text-slate-800 mb-6">台語挑戰賽</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8 max-w-md mx-auto">
                    <button onclick="selectGameMode('listen')" id="modeBtnListen" class="game-mode-btn p-6 border-2 border-indigo-600 bg-indigo-50 rounded-2xl text-center">
                        <div class="text-3xl mb-2">🎧</div>
                        <div class="font-bold">聽力選選樂</div>
                    </button>
                    <button onclick="selectGameMode('match')" id="modeBtnMatch" class="game-mode-btn p-6 border-2 border-slate-100 bg-white rounded-2xl text-center">
                        <div class="text-3xl mb-2">🧩</div>
                        <div class="font-bold">拖拉配對王</div>
                    </button>
                </div>
                <button onclick="startSelectedGame()" class="px-12 py-4 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg hover:bg-indigo-700 w-full max-w-xs transition-all">開始遊戲</button>
            </div>

            <!-- 聽力挑戰 -->
            <div id="gamePlayListen" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <div class="bg-indigo-100 px-4 py-2 rounded-full text-indigo-700 font-bold">得分: <span id="listenScore">0</span></div>
                    <button onclick="backToMenu()" class="text-slate-400">結束</button>
                </div>
                <div class="bg-white rounded-3xl shadow-xl p-8 mb-6 text-center">
                    <div class="text-slate-400 mb-4">聽發音選出正確單字</div>
                    <button id="listenMainAudioBtn" class="w-24 h-24 bg-indigo-600 text-white rounded-full mx-auto flex items-center justify-center text-4xl shadow-lg hover:scale-105 transition-all">🔊</button>
                </div>
                <div id="listenOptions" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>

            <!-- 拖拉配對模式 -->
            <div id="gamePlayMatch" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <div class="bg-indigo-100 px-4 py-2 rounded-full text-indigo-700 font-bold">得分: <span id="matchScore">0</span></div>
                    <button onclick="backToMenu()" class="text-slate-400 font-bold underline">結束遊戲</button>
                </div>
                <div class="grid grid-cols-2 gap-8 items-start">
                    <!-- 左側：拖曳語詞 -->
                    <div class="space-y-4">
                        <h3 class="text-center font-bold text-slate-500 text-sm mb-2">拖曳語詞 ➔</h3>
                        <div id="matchWordsCol" class="space-y-3"></div>
                    </div>
                    <!-- 右側：放置音標 -->
                    <div class="space-y-4">
                        <h3 class="text-center font-bold text-slate-500 text-sm mb-2">➔ 放到音標上</h3>
                        <div id="matchPojCol" class="space-y-3"></div>
                    </div>
                </div>
                <div id="matchFeedback" class="mt-8 text-center min-h-[30px] font-bold text-indigo-600"></div>
            </div>
            
            <!-- 結果畫面 -->
            <div id="gameResultScreen" class="hidden text-center py-12 bg-white rounded-3xl shadow-xl p-8">
                <h2 class="text-3xl font-bold mb-4">挑戰結束！</h2>
                <div class="text-6xl font-black text-indigo-600 mb-8" id="finalScore">0</div>
                <button onclick="backToMenu()" class="px-8 py-3 bg-slate-100 rounded-xl hover:bg-slate-200 transition-all">返回主選單</button>
            </div>
        </div>
    </main>

    <audio id="audioPlayer" class="hidden"></audio>

    <script type="module">
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        const pageSize = 8;
        let gameMode = 'listen';
        let gameScore = 0;
        let currentQuestion = null;
        let isAutoPlaying = false;
        let playMode = 'page'; // 'page' or 'all'
        let playList = [];
        let currentPlayIndex = -1;

        const audioPlayer = document.getElementById('audioPlayer');

        async function init() {
            try {
                await loadData();
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('studyView').classList.remove('hidden');
                renderGrid();
            } catch (err) {
                document.getElementById('loadingText').innerText = "系統初始化失敗，請檢查網路連線";
            }
        }

        async function loadData() {
            const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSIS-1UF7kUUYsxnNgBtsyYNI9n5GAKh-fxtJkKjaGBk9VXxk07WILC_rLoB2-0wrhVjuJIVgqgIdIL/pub?output=csv';
            const response = await fetch(CSV_URL);
            const text = await response.text();
            
            const rows = text.split('\n').map(row => {
                const fields = [];
                let field = '', inQuotes = false;
                for (let char of row) {
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { fields.push(field); field = ''; }
                    else field += char;
                }
                fields.push(field);
                return fields;
            });

            allData = rows.slice(1).map((r, i) => ({
                id: `id-${i}`,
                word: r[1]?.trim() || '',
                audio: r[2]?.trim() || '',
                poj: r[5]?.trim() || '',
                meaning: r[6]?.trim() || '',
                category: r[7]?.trim() || '未分類'
            })).filter(d => d.word && d.audio);

            document.getElementById('dataStatus').innerText = `資料: ${allData.length}`;
            const cats = ['all', ...new Set(allData.map(d => d.category))];
            const sel = document.getElementById('categorySelect');
            sel.innerHTML = '';
            cats.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c === 'all' ? '所有分類' : c;
                sel.appendChild(opt);
            });
        }

        // --- 學習視圖功能 ---
        function renderGrid() {
            const grid = document.getElementById('wordGrid');
            const cat = document.getElementById('categorySelect').value;
            filteredData = cat === 'all' ? allData : allData.filter(d => d.category === cat);
            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            grid.innerHTML = '';
            
            const items = filteredData.slice((currentPage - 1) * pageSize, currentPage * pageSize);
            items.forEach(item => {
                const card = document.createElement('div');
                card.id = `card-${item.id}`;
                card.className = 'word-card bg-white p-6 rounded-2xl shadow-sm border-2 border-slate-200 flex justify-between items-center cursor-pointer hover:border-indigo-300';
                card.innerHTML = `
                    <div class="flex-grow">
                        <div class="flex items-center gap-4">
                            <span class="text-3xl font-bold text-slate-800">${item.word}</span>
                            <span class="text-3xl font-bold text-indigo-500 font-mono">${item.poj}</span>
                        </div>
                        <div class="text-lg text-slate-400 mt-2 font-medium">${item.meaning}</div>
                    </div>
                    <button class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-xl">🔊</button>
                `;
                card.onclick = () => { stopAutoPlay(); playAudio(item.audio); };
                grid.appendChild(card);
            });
            document.getElementById('pageInfo').innerText = `PAGE ${currentPage} / ${totalPages}`;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
        }

        function playAudio(url) {
            audioPlayer.src = url;
            audioPlayer.play().catch(e => console.warn("播放受阻", e));
        }

        // 播放控制邏輯
        document.getElementById('playPageBtn').onclick = () => startAutoPlay('page');
        document.getElementById('playAllBtn').onclick = () => startAutoPlay('all');

        function startAutoPlay(mode) {
            playMode = mode;
            if (mode === 'page') {
                playList = filteredData.slice((currentPage - 1) * pageSize, currentPage * pageSize);
            } else {
                playList = filteredData;
            }
            
            if (!playList.length) return;
            isAutoPlaying = true;
            currentPlayIndex = 0;
            document.getElementById('stopPlayBtn').classList.remove('hidden');
            playCurrentFromList();
        }

        function playCurrentFromList() {
            if (!isAutoPlaying || currentPlayIndex >= playList.length) {
                stopAutoPlay();
                return;
            }
            
            const item = playList[currentPlayIndex];
            
            // 檢查是否需要跳頁
            const itemPageIndex = Math.floor(filteredData.indexOf(item) / pageSize) + 1;
            if (itemPageIndex !== currentPage) {
                currentPage = itemPageIndex;
                renderGrid();
            }

            // 高亮目前卡片
            document.querySelectorAll('.word-card').forEach(c => c.classList.remove('playing'));
            const activeCard = document.getElementById(`card-${item.id}`);
            if (activeCard) {
                activeCard.classList.add('playing');
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            playAudio(item.audio);
        }

        audioPlayer.onended = () => {
            if (isAutoPlaying) {
                currentPlayIndex++;
                setTimeout(playCurrentFromList, 800);
            }
        };

        function stopAutoPlay() {
            isAutoPlaying = false;
            audioPlayer.pause();
            document.querySelectorAll('.word-card').forEach(c => c.classList.remove('playing'));
            document.getElementById('stopPlayBtn').classList.add('hidden');
        }

        document.getElementById('stopPlayBtn').onclick = stopAutoPlay;

        // --- 聽力模式功能 ---
        function nextListenQuestion() {
            currentQuestion = allData[Math.floor(Math.random() * allData.length)];
            const options = [currentQuestion];
            while (options.length < 4) {
                const r = allData[Math.floor(Math.random() * allData.length)];
                if (!options.find(o => o.id === r.id)) options.push(r);
            }
            options.sort(() => Math.random() - 0.5);
            
            const container = document.getElementById('listenOptions');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'p-5 bg-white border-2 border-slate-100 rounded-2xl font-bold text-xl hover:border-indigo-500 hover:bg-indigo-50 transition-all';
                btn.innerText = opt.word;
                btn.onclick = () => {
                    if (opt.id === currentQuestion.id) {
                        gameScore += 10;
                        document.getElementById('listenScore').innerText = gameScore;
                        nextListenQuestion();
                    } else {
                        endGame();
                    }
                };
                container.appendChild(btn);
            });
            playAudio(currentQuestion.audio);
        }
        document.getElementById('listenMainAudioBtn').onclick = () => playAudio(currentQuestion.audio);

        // --- 拖拉配對模式功能 ---
        function nextMatchRound() {
            const items = [...allData].sort(() => Math.random() - 0.5).slice(0, 5);
            const wordsCol = document.getElementById('matchWordsCol');
            const pojCol = document.getElementById('matchPojCol');
            const feedback = document.getElementById('matchFeedback');
            
            wordsCol.innerHTML = ''; pojCol.innerHTML = '';
            feedback.innerText = '請將左側單字拖曳到右側對應音標上';

            // 隨機排序
            const words = [...items].sort(() => Math.random() - 0.5);
            const pojs = [...items].sort(() => Math.random() - 0.5);

            words.forEach(it => {
                const div = document.createElement('div');
                div.id = `drag-${it.id}`;
                div.draggable = true;
                div.className = 'draggable p-4 bg-white border-2 border-indigo-200 rounded-xl font-bold text-2xl shadow-sm text-center active:scale-95 transition-transform';
                div.innerText = it.word;
                
                div.ondragstart = (e) => {
                    e.dataTransfer.setData('text/plain', it.id);
                    div.classList.add('opacity-50');
                };
                div.ondragend = () => div.classList.remove('opacity-50');
                
                wordsCol.appendChild(div);
            });

            pojs.forEach(it => {
                const div = document.createElement('div');
                div.id = `drop-${it.id}`;
                div.className = 'drop-zone p-4 bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl font-mono text-2xl text-center text-slate-500 font-bold';
                div.innerText = it.poj;
                
                div.ondragover = (e) => {
                    e.preventDefault();
                    div.classList.add('drag-over');
                };
                div.ondragleave = () => div.classList.remove('drag-over');
                div.ondrop = (e) => {
                    e.preventDefault();
                    div.classList.remove('drag-over');
                    const draggedId = e.dataTransfer.getData('text/plain');
                    
                    if (draggedId === it.id) {
                        // 答對了
                        gameScore += 20;
                        document.getElementById('matchScore').innerText = gameScore;
                        feedback.innerText = `✨ 正確！ ${it.word} = ${it.poj}`;
                        feedback.className = "mt-8 text-center font-bold text-green-500";
                        
                        document.getElementById(`drag-${it.id}`).classList.add('matched-item');
                        div.className = 'p-4 bg-green-100 border-2 border-green-500 rounded-xl font-bold text-2xl text-center text-green-700';
                        div.innerText = `✅ ${it.word}`;
                        
                        playAudio(it.audio);

                        if (!document.querySelector('.draggable:not(.matched-item)')) {
                            setTimeout(() => {
                                feedback.innerText = '太棒了！下一關...';
                                setTimeout(nextMatchRound, 1000);
                            }, 500);
                        }
                    } else {
                        // 答錯了
                        feedback.innerText = '❌ 配對錯誤，再試一次！';
                        feedback.className = "mt-8 text-center font-bold text-rose-500";
                        div.classList.add('shake'); // 可以在CSS加個震動效果
                        setTimeout(() => feedback.className = "mt-8 text-center font-bold text-indigo-600", 1000);
                    }
                };
                pojCol.appendChild(div);
            });
        }

        // --- 系統導覽與遊戲邏輯 ---
        window.selectGameMode = (mode) => {
            gameMode = mode;
            document.querySelectorAll('.game-mode-btn').forEach(btn => {
                btn.classList.remove('border-indigo-600', 'bg-indigo-50');
                btn.classList.add('border-slate-100', 'bg-white');
            });
            const selectedId = mode === 'listen' ? 'modeBtnListen' : 'modeBtnMatch';
            const selected = document.getElementById(selectedId);
            selected.classList.remove('border-slate-100', 'bg-white');
            selected.classList.add('border-indigo-600', 'bg-indigo-50');
        };

        window.startSelectedGame = () => {
            gameScore = 0;
            document.getElementById('gameStartScreen').classList.add('hidden');
            document.getElementById('gamePlayListen').classList.add('hidden');
            document.getElementById('gamePlayMatch').classList.add('hidden');
            
            if (gameMode === 'listen') {
                document.getElementById('gamePlayListen').classList.remove('hidden');
                document.getElementById('listenScore').innerText = '0';
                nextListenQuestion();
            } else if (gameMode === 'match') {
                document.getElementById('gamePlayMatch').classList.remove('hidden');
                document.getElementById('matchScore').innerText = '0';
                nextMatchRound();
            }
        };

        window.backToMenu = () => {
            document.getElementById('gamePlayListen').classList.add('hidden');
            document.getElementById('gamePlayMatch').classList.add('hidden');
            document.getElementById('gameResultScreen').classList.add('hidden');
            document.getElementById('gameStartScreen').classList.remove('hidden');
        };

        function endGame() {
            document.getElementById('gamePlayListen').classList.add('hidden');
            document.getElementById('gamePlayMatch').classList.add('hidden');
            document.getElementById('gameResultScreen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = gameScore;
        }

        document.getElementById('navStudy').onclick = () => {
            stopAutoPlay();
            document.getElementById('studyView').classList.remove('hidden');
            document.getElementById('gameView').classList.add('hidden');
            document.getElementById('studyControls').classList.remove('invisible');
            document.getElementById('navStudy').className = 'px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600';
            document.getElementById('navGame').className = 'px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500';
        };

        document.getElementById('navGame').onclick = () => {
            stopAutoPlay();
            document.getElementById('gameView').classList.remove('hidden');
            document.getElementById('studyView').classList.add('hidden');
            document.getElementById('studyControls').classList.add('invisible');
            document.getElementById('navGame').className = 'px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600';
            document.getElementById('navStudy').className = 'px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500';
            backToMenu();
        };

        document.getElementById('categorySelect').onchange = () => { stopAutoPlay(); currentPage = 1; renderGrid(); };
        document.getElementById('prevPage').onclick = () => { if (currentPage > 1) { stopAutoPlay(); currentPage--; renderGrid(); } };
        document.getElementById('nextPage').onclick = () => { if (currentPage * pageSize < filteredData.length) { stopAutoPlay(); currentPage++; renderGrid(); } };

        init();
    </script>
</body>
</html>

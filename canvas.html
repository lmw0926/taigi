<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台語學習通 - 語音辨識增強版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
        }
        .word-card { transition: all 0.2s ease; }
        .word-card.playing { border-color: #6366f1; background-color: #eef2ff; box-shadow: 0 0 0 2px #6366f1; }
        .mic-active { animation: pulse-red 1.5s infinite; background-color: #ef4444 !important; }
        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .match-btn.selected { border-color: #6366f1; background-color: #eef2ff; }
        .match-btn.matched { visibility: hidden; opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 導覽列 -->
    <header class="sticky top-0 z-20 bg-white shadow-sm border-b border-slate-200 p-4">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-indigo-600">台語學習通</h1>
                <nav class="flex bg-slate-100 p-1 rounded-xl">
                    <button id="navStudy" class="px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600">學習</button>
                    <button id="navGame" class="px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500 hover:text-indigo-600 transition-all">遊戲</button>
                </nav>
            </div>

            <div id="studyControls" class="flex items-center gap-2">
                <select id="categorySelect" class="bg-slate-100 border-none rounded-lg px-3 py-2 text-sm font-medium text-slate-700 focus:ring-2 focus:ring-indigo-500">
                    <option value="all">載入中...</option>
                </select>
                <div id="dataStatus" class="text-xs text-slate-400 bg-slate-50 px-2 py-1 rounded">資料: 0</div>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 sm:p-6 max-w-4xl w-full mx-auto">
        <!-- 訊息通知 -->
        <div id="toast" class="hidden fixed top-24 left-1/2 transform -translate-x-1/2 z-50 bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-2xl transition-all duration-300"></div>

        <!-- 載入中 -->
        <div id="loadingOverlay" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p id="loadingText" class="text-slate-500 font-medium text-center px-4">正在載入台語資料庫...</p>
        </div>

        <!-- 學習視圖 -->
        <div id="studyView" class="hidden">
            <div class="flex gap-2 mb-6">
                <button id="playPageBtn" class="flex-1 py-3 bg-indigo-100 text-indigo-700 font-bold rounded-xl hover:bg-indigo-200 transition-all flex items-center justify-center gap-2">
                    <span>🔊 播放本頁</span>
                </button>
                <button id="stopPlayBtn" class="hidden px-6 py-3 bg-rose-100 text-rose-600 font-bold rounded-xl hover:bg-rose-200 transition-all">停止</button>
            </div>

            <div id="wordGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            
            <div id="pagination" class="flex items-center justify-center gap-6 mt-10 mb-20">
                <button id="prevPage" class="p-3 rounded-full bg-white shadow-sm border border-slate-200 text-slate-600 disabled:opacity-30">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
                </button>
                <span id="pageInfo" class="font-bold text-slate-600 text-sm italic">PAGE 1 / 1</span>
                <button id="nextPage" class="p-3 rounded-full bg-white shadow-sm border border-slate-200 text-slate-600 disabled:opacity-30">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
                </button>
            </div>
        </div>

        <!-- 遊戲視圖 -->
        <div id="gameView" class="hidden">
            <div id="gameStartScreen" class="py-12 bg-white rounded-3xl shadow-xl border border-slate-100 px-8 text-center">
                <div class="text-6xl mb-6">🎮</div>
                <h2 class="text-3xl font-bold text-slate-800 mb-6">台語挑戰賽</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                    <button onclick="selectGameMode('listen')" id="modeBtnListen" class="game-mode-btn p-4 border-2 border-indigo-600 bg-indigo-50 rounded-2xl text-left">🎧 聽力選選樂</button>
                    <button onclick="selectGameMode('match')" id="modeBtnMatch" class="game-mode-btn p-4 border-2 border-slate-100 bg-white rounded-2xl text-left">🧩 語詞配對</button>
                    <button onclick="selectGameMode('speak')" id="modeBtnSpeak" class="game-mode-btn p-4 border-2 border-slate-100 bg-white rounded-2xl text-left">🎙️ 口說挑戰</button>
                </div>
                <button onclick="startSelectedGame()" class="px-12 py-4 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg hover:bg-indigo-700 w-full max-w-xs transition-all">開始遊戲</button>
            </div>

            <!-- 聽力、配對模式（略，保持原功能） -->
            <div id="gamePlayListen" class="hidden">...</div>
            <div id="gamePlayMatch" class="hidden">...</div>

            <!-- 口說挑戰區（重點增強） -->
            <div id="gamePlaySpeak" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <div class="bg-rose-100 px-4 py-2 rounded-full text-rose-700 font-bold">得分: <span id="speakScore">0</span></div>
                    <button onclick="backToMenu()" class="text-slate-400">結束</button>
                </div>
                <div class="bg-white rounded-3xl shadow-xl p-8 mb-6 text-center">
                    <div id="speakTargetWord" class="text-5xl font-bold text-slate-800 mb-2">---</div>
                    <div id="speakTargetPoj" class="text-2xl text-indigo-500 mb-4 font-mono">---</div>
                    <div id="speakTargetMeaning" class="text-slate-400 mb-8 italic">義：---</div>
                    
                    <div id="recognitionResult" class="min-h-[100px] flex flex-col items-center justify-center text-slate-500 italic mb-8 p-4 bg-slate-50 rounded-2xl border-2 border-dashed border-indigo-200">
                        <div class="text-sm">系統準備中...</div>
                    </div>

                    <button id="micBtn" class="w-24 h-24 bg-rose-500 text-white rounded-full mx-auto flex items-center justify-center shadow-lg transition-all text-3xl hover:bg-rose-600 active:scale-95">🎙️</button>
                    <div id="micStatus" class="mt-4 text-rose-500 font-bold">點擊按鈕開始錄音</div>
                    <p class="text-xs text-slate-400 mt-2">提示：若無法辨識，請試著用較慢的語速發音</p>
                </div>
            </div>
            
            <div id="gameResultScreen" class="hidden text-center py-12 bg-white rounded-3xl shadow-xl p-8">
                <h2 class="text-3xl font-bold mb-4">挑戰結束！</h2>
                <div class="text-6xl font-black text-indigo-600 mb-8" id="finalScore">0</div>
                <button onclick="backToMenu()" class="px-8 py-3 bg-slate-100 rounded-xl hover:bg-slate-200 transition-all">返回主選單</button>
            </div>
        </div>
    </main>

    <audio id="audioPlayer" class="hidden"></audio>

    <script type="module">
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        const pageSize = 8;
        let gameMode = 'listen';
        let gameScore = 0;
        let currentQuestion = null;
        let recognition = null;
        let isRecognitionActive = false;

        // 核心增強：台語諧音匹配對照表 (Fuzzy Map)
        // 當系統聽台語卻用國語字回傳時，我們透過此表進行補償
        const TAIGI_FUZZY_MAP = {
            "食": ["吃", "呷", "甲", "食", "下", "下"],
            "飽": ["飽", "跑"],
            "未": ["沒", "妹", "尾", "袂"],
            "水": ["美", "水", "漂亮", "隨", "睡"],
            "你好": ["利好", "你好", "哩厚", "黎厚", "哩好"],
            "多謝": ["多謝", "多夏", "多下", "勞力"],
            "無": ["某", "謀", "無", "毛", "無"],
            "是": ["細", "係", "是", "吸", "系"],
            "這": ["結", "這", "擠", "這"],
            "那": ["彼", "嘿", "那", "比", "希"],
            "愛": ["愛", "哎"],
            "人": ["狼", "人"]
        };

        const audioPlayer = document.getElementById('audioPlayer');

        async function init() {
            try {
                await loadData();
                initSpeechRecognition();
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('studyView').classList.remove('hidden');
                renderGrid();
            } catch (err) {
                document.getElementById('loadingText').innerText = "系統初始化失敗";
            }
        }

        async function loadData() {
            const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSIS-1UF7kUUYsxnNgBtsyYNI9n5GAKh-fxtJkKjaGBk9VXxk07WILC_rLoB2-0wrhVjuJIVgqgIdIL/pub?output=csv';
            const response = await fetch(CSV_URL);
            const text = await response.text();
            
            const rows = text.split('\n').map(row => {
                const fields = [];
                let field = '', inQuotes = false;
                for (let char of row) {
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { fields.push(field); field = ''; }
                    else field += char;
                }
                fields.push(field);
                return fields;
            });

            allData = rows.slice(1).map((r, i) => ({
                id: `id-${i}`,
                word: r[1]?.trim() || '',
                audio: r[2]?.trim() || '',
                poj: r[5]?.trim() || '',
                meaning: r[6]?.trim() || '',
                category: r[7]?.trim() || '未分類'
            })).filter(d => d.word && d.audio);

            document.getElementById('dataStatus').innerText = `資料: ${allData.length}`;
            const cats = ['all', ...new Set(allData.map(d => d.category))];
            const sel = document.getElementById('categorySelect');
            sel.innerHTML = '';
            cats.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c === 'all' ? '所有分類' : c;
                sel.appendChild(opt);
            });
        }

        function initSpeechRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                console.error("此瀏覽器不支援 Web Speech API");
                return;
            }
            recognition = new SR();
            recognition.lang = 'zh-TW'; // 目前台語辨識最穩定的基礎設定
            recognition.interimResults = true; // 開啟即時預覽
            recognition.continuous = false; // 每次辨識完自動停止以利判斷

            recognition.onstart = () => { 
                isRecognitionActive = true; 
                updateMicUI(true); 
                document.getElementById('recognitionResult').innerHTML = '<div class="text-indigo-500 animate-pulse">聆聽中...請說台語</div>';
            };

            recognition.onend = () => { 
                isRecognitionActive = false; 
                updateMicUI(false); 
            };
            
            recognition.onresult = (e) => {
                const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
                const resultBox = document.getElementById('recognitionResult');
                
                resultBox.innerHTML = `<div>系統偵測：<span class="text-indigo-600 font-bold text-lg">${transcript}</span></div>`;
                
                if (e.results[0].isFinal) {
                    checkSpeakAnswer(transcript.trim());
                }
            };

            recognition.onerror = (e) => {
                isRecognitionActive = false;
                updateMicUI(false);
                const resultBox = document.getElementById('recognitionResult');
                if (e.error === 'no-speech') resultBox.innerText = "🔇 沒聽到聲音，請靠近麥克風試試。";
                else if (e.error === 'not-allowed') resultBox.innerText = "🚫 麥克風權限被拒絕。";
                else resultBox.innerText = "❌ 辨識出錯，請重試。";
            };
        }

        // 核心邏輯：如何判斷台語發音是否正確
        function checkSpeakAnswer(text) {
            if (!text) return;
            const target = currentQuestion.word;
            let isCorrect = false;

            // 1. 完全匹配
            if (text.includes(target)) {
                isCorrect = true;
            } 
            // 2. 模糊匹配 (檢查目標詞中的每個字是否有諧音出現在辨識結果中)
            else {
                let matchCount = 0;
                for (let char of target) {
                    const fuzzyCandidates = TAIGI_FUZZY_MAP[char] || [char];
                    if (fuzzyCandidates.some(c => text.includes(c))) {
                        matchCount++;
                    }
                }
                // 如果目標詞中超過一半的字都被諧音匹配到，則判定正確
                if (matchCount / target.length >= 0.5) {
                    isCorrect = true;
                }
            }

            const resultBox = document.getElementById('recognitionResult');
            if (isCorrect) {
                gameScore += 50;
                document.getElementById('speakScore').innerText = gameScore;
                resultBox.innerHTML = `<div class="text-green-600 font-bold text-xl">✅ 辨識成功！</div><div class="text-sm text-slate-400">內容：${text}</div>`;
                // 播放正確音效或直接下一題
                setTimeout(nextSpeakQuestion, 1500);
            } else {
                resultBox.innerHTML = `<div class="text-rose-500 font-bold">❌ 辨識失敗</div><div class="text-sm">聽起來像：${text}</div><div class="text-xs mt-2">提示：您可以試著唸慢一點</div>`;
            }
        }

        function nextSpeakQuestion() {
            if (!allData.length) return;
            currentQuestion = allData[Math.floor(Math.random() * allData.length)];
            document.getElementById('speakTargetWord').innerText = currentQuestion.word;
            document.getElementById('speakTargetPoj').innerText = currentQuestion.poj;
            document.getElementById('speakTargetMeaning').innerText = `義：${currentQuestion.meaning || '無'}`;
            document.getElementById('recognitionResult').innerHTML = '<div class="text-slate-400">等待錄音...</div>';
            updateMicUI(false);
        }

        function updateMicUI(active) {
            const btn = document.getElementById('micBtn');
            const status = document.getElementById('micStatus');
            if (active) {
                btn.classList.add('mic-active');
                status.innerText = "聆聽中...";
            } else {
                btn.classList.remove('mic-active');
                status.innerText = "點擊按鈕開始錄音";
            }
        }

        document.getElementById('micBtn').onclick = () => {
            if (!recognition) return;
            if (isRecognitionActive) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch(e) {
                    console.error("辨識啟動失敗", e);
                }
            }
        };

        // 導覽切換與頁面渲染（保持原功能並串接）
        function renderGrid() {
            const grid = document.getElementById('wordGrid');
            const cat = document.getElementById('categorySelect').value;
            filteredData = cat === 'all' ? allData : allData.filter(d => d.category === cat);
            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            grid.innerHTML = '';
            filteredData.slice((currentPage - 1) * pageSize, currentPage * pageSize).forEach(item => {
                const card = document.createElement('div');
                card.id = `card-${item.id}`;
                card.className = 'word-card bg-white p-5 rounded-2xl shadow-sm border-2 border-slate-200 flex justify-between items-center cursor-pointer hover:border-indigo-300';
                card.innerHTML = `<div><div class="flex flex-col"><span class="text-2xl font-bold">${item.word}</span><span class="text-indigo-500 font-mono">${item.poj}</span></div><div class="text-sm text-slate-400 mt-2">${item.meaning}</div></div><button class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center">🔊</button>`;
                card.onclick = () => { audioPlayer.src = item.audio; audioPlayer.play(); };
                grid.appendChild(card);
            });
            document.getElementById('pageInfo').innerText = `PAGE ${currentPage} / ${totalPages}`;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
        }

        document.getElementById('navStudy').onclick = () => {
            document.getElementById('studyView').classList.remove('hidden');
            document.getElementById('gameView').classList.add('hidden');
            document.getElementById('studyControls').classList.remove('invisible');
            document.getElementById('navStudy').className = 'px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600';
            document.getElementById('navGame').className = 'px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500';
        };

        document.getElementById('navGame').onclick = () => {
            document.getElementById('gameView').classList.remove('hidden');
            document.getElementById('studyView').classList.add('hidden');
            document.getElementById('studyControls').classList.add('invisible');
            document.getElementById('navGame').className = 'px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600';
            document.getElementById('navStudy').className = 'px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500';
            backToMenu();
        };

        window.selectGameMode = (mode) => {
            gameMode = mode;
            document.querySelectorAll('.game-mode-btn').forEach(btn => btn.classList.replace('border-indigo-600', 'border-slate-100'));
            document.querySelectorAll('.game-mode-btn').forEach(btn => btn.classList.replace('bg-indigo-50', 'bg-white'));
            const selected = document.getElementById(`modeBtn${mode.charAt(0).toUpperCase() + mode.slice(1)}`);
            selected.classList.replace('border-slate-100', 'border-indigo-600');
            selected.classList.replace('bg-white', 'bg-indigo-50');
        };

        window.startSelectedGame = () => {
            gameScore = 0;
            document.getElementById('gameStartScreen').classList.add('hidden');
            if (gameMode === 'speak') {
                document.getElementById('gamePlaySpeak').classList.remove('hidden');
                nextSpeakQuestion();
            } else {
                // 聽力、配對模式啟動邏輯...
            }
        };

        window.backToMenu = () => {
            if (isRecognitionActive) recognition.stop();
            ['gamePlaySpeak', 'gameResultScreen'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('gameStartScreen').classList.remove('hidden');
        };

        document.getElementById('categorySelect').onchange = () => { currentPage = 1; renderGrid(); };
        document.getElementById('prevPage').onclick = () => { if (currentPage > 1) { currentPage--; renderGrid(); } };
        document.getElementById('nextPage').onclick = () => { if (currentPage * pageSize < filteredData.length) { currentPage++; renderGrid(); } };

        init();
    </script>
</body>
</html>

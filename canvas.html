<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台語學習通 - 專業學習版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .word-card { transition: all 0.3s ease; }
        .word-card.playing { border-color: #6366f1; background-color: #eef2ff; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.2); transform: scale(1.02); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .draggable { cursor: grab; user-select: none; }
        .draggable:active { cursor: grabbing; }
        .drop-zone.drag-over { background-color: #e0e7ff; border-color: #6366f1; transform: scale(1.05); }
        .matched-item { opacity: 0.3; pointer-events: none; }
        .star-active { color: #f59e0b !important; fill: #f59e0b; }
        .shake { animation: shake 0.5s linear; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="sticky top-0 z-20 bg-white shadow-sm border-b border-slate-200 p-4">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-indigo-600">台語學習通</h1>
                <nav class="flex bg-slate-100 p-1 rounded-xl">
                    <button id="navStudy" class="px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600">學習</button>
                    <button id="navGame" class="px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500 hover:text-indigo-600 transition-all">遊戲</button>
                </nav>
            </div>
            <div id="studyControls" class="flex items-center gap-2">
                <select id="categorySelect" class="bg-slate-100 border-none rounded-lg px-3 py-2 text-sm font-medium text-slate-700 focus:ring-2 focus:ring-indigo-500">
                    <option value="all">載入中...</option>
                </select>
                <button id="toggleFavorites" class="bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium hover:bg-amber-50">⭐ 收藏夾</button>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 sm:p-6 max-w-4xl w-full mx-auto">
        <div id="loadingOverlay" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p id="loadingText" class="text-slate-500">正在同步雲端題庫...</p>
        </div>

        <!-- 學習視窗 -->
        <div id="studyView" class="hidden">
            <div class="flex flex-wrap gap-2 mb-6">
                <button id="playPageBtn" class="flex-1 py-3 bg-indigo-100 text-indigo-700 font-bold rounded-xl hover:bg-indigo-200 transition-all">📄 播放本頁</button>
                <button id="playAllBtn" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-all">🔁 播放全部</button>
                <button id="stopPlayBtn" class="hidden px-6 py-3 bg-rose-100 text-rose-600 font-bold rounded-xl hover:bg-rose-200 transition-all">停止</button>
            </div>
            <div id="wordGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            <div id="pagination" class="flex items-center justify-center gap-6 mt-10 mb-20">
                <button id="prevPage" class="p-3 rounded-full bg-white border border-slate-200 disabled:opacity-30">◀</button>
                <span id="pageInfo" class="font-bold text-slate-600">PAGE 1 / 1</span>
                <button id="nextPage" class="p-3 rounded-full bg-white border border-slate-200 disabled:opacity-30">▶</button>
            </div>
        </div>

        <!-- 遊戲視窗 -->
        <div id="gameView" class="hidden">
            <div id="gameStartScreen" class="py-12 bg-white rounded-3xl shadow-xl border p-8 text-center">
                <h2 class="text-3xl font-bold mb-6">挑戰賽設定</h2>
                <div class="grid grid-cols-2 gap-4 mb-6 text-left">
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-1">選擇模式</label>
                        <select id="gameModeSelect" class="w-full p-3 bg-slate-100 rounded-xl border-none">
                            <option value="listen">聽力選選樂</option>
                            <option value="match">拖拉配對王</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-1">單字範圍</label>
                        <select id="gameScopeSelect" class="w-full p-3 bg-slate-100 rounded-xl border-none">
                            <option value="current">目前分類</option>
                            <option value="all">所有分類</option>
                            <option value="fav">僅限星號收藏 (⭐)</option>
                        </select>
                    </div>
                </div>
                <button onclick="startSelectedGame()" class="w-full py-4 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg hover:bg-indigo-700 mb-8 transition-transform active:scale-95">開始挑戰</button>
                
                <div class="border-t pt-6 text-left">
                    <h3 class="font-bold text-slate-400 mb-4 uppercase tracking-widest text-xs">🏆 榮譽榜 (最高得分)</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="bg-indigo-50 p-4 rounded-xl">
                            <div class="text-indigo-400 text-xs font-bold">聽力選選樂</div>
                            <div class="flex justify-between items-end mt-1">
                                <span id="highScoreNameListen" class="text-slate-600 font-bold">無</span>
                                <span id="highScoreListen" class="text-2xl font-black text-indigo-600">0</span>
                            </div>
                        </div>
                        <div class="bg-indigo-50 p-4 rounded-xl">
                            <div class="text-indigo-400 text-xs font-bold">拖拉配對王</div>
                            <div class="flex justify-between items-end mt-1">
                                <span id="highScoreNameMatch" class="text-slate-600 font-bold">無</span>
                                <span id="highScoreMatch" class="text-2xl font-black text-indigo-600">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 聽力遊戲介面 -->
            <div id="gamePlayListen" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <div class="bg-indigo-100 px-4 py-2 rounded-full font-bold text-indigo-700">得分: <span id="listenScore">0</span></div>
                    <button onclick="backToMenu()" class="text-slate-400 font-bold hover:text-rose-500">結束</button>
                </div>
                <div class="bg-white rounded-3xl shadow-xl p-8 mb-6 text-center">
                    <button id="listenMainAudioBtn" class="w-24 h-24 bg-indigo-600 text-white rounded-full mx-auto text-4xl shadow-lg hover:scale-105 transition-all active:scale-95">🔊</button>
                </div>
                <div id="listenOptions" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>

            <!-- 配對遊戲介面 -->
            <div id="gamePlayMatch" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <div class="bg-indigo-100 px-4 py-2 rounded-full font-bold text-indigo-700">得分: <span id="matchScore">0</span></div>
                    <button onclick="backToMenu()" class="text-slate-400 font-bold hover:text-rose-500">結束</button>
                </div>
                <div class="grid grid-cols-2 gap-4"><div id="matchWordsCol" class="space-y-3"></div><div id="matchPojCol" class="space-y-3"></div></div>
                <div id="matchFeedback" class="mt-8 text-center font-bold h-6"></div>
            </div>
            
            <!-- 結算介面 -->
            <div id="gameResultScreen" class="hidden text-center py-12 bg-white rounded-3xl shadow-xl p-8">
                <h2 class="text-3xl font-bold mb-2">挑戰結束！</h2>
                <p id="newRecordMsg" class="text-amber-500 font-bold mb-4 hidden">🎉 恭喜！創下新紀錄！</p>
                <div class="text-7xl font-black text-indigo-600 mb-8" id="finalScore">0</div>
                <div id="nameInputArea" class="mb-8 hidden">
                    <label class="block text-sm font-bold text-slate-400 mb-2">請輸入您的名字留名榮譽榜：</label>
                    <input type="text" id="playerNameInput" maxlength="10" placeholder="名字..." class="p-3 border-2 border-indigo-100 rounded-xl text-center font-bold focus:border-indigo-500 outline-none">
                </div>
                <button onclick="saveAndExit()" class="px-8 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 transition-all">確認返回</button>
            </div>
        </div>
    </main>

    <audio id="audioPlayer" class="hidden"></audio>

    <script type="module">
        let allData = [];
        let filteredData = [];
        let favorites = JSON.parse(localStorage.getItem('taigi_favs') || '[]');
        let highScores = JSON.parse(localStorage.getItem('taigi_highscores_v2') || '{"listen":{"score":0,"name":"無"},"match":{"score":0,"name":"無"}}');
        let currentPage = 1;
        const pageSize = 8;
        let isAutoPlaying = false;
        let isShowFavoritesOnly = false;
        let playList = [];
        let currentPlayIndex = -1;
        let gameScore = 0;
        let currentQuestion = null;
        let currentPlayMode = 'single';
        let activeGameMode = '';

        const audioPlayer = document.getElementById('audioPlayer');

        async function init() {
            updateScoreDisplay();
            await loadData();
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('studyView').classList.remove('hidden');
            renderGrid();
        }

        // 強化版 CSV 解析器
        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            return lines.filter(l => l.trim()).map(line => {
                const result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
                        else inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        result.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                result.push(current.trim());
                return result;
            });
        }

        async function loadData() {
            try {
                const response = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vSIS-1UF7kUUYsxnNgBtsyYNI9n5GAKh-fxtJkKjaGBk9VXxk07WILC_rLoB2-0wrhVjuJIVgqgIdIL/pub?output=csv');
                const text = await response.text();
                const rows = parseCSV(text);
                
                allData = rows.slice(1).map((r, i) => ({
                    id: `id-${i}`, 
                    word: r[1] || '',     // 語詞
                    audio: r[2] || '',    // 聲音檔
                    poj: r[5] || '',      // 羅馬拼音
                    meaning: r[6] || '',  // 釋義
                    category: r[7] || '未分類', // 分類
                    dictUrl: r[8] || ''   // I 欄：字典連結
                })).filter(d => d.word && d.audio);

                const cats = ['all', ...new Set(allData.map(d => d.category))];
                const sel = document.getElementById('categorySelect');
                sel.innerHTML = '';
                cats.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.textContent = c === 'all' ? '所有分類' : c; sel.appendChild(opt);
                });
            } catch (err) {
                document.getElementById('loadingText').innerText = "連線失敗，請檢查網路。";
            }
        }

        function updateScoreDisplay() {
            document.getElementById('highScoreListen').innerText = highScores.listen.score;
            document.getElementById('highScoreNameListen').innerText = highScores.listen.name;
            document.getElementById('highScoreMatch').innerText = highScores.match.score;
            document.getElementById('highScoreNameMatch').innerText = highScores.match.name;
        }

        window.toggleFavorite = function(id) {
            if (favorites.includes(id)) favorites = favorites.filter(f => f !== id);
            else favorites.push(id);
            localStorage.setItem('taigi_favs', JSON.stringify(favorites));
            renderGrid();
        };

        function renderGrid() {
            const grid = document.getElementById('wordGrid');
            const cat = document.getElementById('categorySelect').value;
            filteredData = allData.filter(d => {
                const matchCat = cat === 'all' || d.category === cat;
                const matchFav = !isShowFavoritesOnly || favorites.includes(d.id);
                return matchCat && matchFav;
            });
            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            grid.innerHTML = '';
            const items = filteredData.slice((currentPage - 1) * pageSize, currentPage * pageSize);
            
            items.forEach((item) => {
                const isFav = favorites.includes(item.id);
                const card = document.createElement('div');
                card.id = `card-${item.id}`;
                card.className = `word-card bg-white p-6 rounded-2xl shadow-sm border-2 border-slate-200 flex justify-between items-center cursor-pointer hover:border-indigo-300`;
                card.innerHTML = `
                    <div class="flex-grow">
                        <div class="flex items-center gap-4">
                            <span class="text-3xl font-bold text-slate-800">${item.word}</span>
                            <span class="text-3xl font-bold text-indigo-500 font-mono">${item.poj}</span>
                        </div>
                        <div class="flex gap-4 mt-2 items-center">
                            <span class="text-lg text-slate-400 font-medium">${item.meaning}</span>
                            ${item.dictUrl ? `<a href="${item.dictUrl}" target="_blank" class="text-indigo-400 hover:text-indigo-600 font-bold" onclick="event.stopPropagation()">📖</a>` : ''}
                            <span onclick="event.stopPropagation(); window.toggleFavorite('${item.id}')" class="cursor-pointer ${isFav ? 'star-active text-amber-500' : 'text-slate-300'} hover:scale-125 transition-all text-2xl">★</span>
                        </div>
                    </div>
                    <button class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-xl">🔊</button>
                `;
                card.onclick = () => {
                    if (isAutoPlaying) {
                        const globalIdx = filteredData.indexOf(item);
                        if (globalIdx !== -1) { currentPlayIndex = globalIdx; playCurrentFromList(); }
                    } else { playAudio(item.audio); }
                };
                grid.appendChild(card);
            });
            document.getElementById('pageInfo').innerText = `PAGE ${currentPage} / ${totalPages}`;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
        }

        function playAudio(url) {
            audioPlayer.src = url;
            audioPlayer.play().catch(e => console.warn("播放受限", e));
        }

        function startAutoPlay(mode) {
            isAutoPlaying = true;
            currentPlayMode = mode;
            playList = filteredData; 
            currentPlayIndex = mode === 'page' ? (currentPage - 1) * pageSize : 0;
            document.getElementById('stopPlayBtn').classList.remove('hidden');
            playCurrentFromList();
        }

        function playCurrentFromList() {
            if (!isAutoPlaying || currentPlayIndex >= playList.length) { stopAutoPlay(); return; }
            if (currentPlayMode === 'page' && currentPlayIndex > (currentPage * pageSize) - 1) { stopAutoPlay(); return; }

            const item = playList[currentPlayIndex];
            const targetPage = Math.floor(filteredData.indexOf(item) / pageSize) + 1;
            if (targetPage !== currentPage) { currentPage = targetPage; renderGrid(); }

            document.querySelectorAll('.word-card').forEach(c => c.classList.remove('playing'));
            const card = document.getElementById(`card-${item.id}`);
            if (card) { card.classList.add('playing'); card.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            playAudio(item.audio);
        }

        audioPlayer.onended = () => { if (isAutoPlaying) { currentPlayIndex++; setTimeout(playCurrentFromList, 800); } };
        function stopAutoPlay() { isAutoPlaying = false; audioPlayer.pause(); document.querySelectorAll('.word-card').forEach(c => c.classList.remove('playing')); document.getElementById('stopPlayBtn').classList.add('hidden'); }

        document.getElementById('playPageBtn').onclick = () => startAutoPlay('page');
        document.getElementById('playAllBtn').onclick = () => startAutoPlay('all');
        document.getElementById('stopPlayBtn').onclick = stopAutoPlay;

        // --- 遊戲邏輯 ---
        window.startSelectedGame = () => {
            const mode = document.getElementById('gameModeSelect').value;
            const scope = document.getElementById('gameScopeSelect').value;
            activeGameMode = mode;
            
            let pool = [];
            if (scope === 'current') pool = [...filteredData];
            else if (scope === 'all') pool = [...allData];
            else if (scope === 'fav') pool = allData.filter(d => favorites.includes(d.id));
            
            if (pool.length < 5) { alert('單字數量不足（至少需 5 個），請切換範圍或多收藏一些單字。'); return; }
            
            window.gamePool = pool;
            gameScore = 0;
            document.getElementById('gameStartScreen').classList.add('hidden');
            if (mode === 'listen') { 
                document.getElementById('gamePlayListen').classList.remove('hidden'); 
                document.getElementById('listenScore').innerText = '0';
                nextListenQuestion(); 
            }
            else { 
                document.getElementById('gamePlayMatch').classList.remove('hidden'); 
                document.getElementById('matchScore').innerText = '0';
                nextMatchRound(); 
            }
        };

        function nextListenQuestion() {
            const pool = window.gamePool;
            currentQuestion = pool[Math.floor(Math.random() * pool.length)];
            const options = [currentQuestion];
            while (options.length < 4) {
                const r = pool[Math.floor(Math.random() * pool.length)];
                if (!options.find(o => o.id === r.id)) options.push(r);
            }
            options.sort(() => Math.random() - 0.5);
            const container = document.getElementById('listenOptions');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'p-5 bg-white border-2 border-slate-200 rounded-2xl font-bold text-xl hover:border-indigo-500 hover:bg-indigo-50 transition-all active:scale-95';
                btn.innerText = opt.word;
                btn.onclick = () => {
                    if (opt.id === currentQuestion.id) { gameScore += 10; document.getElementById('listenScore').innerText = gameScore; nextListenQuestion(); } 
                    else { endGame('listen'); }
                };
                container.appendChild(btn);
            });
            playAudio(currentQuestion.audio);
        }
        document.getElementById('listenMainAudioBtn').onclick = () => playAudio(currentQuestion.audio);

        function nextMatchRound() {
            const pool = window.gamePool;
            const items = [...pool].sort(() => Math.random() - 0.5).slice(0, 5);
            const wordsCol = document.getElementById('matchWordsCol');
            const pojCol = document.getElementById('matchPojCol');
            const feedback = document.getElementById('matchFeedback');
            wordsCol.innerHTML = ''; pojCol.innerHTML = ''; feedback.innerText = '';
            
            const words = [...items].sort(() => Math.random() - 0.5);
            const pojs = [...items].sort(() => Math.random() - 0.5);
            
            words.forEach(it => {
                const div = document.createElement('div');
                div.id = `drag-${it.id}`; div.draggable = true; div.innerText = it.word;
                div.className = 'draggable p-4 bg-white border-2 border-indigo-200 rounded-xl font-bold text-2xl text-center shadow-sm';
                div.ondragstart = (e) => e.dataTransfer.setData('text', it.id);
                wordsCol.appendChild(div);
            });
            
            pojs.forEach(it => {
                const div = document.createElement('div');
                div.className = 'drop-zone p-4 bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl font-mono text-2xl text-center font-bold text-slate-500 transition-colors';
                div.innerText = it.poj;
                div.ondragover = (e) => { e.preventDefault(); div.classList.add('bg-indigo-50', 'border-indigo-400'); };
                div.ondragleave = () => div.classList.remove('bg-indigo-50', 'border-indigo-400');
                div.ondrop = (e) => {
                    e.preventDefault(); 
                    div.classList.remove('bg-indigo-50', 'border-indigo-400');
                    if (e.dataTransfer.getData('text') === it.id) {
                        gameScore += 20; 
                        document.getElementById('matchScore').innerText = gameScore;
                        playAudio(it.audio);
                        div.className = 'p-4 bg-green-100 border-2 border-green-500 rounded-xl font-bold text-2xl text-center text-green-700';
                        div.innerText = `✅ ${it.word}`;
                        document.getElementById(`drag-${it.id}`).classList.add('matched-item');
                        if (!document.querySelector('.draggable:not(.matched-item)')) setTimeout(nextMatchRound, 1000);
                    } else { 
                        div.classList.add('shake'); setTimeout(() => div.classList.remove('shake'), 500);
                        feedback.innerText = '❌ 配對錯誤！'; feedback.className = "mt-4 text-rose-500 font-bold"; setTimeout(() => feedback.innerText = '', 1000); 
                    }
                };
                pojCol.appendChild(div);
            });
        }

        function endGame(mode) {
            document.getElementById('gamePlayListen').classList.add('hidden');
            document.getElementById('gamePlayMatch').classList.add('hidden');
            document.getElementById('gameResultScreen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = gameScore;
            
            if (gameScore > highScores[mode].score) {
                document.getElementById('newRecordMsg').classList.remove('hidden');
                document.getElementById('nameInputArea').classList.remove('hidden');
            } else {
                document.getElementById('newRecordMsg').classList.add('hidden');
                document.getElementById('nameInputArea').classList.add('hidden');
            }
        }

        window.saveAndExit = () => {
            const mode = activeGameMode;
            if (gameScore > highScores[mode].score) {
                const name = document.getElementById('playerNameInput').value.trim() || '不具名高手';
                highScores[mode] = { score: gameScore, name: name };
                localStorage.setItem('taigi_highscores_v2', JSON.stringify(highScores));
                updateScoreDisplay();
            }
            document.getElementById('playerNameInput').value = '';
            backToMenu();
        };

        window.backToMenu = () => {
            document.getElementById('gamePlayListen').classList.add('hidden');
            document.getElementById('gamePlayMatch').classList.add('hidden');
            document.getElementById('gameResultScreen').classList.add('hidden');
            document.getElementById('gameStartScreen').classList.remove('hidden');
        };

        document.getElementById('navStudy').onclick = () => { document.getElementById('studyView').classList.remove('hidden'); document.getElementById('gameView').classList.add('hidden'); };
        document.getElementById('navGame').onclick = () => { document.getElementById('gameView').classList.remove('hidden'); document.getElementById('studyView').classList.add('hidden'); backToMenu(); };
        document.getElementById('categorySelect').onchange = () => { stopAutoPlay(); currentPage = 1; renderGrid(); };
        document.getElementById('toggleFavorites').onclick = () => { isShowFavoritesOnly = !isShowFavoritesOnly; document.getElementById('toggleFavorites').classList.toggle('bg-amber-100'); renderGrid(); };
        document.getElementById('prevPage').onclick = () => { if (currentPage > 1) { stopAutoPlay(); currentPage--; renderGrid(); } };
        document.getElementById('nextPage').onclick = () => { if (currentPage * pageSize < filteredData.length) { stopAutoPlay(); currentPage++; renderGrid(); } };

        init();
    </script>
</body>
</html>

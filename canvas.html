<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台語學習通 - 穩定修正版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; touch-action: manipulation; }
        .word-card { transition: all 0.3s ease; }
        .word-card.playing { border-color: #6366f1; background-color: #eef2ff; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.2); transform: scale(1.02); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .draggable { cursor: grab; user-select: none; touch-action: none; position: relative; z-index: 10; }
        .draggable:active { cursor: grabbing; }
        .dragging { opacity: 0.5; transform: scale(1.05); }
        .drop-zone.drag-over { background-color: #e0e7ff; border-color: #6366f1; transform: scale(1.02); }
        .matched-item { opacity: 0.3 !important; pointer-events: none !important; }
        
        .star-active { color: #f59e0b !important; fill: #f59e0b; }
        .shake { animation: shake 0.5s linear; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="sticky top-0 z-30 bg-white shadow-sm border-b border-slate-200 p-4">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-indigo-600">台語學習通</h1>
                <nav class="flex bg-slate-100 p-1 rounded-xl">
                    <button id="navStudy" class="nav-btn px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600">學習</button>
                    <button id="navGame" class="nav-btn px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500 hover:text-indigo-600 transition-all">遊戲</button>
                </nav>
            </div>
            <div id="topControls" class="flex items-center gap-2">
                <select id="categorySelect" class="bg-slate-100 border-none rounded-lg px-3 py-2 text-sm font-medium text-slate-700 focus:ring-2 focus:ring-indigo-500">
                    <option value="all">載入中...</option>
                </select>
                <button id="toggleFavorites" class="bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium hover:bg-amber-50">⭐ 收藏夾</button>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 sm:p-6 max-w-4xl w-full mx-auto">
        <div id="loadingOverlay" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p class="text-slate-500">正在準備教材內容...</p>
        </div>

        <div id="studyView" class="hidden">
            <div class="flex flex-wrap gap-2 mb-6">
                <button id="playPageBtn" class="flex-1 py-3 bg-indigo-100 text-indigo-700 font-bold rounded-xl hover:bg-indigo-200">📄 播放本頁</button>
                <button id="playAllBtn" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700">🔁 連續播放</button>
                <button id="stopPlayBtn" class="hidden px-6 py-3 bg-rose-100 text-rose-600 font-bold rounded-xl">停止</button>
            </div>
            <div id="wordGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            
            <div id="pagination" class="flex items-center justify-center gap-4 mt-10 mb-20">
                <button id="prevPage" class="p-3 rounded-full bg-white border border-slate-200 disabled:opacity-30">◀</button>
                <div class="bg-white border border-slate-200 px-4 py-2 rounded-xl shadow-sm flex items-center gap-2">
                    <select id="pageSelect" class="bg-transparent border-none font-bold text-indigo-600 cursor-pointer"></select>
                    <span id="totalPagesText" class="text-slate-500 text-sm">/ 1 頁</span>
                </div>
                <button id="nextPage" class="p-3 rounded-full bg-white border border-slate-200 disabled:opacity-30">▶</button>
            </div>
        </div>

        <div id="gameView" class="hidden">
            <div id="gameStartScreen" class="py-12 bg-white rounded-3xl shadow-xl border p-8 text-center">
                <h2 class="text-3xl font-bold mb-4 text-slate-800">挑戰遊戲</h2>
                <p id="gameScopeIndicator" class="mb-8 text-indigo-600 font-medium bg-indigo-50 py-2 px-4 rounded-full inline-block">範圍：所有單字</p>
                <div class="max-w-xs mx-auto mb-8 text-left">
                    <label class="block text-sm font-bold text-slate-500 mb-2">選擇遊戲模式</label>
                    <select id="gameModeSelect" class="w-full p-4 bg-slate-50 rounded-xl border-2 border-slate-100">
                        <option value="listen">聽力選選樂</option>
                        <option value="match">拖拉配對王</option>
                    </select>
                </div>
                <button id="startGameBtn" class="w-full max-w-sm py-4 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg hover:bg-indigo-700 transition-all active:scale-95 text-lg">開始練習</button>
            </div>

            <div id="gamePlayListen" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <div class="bg-indigo-100 px-4 py-2 rounded-full font-bold text-indigo-700">得分: <span id="listenScore">0</span></div>
                    <button class="exit-game-btn text-slate-400 font-bold">返回選單</button>
                </div>
                <div class="bg-white rounded-3xl shadow-xl p-10 mb-8 text-center">
                    <button id="listenMainAudioBtn" class="w-28 h-28 bg-indigo-600 text-white rounded-full mx-auto text-5xl shadow-lg hover:scale-105 active:scale-95">🔊</button>
                    <p class="mt-4 text-slate-400 text-sm italic">點擊喇叭聽題目</p>
                </div>
                <div id="listenOptions" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>

            <div id="gamePlayMatch" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <div class="bg-indigo-100 px-4 py-2 rounded-full font-bold text-indigo-700">得分: <span id="matchScore">0</span></div>
                    <button class="exit-game-btn text-slate-400 font-bold">返回選單</button>
                </div>
                <div class="grid grid-cols-2 gap-4 sm:gap-6">
                    <div id="matchWordsCol" class="space-y-3"></div>
                    <div id="matchPojCol" class="space-y-3"></div>
                </div>
                <div id="nextRoundPulse" class="hidden mt-6 text-center text-green-600 font-bold animate-bounce">太棒了！準備進入下一關...</div>
            </div>

            <div id="gameResultScreen" class="hidden text-center py-16 bg-white rounded-3xl shadow-xl p-8">
                <h2 class="text-2xl font-bold mb-4 text-slate-500">練習完成！</h2>
                <p class="text-slate-400 font-medium">您的本次得分</p>
                <div class="text-8xl font-black text-indigo-600 my-8" id="finalScore">0</div>
                <button onclick="location.reload()" class="px-10 py-4 bg-indigo-600 text-white font-bold rounded-2xl shadow-md hover:bg-indigo-700">再次挑戰</button>
                <button class="exit-game-btn block mx-auto mt-6 text-slate-400 font-bold">回到選單</button>
            </div>
        </div>
    </main>

    <audio id="audioPlayer" class="hidden"></audio>

    <script>
        let allData = [];
        let filteredData = [];
        let favorites = JSON.parse(localStorage.getItem('taigi_favs') || '[]');
        let currentPage = 1;
        const pageSize = 10;
        let isAutoPlaying = false;
        let gameScore = 0;
        let gamePool = [];
        let currentQuestion = null;
        let currentMatchCount = 0;
        let currentRoundTotal = 0;

        const audioPlayer = document.getElementById('audioPlayer');

        async function init() {
            await loadCSVData();
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('studyView').classList.remove('hidden');
            renderGrid();
        }

        async function loadCSVData() {
            try {
                const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSIS-1UF7kUUYsxnNgBtsyYNI9n5GAKh-fxtJkKjaGBk9VXxk07WILC_rLoB2-0wrhVjuJIVgqgIdIL/pub?output=csv';
                const response = await fetch(url);
                const text = await response.text();
                const lines = text.split(/\r?\n/).filter(l => l.trim());
                
                allData = lines.slice(1).map((line, i) => {
                    const r = parseCSVLine(line);
                    return {
                        id: `it-${i}`,
                        dbIndex: i + 1,
                        word: r[1] ? r[1].trim() : '',      
                        audio: r[2] ? r[2].trim() : '',     
                        poj: r[5] ? r[5].trim() : '',       
                        meaning: r[6] ? r[6].trim() : '',   
                        category: r[7] ? r[7].trim() : '未分類'
                    };
                }).filter(d => d.word && d.audio && d.poj); // 重要：強制過濾掉沒有拼音或單字的無效行

                const categories = ['all', ...new Set(allData.map(d => d.category))];
                document.getElementById('categorySelect').innerHTML = categories.map(c => `<option value="${c}">${c === 'all' ? '所有分類' : c}</option>`).join('');
            } catch (err) {
                console.error("CSV載入失敗", err);
            }
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '', inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
                    else inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim()); current = '';
                } else { current += char; }
            }
            result.push(current.trim());
            return result;
        }

        function renderGrid() {
            const cat = document.getElementById('categorySelect').value;
            const favOnly = document.getElementById('toggleFavorites').classList.contains('bg-amber-100');
            
            filteredData = allData.filter(d => {
                const matchCat = (cat === 'all' || d.category === cat);
                const matchFav = !favOnly || favorites.includes(d.id);
                return matchCat && matchFav;
            });

            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            document.getElementById('pageSelect').innerHTML = Array.from({length: totalPages}, (_, i) => `<option value="${i+1}" ${currentPage === i+1 ? 'selected' : ''}>${i+1}</option>`).join('');
            document.getElementById('totalPagesText').innerText = `/ ${totalPages} 頁`;

            const grid = document.getElementById('wordGrid');
            grid.innerHTML = '';
            const items = filteredData.slice((currentPage - 1) * pageSize, currentPage * pageSize);
            
            items.forEach(item => {
                const isFav = favorites.includes(item.id);
                const card = document.createElement('div');
                card.id = `card-${item.id}`;
                card.className = `word-card bg-white p-5 rounded-2xl shadow-sm border-2 border-slate-200 flex justify-between items-center cursor-pointer hover:border-indigo-300 relative`;
                card.innerHTML = `
                    <div class="absolute top-2 left-3 text-[10px] font-bold text-slate-300">#${item.dbIndex}</div>
                    <div class="mt-2">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl font-bold">${item.word}</span>
                            <span class="text-xl font-bold text-indigo-500 font-mono">${item.poj}</span>
                        </div>
                        <div class="flex gap-3 mt-1 items-center">
                            <span class="text-sm text-slate-400">${item.meaning}</span>
                            <span class="fav-btn cursor-pointer ${isFav ? 'star-active text-amber-500' : 'text-slate-300'} text-xl">★</span>
                        </div>
                    </div>
                    <button class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center">🔊</button>
                `;
                card.querySelector('.fav-btn').onclick = (e) => {
                    e.stopPropagation();
                    toggleFav(item.id);
                    renderGrid();
                };
                card.onclick = () => playAudio(item.audio);
                grid.appendChild(card);
            });

            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
        }

        function toggleFav(id) {
            if (favorites.includes(id)) favorites = favorites.filter(f => f !== id);
            else favorites.push(id);
            localStorage.setItem('taigi_favs', JSON.stringify(favorites));
        }

        function playAudio(url) {
            if (!url) return;
            audioPlayer.src = url;
            audioPlayer.play().catch(() => {});
        }

        function startGame() {
            gamePool = [...filteredData];
            if (gamePool.length < 5) {
                alert("目前範圍單字太少，請至少選擇 5 個單字。");
                return;
            }
            gameScore = 0;
            document.getElementById('gameStartScreen').classList.add('hidden');
            const mode = document.getElementById('gameModeSelect').value;
            
            if (mode === 'listen') {
                document.getElementById('gamePlayListen').classList.remove('hidden');
                nextListenQuestion();
            } else {
                document.getElementById('gamePlayMatch').classList.remove('hidden');
                nextMatchRound();
            }
        }

        function nextListenQuestion() {
            currentQuestion = gamePool[Math.floor(Math.random() * gamePool.length)];
            let options = [currentQuestion];
            while (options.length < 4) {
                const r = gamePool[Math.floor(Math.random() * gamePool.length)];
                if (!options.find(o => o.id === r.id)) options.push(r);
            }
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('listenOptions');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'p-5 bg-white border-2 border-slate-100 rounded-2xl font-bold hover:border-indigo-500 active:scale-95 flex flex-col items-center';
                btn.innerHTML = `<span class="text-2xl">${opt.word}</span><span class="text-sm text-indigo-400 mt-1">${opt.poj}</span>`;
                btn.onclick = () => {
                    if (opt.id === currentQuestion.id) {
                        gameScore += 10;
                        document.getElementById('listenScore').innerText = gameScore;
                        nextListenQuestion();
                    } else endGame();
                };
                container.appendChild(btn);
            });
            playAudio(currentQuestion.audio);
        }

        function enableTouchDrag(el, it) {
            let startX, startY, initialX, initialY;
            let currentDragged = null;

            el.addEventListener('touchstart', (e) => {
                if (el.classList.contains('matched-item')) return;
                const touch = e.touches[0];
                startX = touch.clientX; startY = touch.clientY;
                const rect = el.getBoundingClientRect();
                initialX = rect.left; initialY = rect.top;
                
                currentDragged = el.cloneNode(true);
                currentDragged.style.position = 'fixed';
                currentDragged.style.width = rect.width + 'px';
                currentDragged.style.left = initialX + 'px';
                currentDragged.style.top = initialY + 'px';
                currentDragged.style.opacity = '0.8';
                currentDragged.style.zIndex = '1000';
                currentDragged.style.pointerEvents = 'none';
                document.body.appendChild(currentDragged);
                el.classList.add('dragging');
            });

            el.addEventListener('touchmove', (e) => {
                if (!currentDragged) return;
                e.preventDefault();
                const touch = e.touches[0];
                currentDragged.style.left = (initialX + (touch.clientX - startX)) + 'px';
                currentDragged.style.top = (initialY + (touch.clientY - startY)) + 'px';

                document.querySelectorAll('.drop-zone').forEach(zone => {
                    const zRect = zone.getBoundingClientRect();
                    if (touch.clientX > zRect.left && touch.clientX < zRect.right &&
                        touch.clientY > zRect.top && touch.clientY < zRect.bottom) {
                        zone.classList.add('drag-over');
                    } else zone.classList.remove('drag-over');
                });
            }, { passive: false });

            el.addEventListener('touchend', (e) => {
                if (!currentDragged) return;
                const touch = e.changedTouches[0];
                document.querySelectorAll('.drop-zone').forEach(zone => {
                    zone.classList.remove('drag-over');
                    const zRect = zone.getBoundingClientRect();
                    if (touch.clientX > zRect.left && touch.clientX < zRect.right &&
                        touch.clientY > zRect.top && touch.clientY < zRect.bottom) {
                        if (zone.dataset.id === it.id) handleMatchSuccess(it, zone);
                        else { zone.classList.add('shake'); setTimeout(() => zone.classList.remove('shake'), 500); }
                    }
                });
                if (currentDragged.parentNode) document.body.removeChild(currentDragged);
                currentDragged = null;
                el.classList.remove('dragging');
            });
        }

        function nextMatchRound() {
            document.getElementById('nextRoundPulse').classList.add('hidden');
            // 重要：再次過濾 gamePool 確保拿到的 5 個都有 POJ
            let validItems = gamePool.filter(i => i.poj && i.poj.trim() !== "");
            const poolSize = Math.min(validItems.length, 5);
            const items = [...validItems].sort(() => Math.random() - 0.5).slice(0, poolSize);
            
            currentMatchCount = 0;
            currentRoundTotal = poolSize;

            const wordsCol = document.getElementById('matchWordsCol');
            const pojCol = document.getElementById('matchPojCol');
            wordsCol.innerHTML = ''; pojCol.innerHTML = '';
            
            const words = [...items].sort(() => Math.random() - 0.5);
            const pojs = [...items].sort(() => Math.random() - 0.5);
            
            words.forEach(it => {
                const div = document.createElement('div');
                div.id = `drag-${it.id}`; div.draggable = true;
                div.className = 'draggable p-3 sm:p-4 bg-white border-2 border-indigo-100 rounded-xl font-bold text-lg text-center shadow-sm relative pt-6';
                div.innerHTML = `<span class="absolute top-1 left-2 text-[9px] text-slate-300">#${it.dbIndex}</span>${it.word}`;
                div.ondragstart = (e) => { e.dataTransfer.setData('text', it.id); div.classList.add('dragging'); };
                div.ondragend = () => div.classList.remove('dragging');
                enableTouchDrag(div, it);
                wordsCol.appendChild(div);
            });

            pojs.forEach(it => {
                const div = document.createElement('div');
                div.className = 'drop-zone p-3 sm:p-4 bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl font-mono text-sm text-center font-bold flex items-center justify-center min-h-[60px]';
                div.innerText = it.poj;
                div.dataset.id = it.id;
                div.ondragover = (e) => { e.preventDefault(); div.classList.add('drag-over'); };
                div.ondragleave = () => div.classList.remove('drag-over');
                div.ondrop = (e) => {
                    e.preventDefault();
                    const draggedId = e.dataTransfer.getData('text');
                    if (draggedId === it.id) handleMatchSuccess(it, div);
                    else { div.classList.add('shake'); setTimeout(() => div.classList.remove('shake'), 500); }
                    div.classList.remove('drag-over');
                };
                pojCol.appendChild(div);
            });
        }

        function handleMatchSuccess(item, zone) {
            if (zone.classList.contains('matched-target')) return;
            gameScore += 20;
            currentMatchCount++;
            document.getElementById('matchScore').innerText = gameScore;
            playAudio(item.audio);
            
            zone.className = 'p-3 sm:p-4 bg-green-100 border-2 border-green-500 rounded-xl font-bold text-sm text-center text-green-700 flex items-center justify-center min-h-[60px] matched-target';
            zone.innerText = `✅ ${item.word}`;
            
            const origin = document.getElementById(`drag-${item.id}`);
            if (origin) origin.classList.add('matched-item');

            if (currentMatchCount >= currentRoundTotal) {
                document.getElementById('nextRoundPulse').classList.remove('hidden');
                setTimeout(nextMatchRound, 1200);
            }
        }

        function endGame() {
            document.getElementById('gamePlayListen').classList.add('hidden');
            document.getElementById('gamePlayMatch').classList.add('hidden');
            document.getElementById('gameResultScreen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = gameScore;
        }

        document.getElementById('navStudy').onclick = () => {
            document.getElementById('studyView').classList.remove('hidden');
            document.getElementById('gameView').classList.add('hidden');
            document.getElementById('navStudy').classList.add('bg-white', 'text-indigo-600');
            document.getElementById('navGame').classList.remove('bg-white', 'text-indigo-600');
        };
        document.getElementById('navGame').onclick = () => {
            document.getElementById('gameView').classList.remove('hidden');
            document.getElementById('studyView').classList.add('hidden');
            document.getElementById('navGame').classList.add('bg-white', 'text-indigo-600');
            document.getElementById('navStudy').classList.remove('bg-white', 'text-indigo-600');
        };
        document.getElementById('categorySelect').onchange = () => { currentPage = 1; renderGrid(); };
        document.getElementById('toggleFavorites').onclick = () => { document.getElementById('toggleFavorites').classList.toggle('bg-amber-100'); currentPage = 1; renderGrid(); };
        document.getElementById('pageSelect').onchange = (e) => { currentPage = parseInt(e.target.value); renderGrid(); };
        document.getElementById('prevPage').onclick = () => { if (currentPage > 1) { currentPage--; renderGrid(); } };
        document.getElementById('nextPage').onclick = () => { if (currentPage < Math.ceil(filteredData.length / pageSize)) { currentPage++; renderGrid(); } };
        document.getElementById('startGameBtn').onclick = startGame;
        document.querySelectorAll('.exit-game-btn').forEach(b => b.onclick = () => location.reload());
        document.getElementById('listenMainAudioBtn').onclick = () => playAudio(currentQuestion.audio);

        init();
    </script>
</body>
</html>

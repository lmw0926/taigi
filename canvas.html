<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台語學習通 - 完整功能整合版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
        }
        .word-card { transition: all 0.2s ease; }
        .word-card.playing { border-color: #6366f1; background-color: #eef2ff; box-shadow: 0 0 0 2px #6366f1; }
        .mic-active { animation: pulse-red 1.5s infinite; background-color: #ef4444 !important; }
        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .match-btn.selected { border-color: #6366f1; background-color: #eef2ff; }
        .match-btn.matched { visibility: hidden; opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 導覽列 -->
    <header class="sticky top-0 z-20 bg-white shadow-sm border-b border-slate-200 p-4">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-indigo-600">台語學習通</h1>
                <nav class="flex bg-slate-100 p-1 rounded-xl">
                    <button id="navStudy" class="px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600">學習</button>
                    <button id="navGame" class="px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500 hover:text-indigo-600 transition-all">遊戲</button>
                </nav>
            </div>

            <div id="studyControls" class="flex items-center gap-2">
                <select id="categorySelect" class="bg-slate-100 border-none rounded-lg px-3 py-2 text-sm font-medium text-slate-700 focus:ring-2 focus:ring-indigo-500">
                    <option value="all">載入中...</option>
                </select>
                <div id="dataStatus" class="text-xs text-slate-400 bg-slate-50 px-2 py-1 rounded">資料: 0</div>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 sm:p-6 max-w-4xl w-full mx-auto">
        <!-- 訊息通知 -->
        <div id="toast" class="hidden fixed top-24 left-1/2 transform -translate-x-1/2 z-50 bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-2xl transition-all duration-300"></div>

        <!-- 載入中 -->
        <div id="loadingOverlay" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p id="loadingText" class="text-slate-500 font-medium text-center px-4">正在載入台語資料庫...</p>
        </div>

        <!-- 學習視圖 -->
        <div id="studyView" class="hidden">
            <div class="flex gap-2 mb-6">
                <button id="playPageBtn" class="flex-1 py-3 bg-indigo-100 text-indigo-700 font-bold rounded-xl hover:bg-indigo-200 transition-all flex items-center justify-center gap-2">
                    <span>🔊 播放本頁</span>
                </button>
                <button id="stopPlayBtn" class="hidden px-6 py-3 bg-rose-100 text-rose-600 font-bold rounded-xl hover:bg-rose-200 transition-all">停止</button>
            </div>

            <div id="wordGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            
            <div id="pagination" class="flex items-center justify-center gap-6 mt-10 mb-20">
                <button id="prevPage" class="p-3 rounded-full bg-white shadow-sm border border-slate-200 text-slate-600 disabled:opacity-30">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
                </button>
                <span id="pageInfo" class="font-bold text-slate-600 text-sm italic">PAGE 1 / 1</span>
                <button id="nextPage" class="p-3 rounded-full bg-white shadow-sm border border-slate-200 text-slate-600 disabled:opacity-30">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
                </button>
            </div>
        </div>

        <!-- 遊戲視圖 -->
        <div id="gameView" class="hidden">
            <!-- 遊戲選單 -->
            <div id="gameStartScreen" class="py-12 bg-white rounded-3xl shadow-xl border border-slate-100 px-8 text-center">
                <div class="text-6xl mb-6">🎮</div>
                <h2 class="text-3xl font-bold text-slate-800 mb-6">台語挑戰賽</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                    <button onclick="selectGameMode('listen')" id="modeBtnListen" class="game-mode-btn p-4 border-2 border-indigo-600 bg-indigo-50 rounded-2xl text-left">🎧 聽力選選樂</button>
                    <button onclick="selectGameMode('match')" id="modeBtnMatch" class="game-mode-btn p-4 border-2 border-slate-100 bg-white rounded-2xl text-left">🧩 語詞配對</button>
                    <button onclick="selectGameMode('speak')" id="modeBtnSpeak" class="game-mode-btn p-4 border-2 border-slate-100 bg-white rounded-2xl text-left">🎙️ 開口大挑戰</button>
                </div>
                <button onclick="startSelectedGame()" class="px-12 py-4 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg hover:bg-indigo-700 w-full max-w-xs transition-all">開始遊戲</button>
            </div>

            <!-- 聽力模式區域 -->
            <div id="gamePlayListen" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <div class="bg-indigo-100 px-4 py-2 rounded-full text-indigo-700 font-bold">得分: <span id="listenScore">0</span></div>
                    <button onclick="backToMenu()" class="text-slate-400">結束</button>
                </div>
                <div class="bg-white rounded-3xl shadow-xl p-8 mb-6 text-center">
                    <div id="listenWordHint" class="text-slate-400 mb-4 italic">點擊按鈕聽語音</div>
                    <button onclick="replayListenAudio()" class="w-24 h-24 bg-indigo-600 text-white rounded-full mx-auto flex items-center justify-center text-3xl shadow-lg hover:scale-105 transition-all">🔊</button>
                </div>
                <div id="listenOptions" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>

            <!-- 配對模式區域 -->
            <div id="gamePlayMatch" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <div class="bg-indigo-100 px-4 py-2 rounded-full text-indigo-700 font-bold">得分: <span id="matchScore">0</span></div>
                    <button onclick="backToMenu()" class="text-slate-400">結束</button>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div id="matchWords" class="space-y-3"></div>
                    <div id="matchPoj" class="space-y-3"></div>
                </div>
            </div>

            <!-- 口說模式區域 -->
            <div id="gamePlaySpeak" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <div class="bg-rose-100 px-4 py-2 rounded-full text-rose-700 font-bold">得分: <span id="speakScore">0</span></div>
                    <button onclick="backToMenu()" class="text-slate-400">結束</button>
                </div>
                <div class="bg-white rounded-3xl shadow-xl p-8 mb-6 text-center">
                    <div id="speakTargetWord" class="text-5xl font-bold text-slate-800 mb-2">---</div>
                    <div id="speakTargetPoj" class="text-2xl text-indigo-500 mb-4">---</div>
                    <div id="speakTargetMeaning" class="text-slate-400 mb-8 italic">義：---</div>
                    
                    <div id="recognitionResult" class="min-h-[80px] flex flex-col items-center justify-center text-slate-400 italic mb-8 p-4 bg-slate-50 rounded-2xl border-2 border-dashed">
                        <div>準備就緒</div>
                    </div>

                    <button id="micBtn" class="w-24 h-24 bg-rose-500 text-white rounded-full mx-auto flex items-center justify-center shadow-lg transition-all text-3xl hover:bg-rose-600">🎙️</button>
                    <div id="micStatus" class="mt-4 text-rose-500 font-bold">點擊開始錄音</div>
                </div>
            </div>
            
            <!-- 結果畫面 -->
            <div id="gameResultScreen" class="hidden text-center py-12 bg-white rounded-3xl shadow-xl p-8">
                <h2 class="text-3xl font-bold mb-4">挑戰結束！</h2>
                <div class="text-6xl font-black text-indigo-600 mb-8" id="finalScore">0</div>
                <button onclick="backToMenu()" class="px-8 py-3 bg-slate-100 rounded-xl hover:bg-slate-200 transition-all">返回主選單</button>
            </div>
        </div>
    </main>

    <audio id="audioPlayer" class="hidden"></audio>

    <script type="module">
        // 變數設定
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        const pageSize = 8;
        
        let playList = [];
        let currentPlayIndex = -1;
        let isAutoPlaying = false;
        
        let gameMode = 'listen';
        let gameScore = 0;
        let currentQuestion = null;
        let recognition = null;
        let isRecognitionActive = false;

        // 台語模糊匹配對照
        const TAIGI_FUZZY_MAP = {
            "食": ["吃", "呷", "甲", "食", "下"],
            "水": ["美", "水", "漂亮", "隨"],
            "你好": ["利好", "你好", "哩厚", "黎厚"],
            "多謝": ["多謝", "多夏", "多下", "多謝"],
            "無": ["某", "謀", "無", "毛"],
            "是": ["細", "係", "是", "吸"],
            "這": ["結", "這", "擠"],
            "那": ["彼", "嘿", "那", "比"]
        };

        const audioPlayer = document.getElementById('audioPlayer');

        async function init() {
            try {
                await loadData();
                initSpeechRecognition();
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('studyView').classList.remove('hidden');
                renderGrid();
            } catch (err) {
                document.getElementById('loadingText').innerText = "系統初始化失敗，請檢查網路連線。";
                console.error(err);
            }
        }

        async function loadData() {
            const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSIS-1UF7kUUYsxnNgBtsyYNI9n5GAKh-fxtJkKjaGBk9VXxk07WILC_rLoB2-0wrhVjuJIVgqgIdIL/pub?output=csv';
            const response = await fetch(CSV_URL);
            const text = await response.text();
            
            const rows = text.split('\n').map(row => {
                const fields = [];
                let field = '', inQuotes = false;
                for (let char of row) {
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { fields.push(field); field = ''; }
                    else field += char;
                }
                fields.push(field);
                return fields;
            });

            allData = rows.slice(1).map((r, i) => ({
                id: `id-${i}`,
                word: r[1]?.trim() || '',
                audio: r[2]?.trim() || '',
                poj: r[5]?.trim() || '',
                meaning: r[6]?.trim() || '',
                category: r[7]?.trim() || '未分類'
            })).filter(d => d.word && d.audio);

            document.getElementById('dataStatus').innerText = `資料: ${allData.length}`;
            
            // 初始化分類下拉選單
            const cats = ['all', ...new Set(allData.map(d => d.category))];
            const sel = document.getElementById('categorySelect');
            sel.innerHTML = '';
            cats.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c === 'all' ? '所有分類' : c;
                sel.appendChild(opt);
            });
        }

        function renderGrid() {
            const grid = document.getElementById('wordGrid');
            const cat = document.getElementById('categorySelect').value;
            
            filteredData = cat === 'all' ? allData : allData.filter(d => d.category === cat);
            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            
            if (currentPage > totalPages) currentPage = totalPages;
            
            grid.innerHTML = '';
            const pageItems = filteredData.slice((currentPage - 1) * pageSize, currentPage * pageSize);
            
            pageItems.forEach(item => {
                const card = document.createElement('div');
                card.id = `card-${item.id}`;
                card.className = 'word-card bg-white p-5 rounded-2xl shadow-sm border-2 border-slate-200 flex justify-between items-center cursor-pointer hover:border-indigo-300 transition-all';
                card.innerHTML = `
                    <div class="flex-grow">
                        <div class="flex flex-col sm:flex-row sm:items-baseline sm:gap-3">
                            <span class="text-2xl font-bold text-slate-800">${item.word}</span>
                            <span class="text-lg font-mono text-indigo-500">${item.poj}</span>
                        </div>
                        <div class="text-sm text-slate-400 mt-2">${item.meaning}</div>
                    </div>
                    <button class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center hover:bg-indigo-600 hover:text-white transition-all">🔊</button>
                `;
                card.onclick = () => {
                    stopAutoPlay();
                    audioPlayer.src = item.audio;
                    audioPlayer.play();
                };
                grid.appendChild(card);
            });

            document.getElementById('pageInfo').innerText = `PAGE ${currentPage} / ${totalPages}`;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
        }

        // 自動播放邏輯
        document.getElementById('playPageBtn').onclick = () => {
            const pageItems = filteredData.slice((currentPage - 1) * pageSize, currentPage * pageSize);
            if (!pageItems.length) return;
            playList = pageItems;
            currentPlayIndex = 0;
            isAutoPlaying = true;
            document.getElementById('stopPlayBtn').classList.remove('hidden');
            playNextInList();
        };

        function playNextInList() {
            if (!isAutoPlaying || currentPlayIndex >= playList.length) {
                stopAutoPlay();
                return;
            }
            const item = playList[currentPlayIndex];
            document.querySelectorAll('.word-card').forEach(c => c.classList.remove('playing'));
            const activeCard = document.getElementById(`card-${item.id}`);
            if (activeCard) activeCard.classList.add('playing');

            audioPlayer.src = item.audio;
            audioPlayer.play().catch(() => {
                currentPlayIndex++;
                playNextInList();
            });
        }

        audioPlayer.onended = () => {
            if (isAutoPlaying) {
                currentPlayIndex++;
                setTimeout(playNextInList, 800);
            }
        };

        function stopAutoPlay() {
            isAutoPlaying = false;
            audioPlayer.pause();
            document.querySelectorAll('.word-card').forEach(c => c.classList.remove('playing'));
            document.getElementById('stopPlayBtn').classList.add('hidden');
        }

        // 導覽切換
        document.getElementById('navStudy').onclick = () => {
            document.getElementById('studyView').classList.remove('hidden');
            document.getElementById('gameView').classList.add('hidden');
            document.getElementById('studyControls').classList.remove('invisible');
            document.getElementById('navStudy').className = 'px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600';
            document.getElementById('navGame').className = 'px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500';
        };

        document.getElementById('navGame').onclick = () => {
            document.getElementById('gameView').classList.remove('hidden');
            document.getElementById('studyView').classList.add('hidden');
            document.getElementById('studyControls').classList.add('invisible');
            document.getElementById('navGame').className = 'px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600';
            document.getElementById('navStudy').className = 'px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500';
            backToMenu();
        };

        // 遊戲通用
        window.selectGameMode = (mode) => {
            gameMode = mode;
            document.querySelectorAll('.game-mode-btn').forEach(btn => btn.classList.replace('border-indigo-600', 'border-slate-100'));
            document.querySelectorAll('.game-mode-btn').forEach(btn => btn.classList.replace('bg-indigo-50', 'bg-white'));
            const selected = document.getElementById(`modeBtn${mode.charAt(0).toUpperCase() + mode.slice(1)}`);
            selected.classList.replace('border-slate-100', 'border-indigo-600');
            selected.classList.replace('bg-white', 'bg-indigo-50');
        };

        window.startSelectedGame = () => {
            gameScore = 0;
            document.getElementById('gameStartScreen').classList.add('hidden');
            ['Listen', 'Match', 'Speak'].forEach(m => document.getElementById(`gamePlay${m}`).classList.add('hidden'));
            
            const modeKey = gameMode.charAt(0).toUpperCase() + gameMode.slice(1);
            document.getElementById(`gamePlay${modeKey}`).classList.remove('hidden');
            
            if (gameMode === 'listen') nextListenQuestion();
            else if (gameMode === 'match') nextMatchRound();
            else if (gameMode === 'speak') nextSpeakQuestion();
        };

        window.backToMenu = () => {
            if (isRecognitionActive) recognition.stop();
            ['gamePlayListen', 'gamePlayMatch', 'gamePlaySpeak', 'gameResultScreen'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('gameStartScreen').classList.remove('hidden');
        };

        // 聽力模式
        function nextListenQuestion() {
            currentQuestion = allData[Math.floor(Math.random() * allData.length)];
            const options = [currentQuestion];
            while(options.length < 4) {
                const r = allData[Math.floor(Math.random() * allData.length)];
                if(!options.find(o => o.id === r.id)) options.push(r);
            }
            options.sort(() => Math.random() - 0.5);
            
            const container = document.getElementById('listenOptions');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'p-5 bg-white border-2 border-slate-100 rounded-2xl font-bold hover:border-indigo-500 transition-all';
                btn.innerText = opt.word;
                btn.onclick = () => {
                    if (opt.id === currentQuestion.id) {
                        gameScore += 10;
                        document.getElementById('listenScore').innerText = gameScore;
                        nextListenQuestion();
                    } else {
                        endGame();
                    }
                };
                container.appendChild(btn);
            });
            window.replayListenAudio();
        }
        window.replayListenAudio = () => { audioPlayer.src = currentQuestion.audio; audioPlayer.play(); };

        // 配對模式
        let selW = null, selP = null;
        function nextMatchRound() {
            const items = [...allData].sort(() => Math.random() - 0.5).slice(0, 4);
            const wBox = document.getElementById('matchWords'), pBox = document.getElementById('matchPoj');
            wBox.innerHTML = ''; pBox.innerHTML = '';
            selW = null; selP = null;
            
            [...items].sort(() => Math.random() - 0.5).forEach(it => {
                const b = document.createElement('button');
                b.className = 'match-btn w-full p-4 bg-white border-2 rounded-xl font-bold';
                b.innerText = it.word; b.onclick = () => {
                    wBox.querySelectorAll('.match-btn').forEach(btn => btn.classList.remove('selected'));
                    b.classList.add('selected'); selW = it.id; checkMatch();
                };
                wBox.appendChild(b);
            });
            
            [...items].sort(() => Math.random() - 0.5).forEach(it => {
                const b = document.createElement('button');
                b.className = 'match-btn w-full p-4 bg-white border-2 rounded-xl font-mono text-sm';
                b.innerText = it.poj; b.onclick = () => {
                    pBox.querySelectorAll('.match-btn').forEach(btn => btn.classList.remove('selected'));
                    b.classList.add('selected'); selP = it.id; checkMatch();
                };
                pBox.appendChild(b);
            });
        }

        function checkMatch() {
            if (selW && selP) {
                if (selW === selP) {
                    gameScore += 20; document.getElementById('matchScore').innerText = gameScore;
                    document.querySelectorAll('.match-btn.selected').forEach(b => b.classList.add('matched'));
                    selW = null; selP = null;
                    if (!document.querySelector('.match-btn:not(.matched)')) setTimeout(nextMatchRound, 800);
                } else {
                    setTimeout(() => document.querySelectorAll('.match-btn').forEach(b => b.classList.remove('selected')), 300);
                    selW = null; selP = null;
                }
            }
        }

        // 口說模式 (優化版)
        function initSpeechRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return;
            recognition = new SR();
            recognition.lang = 'zh-TW';
            recognition.interimResults = true;

            recognition.onstart = () => { isRecognitionActive = true; updateMicUI(true); };
            recognition.onend = () => { isRecognitionActive = false; updateMicUI(false); };
            
            recognition.onresult = (e) => {
                const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
                const resultBox = document.getElementById('recognitionResult');
                resultBox.innerHTML = `<div>聽到了：<span class="text-indigo-600 font-bold">${transcript}</span></div>`;
                if (e.results[0].isFinal) checkSpeakAnswer(transcript);
            };

            recognition.onerror = (e) => {
                isRecognitionActive = false; updateMicUI(false);
                if (e.error === 'no-speech') document.getElementById('recognitionResult').innerText = "🔇 沒聽到聲音，請再試一次！";
            };
        }

        function checkSpeakAnswer(text) {
            const target = currentQuestion.word;
            let isCorrect = text.includes(target);
            
            if (!isCorrect) {
                for (let key in TAIGI_FUZZY_MAP) {
                    if (target.includes(key) && TAIGI_FUZZY_MAP[key].some(c => text.includes(c))) {
                        isCorrect = true; break;
                    }
                }
            }

            const resultBox = document.getElementById('recognitionResult');
            if (isCorrect) {
                gameScore += 50; document.getElementById('speakScore').innerText = gameScore;
                resultBox.innerHTML = `<div class="text-green-600 font-bold">✅ 辨識成功！內容：${text}</div>`;
                setTimeout(nextSpeakQuestion, 1500);
            } else {
                resultBox.innerHTML = `<div class="text-rose-500">❌ 聽起來像「${text}」<br><span class="text-xs">提示：請發音清晰一點再試試</span></div>`;
            }
        }

        function nextSpeakQuestion() {
            currentQuestion = allData[Math.floor(Math.random() * allData.length)];
            document.getElementById('speakTargetWord').innerText = currentQuestion.word;
            document.getElementById('speakTargetPoj').innerText = currentQuestion.poj;
            document.getElementById('speakTargetMeaning').innerText = `義：${currentQuestion.meaning || '無'}`;
            document.getElementById('recognitionResult').innerHTML = "<div>準備就緒，請點擊錄音</div>";
            updateMicUI(false);
        }

        function updateMicUI(active) {
            const btn = document.getElementById('micBtn');
            const status = document.getElementById('micStatus');
            if (active) { btn.classList.add('mic-active'); status.innerText = "聆聽中..."; }
            else { btn.classList.remove('mic-active'); status.innerText = "點擊開始錄音"; }
        }

        document.getElementById('micBtn').onclick = () => {
            if (!recognition) { alert("瀏覽器不支援語音辨識"); return; }
            if (isRecognitionActive) recognition.stop();
            else { try { recognition.start(); } catch(e) {} }
        };

        function endGame() {
            ['gamePlayListen', 'gamePlayMatch', 'gamePlaySpeak'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('gameResultScreen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = gameScore;
        }

        // 分頁與分類事件
        document.getElementById('categorySelect').onchange = () => { currentPage = 1; renderGrid(); };
        document.getElementById('prevPage').onclick = () => { if (currentPage > 1) { currentPage--; renderGrid(); } };
        document.getElementById('nextPage').onclick = () => { if (currentPage * pageSize < filteredData.length) { currentPage++; renderGrid(); } };
        document.getElementById('stopPlayBtn').onclick = stopAutoPlay;

        init();
    </script>
</body>
</html>

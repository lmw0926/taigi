<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台語學習系統 - 智慧連播增強版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
        }
        .word-card { transition: all 0.2s ease; }
        .word-card.playing { border-color: #6366f1; background-color: #eef2ff; ring: 2px; ring-color: #6366f1; }
        .mic-active { animation: pulse-red 1.5s infinite; background-color: #ef4444 !important; }
        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .match-btn.selected { border-color: #6366f1; background-color: #eef2ff; }
        .match-btn.matched { visibility: hidden; opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="sticky top-0 z-20 bg-white shadow-sm border-b border-slate-200 p-4">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-indigo-600">台語學習通</h1>
                <nav class="flex bg-slate-100 p-1 rounded-xl">
                    <button id="navStudy" class="px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600">學習</button>
                    <button id="navGame" class="px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500 hover:text-indigo-600 transition-all">遊戲</button>
                </nav>
            </div>

            <div id="studyControls" class="flex items-center gap-2">
                <select id="categorySelect" class="bg-slate-100 border-none rounded-lg px-3 py-2 text-sm font-medium text-slate-700 focus:ring-2 focus:ring-indigo-500">
                    <option value="all">載入中...</option>
                </select>
                <div id="dataStatus" class="text-xs text-slate-400 bg-slate-50 px-2 py-1 rounded">資料: 0</div>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 sm:p-6 max-w-4xl w-full mx-auto">
        <div id="loadingOverlay" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p id="loadingText" class="text-slate-500 font-medium">正在從雲端載入台語資料庫...</p>
        </div>

        <!-- 學習視圖 -->
        <div id="studyView" class="hidden">
            <div class="flex gap-2 mb-6">
                <button id="playPageBtn" class="flex-1 py-3 bg-indigo-100 text-indigo-700 font-bold rounded-xl hover:bg-indigo-200 transition-all flex items-center justify-center gap-2">
                    <span>🔊 播放本頁</span>
                </button>
                <button id="playAllBtn" class="flex-1 py-3 bg-slate-800 text-white font-bold rounded-xl hover:bg-slate-900 transition-all flex items-center justify-center gap-2">
                    <span>🔄 播放全部</span>
                </button>
                <button id="stopPlayBtn" class="hidden px-4 py-3 bg-rose-100 text-rose-600 font-bold rounded-xl hover:bg-rose-200 transition-all">
                    停止
                </button>
            </div>

            <div id="wordGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            
            <div id="pagination" class="flex items-center justify-center gap-6 mt-10 mb-20">
                <button id="prevPage" class="p-3 rounded-full bg-white shadow-sm border border-slate-200 text-slate-600 disabled:opacity-30">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
                </button>
                <span id="pageInfo" class="font-bold text-slate-600 text-sm italic">PAGE 1 / 1</span>
                <button id="nextPage" class="p-3 rounded-full bg-white shadow-sm border border-slate-200 text-slate-600 disabled:opacity-30">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
                </button>
            </div>
        </div>

        <!-- 遊戲視圖 -->
        <div id="gameView" class="hidden">
            <div id="gameStartScreen" class="py-12 bg-white rounded-3xl shadow-xl border border-slate-100 px-8 text-center">
                <div class="text-6xl mb-6">🎮</div>
                <h2 class="text-3xl font-bold text-slate-800 mb-6">台語挑戰賽</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                    <button onclick="selectGameMode('listen')" id="modeBtnListen" class="game-mode-btn p-4 border-2 border-indigo-600 bg-indigo-50 rounded-2xl text-left">🎧 聽力選選樂</button>
                    <button onclick="selectGameMode('match')" id="modeBtnMatch" class="game-mode-btn p-4 border-2 border-slate-100 bg-white rounded-2xl text-left">🧩 語詞配對</button>
                    <button onclick="selectGameMode('speak')" id="modeBtnSpeak" class="game-mode-btn p-4 border-2 border-slate-100 bg-white rounded-2xl text-left">🎙️ 開口大挑戰</button>
                </div>
                <button onclick="startSelectedGame()" class="px-12 py-4 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg hover:bg-indigo-700 w-full max-w-xs">開始遊戲</button>
            </div>

            <!-- 聽力模式 -->
            <div id="gamePlayListen" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <div class="bg-indigo-100 px-4 py-2 rounded-full text-indigo-700 font-bold">得分: <span id="listenScore">0</span></div>
                    <button onclick="backToMenu()" class="text-slate-400">結束</button>
                </div>
                <div class="bg-white rounded-3xl shadow-xl p-8 mb-6 text-center">
                    <div id="listenWordDisplay" class="text-4xl font-bold mb-4">---</div>
                    <button onclick="replayListenAudio()" class="w-20 h-20 bg-indigo-600 text-white rounded-full mx-auto flex items-center justify-center text-3xl">🔊</button>
                </div>
                <div id="listenOptions" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>

            <!-- 配對模式 -->
            <div id="gamePlayMatch" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <div class="bg-indigo-100 px-4 py-2 rounded-full text-indigo-700 font-bold">得分: <span id="matchScore">0</span></div>
                    <button onclick="backToMenu()" class="text-slate-400">結束</button>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div id="matchWords" class="space-y-3"></div>
                    <div id="matchPoj" class="space-y-3"></div>
                </div>
            </div>

            <!-- 口說模式 -->
            <div id="gamePlaySpeak" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <div class="bg-rose-100 px-4 py-2 rounded-full text-rose-700 font-bold">得分: <span id="speakScore">0</span></div>
                    <button onclick="backToMenu()" class="text-slate-400">結束</button>
                </div>
                <div class="bg-white rounded-3xl shadow-xl p-8 mb-6 text-center">
                    <div id="speakTargetWord" class="text-5xl font-bold text-slate-800 mb-2">---</div>
                    <div id="speakTargetPoj" class="text-2xl text-indigo-500 mb-8">---</div>
                    <div id="recognitionResult" class="min-h-[60px] flex items-center justify-center text-slate-400 italic mb-8 p-4 bg-slate-50 rounded-2xl border-2 border-dashed">等待錄音...</div>
                    <button id="micBtn" class="w-20 h-20 bg-rose-500 text-white rounded-full mx-auto flex items-center justify-center shadow-lg transition-all text-2xl">🎙️</button>
                    <div id="micStatus" class="mt-4 text-rose-500 font-bold">點擊錄音</div>
                </div>
            </div>

            <div id="gameResultScreen" class="hidden text-center py-12 bg-white rounded-3xl shadow-xl p-8">
                <h2 class="text-3xl font-bold mb-4">挑戰結束！</h2>
                <div class="text-6xl font-black text-indigo-600 mb-8" id="finalScore">0</div>
                <button onclick="backToMenu()" class="px-8 py-3 bg-slate-100 rounded-xl">返回主選單</button>
            </div>
        </div>
    </header>

    <main class="flex-grow"></main> <!-- 佔位，結構已由上方 div 控制 -->

    <audio id="audioPlayer" class="hidden"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        const pageSize = 8;
        
        // 播放器狀態
        let playList = [];
        let currentPlayIndex = -1;
        let isAutoPlaying = false;

        // 遊戲狀態
        let gameMode = 'listen';
        let gameScore = 0;
        let currentQuestion = null;
        let selectedWordId = null;
        let selectedPojId = null;

        // 語音辨識
        let recognition = null;
        let isRecognitionActive = false;

        async function init() {
            try {
                await signInAnonymously(auth);
                await loadData();
                initSpeechRecognition();
                
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('studyView').classList.remove('hidden');
                
                renderGrid();
            } catch (err) {
                console.error("初始化失敗:", err);
                document.getElementById('loadingText').innerText = "載入失敗，請檢查網路連接。";
            }
        }

        async function loadData() {
            const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSIS-1UF7kUUYsxnNgBtsyYNI9n5GAKh-fxtJkKjaGBk9VXxk07WILC_rLoB2-0wrhVjuJIVgqgIdIL/pub?output=csv';
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error("網路回應不正常");
                const text = await response.text();
                const rows = parseCSV(text);
                if (rows.length <= 1) throw new Error("CSV 資料為空");

                const headers = rows[0].map(h => h.trim());
                const idxWord = headers.indexOf("詞條") !== -1 ? headers.indexOf("詞條") : 1;
                const idxAudio = headers.indexOf("語音") !== -1 ? headers.indexOf("語音") : 2;
                const idxPoj = headers.indexOf("羅馬字") !== -1 ? headers.indexOf("羅馬字") : 5;
                const idxMeaning = headers.indexOf("釋義") !== -1 ? headers.indexOf("釋義") : 6;
                const idxCat = headers.indexOf("分類") !== -1 ? headers.indexOf("分類") : 7;

                allData = rows.slice(1).map((r, i) => ({
                    id: `id-${i}`,
                    word: (r[idxWord] || '').trim(),
                    audio: (r[idxAudio] || '').trim(),
                    poj: (r[idxPoj] || '').trim(),
                    meaning: (r[idxMeaning] || '').trim(),
                    category: (r[idxCat] || '未分類').trim()
                })).filter(d => d.word && d.audio);

                document.getElementById('dataStatus').innerText = `資料: ${allData.length}`;
                const cats = ['all', ...new Set(allData.map(d => d.category))];
                const sel = document.getElementById('categorySelect');
                sel.innerHTML = '';
                cats.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c === 'all' ? '所有分類' : c;
                    sel.appendChild(opt);
                });
            } catch (err) {
                console.error("CSV 載入錯誤:", err);
            }
        }

        function parseCSV(data) {
            const rows = [];
            let curr = [], field = '', inQuote = false;
            for (let i = 0; i < data.length; i++) {
                const char = data[i], next = data[i+1];
                if (inQuote) {
                    if (char === '"' && next === '"') { field += '"'; i++; }
                    else if (char === '"') inQuote = false;
                    else field += char;
                } else {
                    if (char === '"') inQuote = true;
                    else if (char === ',') { curr.push(field); field = ''; }
                    else if (char === '\r' || char === '\n') {
                        curr.push(field); field = '';
                        if (curr.some(f => f.trim() !== '')) rows.push(curr);
                        curr = [];
                        if (char === '\r' && next === '\n') i++;
                    } else field += char;
                }
            }
            if (field || curr.length) { curr.push(field); rows.push(curr); }
            return rows;
        }

        function renderGrid() {
            const grid = document.getElementById('wordGrid');
            const cat = document.getElementById('categorySelect').value;
            filteredData = cat === 'all' ? allData : allData.filter(d => d.category === cat);
            
            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            grid.innerHTML = '';
            const start = (currentPage - 1) * pageSize;
            const pageItems = filteredData.slice(start, start + pageSize);

            pageItems.forEach((item, idx) => {
                const card = document.createElement('div');
                card.id = `card-${item.id}`;
                card.className = 'word-card bg-white p-5 rounded-2xl shadow-sm border-2 border-slate-200 flex justify-between items-center transition-all cursor-pointer hover:border-indigo-300';
                card.innerHTML = `
                    <div class="flex-grow">
                        <div class="flex items-baseline gap-3">
                            <span class="text-2xl font-bold text-slate-800">${item.word}</span>
                            <span class="text-2xl font-mono text-indigo-500">${item.poj}</span>
                        </div>
                        <div class="text-sm text-slate-400 mt-2">${item.meaning}</div>
                    </div>
                    <button class="play-btn w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center hover:bg-indigo-600 hover:text-white transition-all text-xl">🔊</button>
                `;
                
                // 點擊播放鈕觸發智慧續播
                const playBtn = card.querySelector('.play-btn');
                playBtn.onclick = (e) => {
                    e.stopPropagation();
                    startAutoPlayFrom(item.id);
                };
                
                grid.appendChild(card);
            });

            document.getElementById('pageInfo').innerText = `PAGE ${currentPage} / ${totalPages}`;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
        }

        // --- 自動連播系統 ---
        const audioPlayer = document.getElementById('audioPlayer');

        function startAutoPlayFrom(wordId) {
            stopAutoPlay();
            // 根據目前過濾狀態設定播放清單
            playList = [...filteredData];
            const startIndex = playList.findIndex(item => item.id === wordId);
            
            if (startIndex !== -1) {
                currentPlayIndex = startIndex;
                isAutoPlaying = true;
                document.getElementById('stopPlayBtn').classList.remove('hidden');
                playNextInList();
            }
        }

        function playNextInList() {
            if (!isAutoPlaying || currentPlayIndex >= playList.length) {
                stopAutoPlay();
                return;
            }

            const item = playList[currentPlayIndex];
            
            // 檢查是否在當前頁面，若不是則翻頁 (可選)
            // 這裡簡單處理：只視覺標註目前正在播放的卡片
            document.querySelectorAll('.word-card').forEach(c => c.classList.remove('playing'));
            const activeCard = document.getElementById(`card-${item.id}`);
            if (activeCard) {
                activeCard.classList.add('playing');
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            audioPlayer.src = item.audio;
            audioPlayer.play().catch(e => {
                console.error("播放出錯:", e);
                currentPlayIndex++;
                playNextInList();
            });
        }

        audioPlayer.onended = () => {
            if (isAutoPlaying) {
                currentPlayIndex++;
                setTimeout(playNextInList, 800); // 停頓 0.8 秒後播下一個
            }
        };

        function stopAutoPlay() {
            isAutoPlaying = false;
            audioPlayer.pause();
            document.querySelectorAll('.word-card').forEach(c => c.classList.remove('playing'));
            document.getElementById('stopPlayBtn').classList.add('hidden');
        }

        // --- 遊戲系統 ---
        window.selectGameMode = (mode) => {
            gameMode = mode;
            document.querySelectorAll('.game-mode-btn').forEach(btn => {
                btn.className = 'game-mode-btn p-4 border-2 border-slate-100 bg-white rounded-2xl text-left';
            });
            const selected = document.getElementById(`modeBtn${mode.charAt(0).toUpperCase() + mode.slice(1)}`);
            if (selected) {
                selected.className = 'game-mode-btn p-4 border-2 border-indigo-600 bg-indigo-50 rounded-2xl text-left';
            }
        };

        window.startSelectedGame = () => {
            stopAutoPlay();
            gameScore = 0;
            document.getElementById('gameStartScreen').classList.add('hidden');
            document.getElementById('gamePlayListen').classList.add('hidden');
            document.getElementById('gamePlayMatch').classList.add('hidden');
            document.getElementById('gamePlaySpeak').classList.add('hidden');
            document.getElementById('gameResultScreen').classList.add('hidden');

            if (gameMode === 'listen') {
                document.getElementById('gamePlayListen').classList.remove('hidden');
                document.getElementById('listenScore').innerText = '0';
                nextListenQuestion();
            } else if (gameMode === 'match') {
                document.getElementById('gamePlayMatch').classList.remove('hidden');
                document.getElementById('matchScore').innerText = '0';
                nextMatchRound();
            } else if (gameMode === 'speak') {
                document.getElementById('gamePlaySpeak').classList.remove('hidden');
                document.getElementById('speakScore').innerText = '0';
                nextSpeakQuestion();
            }
        };

        // 聽力模式實作
        function nextListenQuestion() {
            currentQuestion = allData[Math.floor(Math.random() * allData.length)];
            document.getElementById('listenWordDisplay').innerText = "點擊按鈕聽語音";
            
            const options = [currentQuestion];
            while(options.length < 4) {
                const randomItem = allData[Math.floor(Math.random() * allData.length)];
                if(!options.find(o => o.id === randomItem.id)) options.push(randomItem);
            }
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('listenOptions');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'p-5 bg-white border-2 border-slate-100 rounded-2xl font-bold hover:border-indigo-500 transition-all';
                btn.innerText = opt.word;
                btn.onclick = () => {
                    if (opt.id === currentQuestion.id) {
                        gameScore += 10;
                        document.getElementById('listenScore').innerText = gameScore;
                        nextListenQuestion();
                    } else {
                        endGame();
                    }
                };
                container.appendChild(btn);
            });
            replayListenAudio();
        }

        window.replayListenAudio = () => {
            audioPlayer.src = currentQuestion.audio;
            audioPlayer.play();
        };

        // 配對模式實作
        function nextMatchRound() {
            const items = [...allData].sort(() => Math.random() - 0.5).slice(0, 4);
            const words = [...items].sort(() => Math.random() - 0.5);
            const pojs = [...items].sort(() => Math.random() - 0.5);
            
            const wBox = document.getElementById('matchWords'), pBox = document.getElementById('matchPoj');
            wBox.innerHTML = ''; pBox.innerHTML = '';
            selectedWordId = null; selectedPojId = null;

            words.forEach(item => {
                const b = document.createElement('button');
                b.className = 'match-btn w-full p-4 bg-white border-2 rounded-xl font-bold transition-all';
                b.innerText = item.word;
                b.dataset.id = item.id;
                b.onclick = () => {
                    document.querySelectorAll('#matchWords .match-btn').forEach(btn => btn.classList.remove('selected'));
                    b.classList.add('selected');
                    selectedWordId = item.id;
                    checkMatch();
                };
                wBox.appendChild(b);
            });

            pojs.forEach(item => {
                const b = document.createElement('button');
                b.className = 'match-btn w-full p-4 bg-white border-2 rounded-xl font-mono transition-all';
                b.innerText = item.poj;
                b.dataset.id = item.id;
                b.onclick = () => {
                    document.querySelectorAll('#matchPoj .match-btn').forEach(btn => btn.classList.remove('selected'));
                    b.classList.add('selected');
                    selectedPojId = item.id;
                    checkMatch();
                };
                pBox.appendChild(b);
            });
        }

        function checkMatch() {
            if (selectedWordId && selectedPojId) {
                if (selectedWordId === selectedPojId) {
                    gameScore += 20;
                    document.getElementById('matchScore').innerText = gameScore;
                    document.querySelectorAll(`[data-id="${selectedWordId}"]`).forEach(btn => btn.classList.add('matched'));
                    
                    selectedWordId = null; selectedPojId = null;
                    if (document.querySelectorAll('.match-btn:not(.matched)').length === 0) {
                        setTimeout(nextMatchRound, 1000);
                    }
                } else {
                    document.querySelectorAll('.match-btn').forEach(btn => btn.classList.remove('selected'));
                    selectedWordId = null; selectedPojId = null;
                }
            }
        }

        // 口說模式實作
        function nextSpeakQuestion() {
            if (isRecognitionActive) recognition.stop();
            currentQuestion = allData[Math.floor(Math.random() * allData.length)];
            document.getElementById('speakTargetWord').innerText = currentQuestion.word;
            document.getElementById('speakTargetPoj').innerText = currentQuestion.poj;
            document.getElementById('recognitionResult').innerText = "等待錄音...";
        }

        function initSpeechRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return;
            recognition = new SR();
            recognition.lang = 'zh-TW';
            recognition.onstart = () => { isRecognitionActive = true; updateMicUI(true); };
            recognition.onend = () => { isRecognitionActive = false; updateMicUI(false); };
            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                document.getElementById('recognitionResult').innerText = `聽到：「${text}」`;
                if (text.includes(currentQuestion.word)) {
                    gameScore += 50;
                    document.getElementById('speakScore').innerText = gameScore;
                    document.getElementById('recognitionResult').innerText = "✅ 正確！";
                    setTimeout(nextSpeakQuestion, 1200);
                }
            };
        }

        function updateMicUI(active) {
            const btn = document.getElementById('micBtn');
            const status = document.getElementById('micStatus');
            if (active) { btn.classList.add('mic-active'); status.innerText = "聆聽中..."; }
            else { btn.classList.remove('mic-active'); status.innerText = "點擊錄音"; }
        }

        window.backToMenu = () => {
            stopAutoPlay();
            if (isRecognitionActive) recognition.stop();
            document.getElementById('gamePlayListen').classList.add('hidden');
            document.getElementById('gamePlayMatch').classList.add('hidden');
            document.getElementById('gamePlaySpeak').classList.add('hidden');
            document.getElementById('gameResultScreen').classList.add('hidden');
            document.getElementById('gameStartScreen').classList.remove('hidden');
        };

        window.endGame = () => {
            if (isRecognitionActive) recognition.stop();
            document.getElementById('gamePlayListen').classList.add('hidden');
            document.getElementById('gamePlayMatch').classList.add('hidden');
            document.getElementById('gamePlaySpeak').classList.add('hidden');
            document.getElementById('gameResultScreen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = gameScore;
        };

        // --- 事件綁定 ---
        document.getElementById('playPageBtn').onclick = () => {
            if (filteredData.length > 0) {
                const startId = filteredData[(currentPage - 1) * pageSize].id;
                startAutoPlayFrom(startId);
                // 限制只播本頁：覆寫 end 邏輯
                const originalEnded = audioPlayer.onended;
                audioPlayer.onended = () => {
                    if (currentPlayIndex >= (currentPage * pageSize) - 1) {
                        stopAutoPlay();
                        audioPlayer.onended = originalEnded;
                    } else {
                        currentPlayIndex++;
                        setTimeout(playNextInList, 800);
                    }
                };
            }
        };

        document.getElementById('playAllBtn').onclick = () => {
            if (filteredData.length > 0) startAutoPlayFrom(filteredData[0].id);
        };

        document.getElementById('stopPlayBtn').onclick = stopAutoPlay;

        document.getElementById('categorySelect').onchange = () => { stopAutoPlay(); currentPage = 1; renderGrid(); };
        document.getElementById('prevPage').onclick = () => { stopAutoPlay(); if (currentPage > 1) { currentPage--; renderGrid(); } };
        document.getElementById('nextPage').onclick = () => { stopAutoPlay(); if (currentPage * pageSize < filteredData.length) { currentPage++; renderGrid(); } };
        
        document.getElementById('navStudy').onclick = () => {
            document.getElementById('studyView').classList.remove('hidden');
            document.getElementById('gameView').classList.add('hidden');
            document.getElementById('navStudy').className = 'px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600';
            document.getElementById('navGame').className = 'px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500 hover:text-indigo-600 transition-all';
        };

        document.getElementById('navGame').onclick = () => {
            stopAutoPlay();
            document.getElementById('gameView').classList.remove('hidden');
            document.getElementById('studyView').classList.add('hidden');
            document.getElementById('navGame').className = 'px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600';
            document.getElementById('navStudy').className = 'px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500 hover:text-indigo-600 transition-all';
        };

        document.getElementById('micBtn').onclick = () => {
            if (isRecognitionActive) recognition.stop();
            else recognition.start();
        };

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台語學習通 - 雲端榮譽榜版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .word-card { transition: all 0.3s ease; }
        .word-card.playing { border-color: #6366f1; background-color: #eef2ff; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.2); transform: scale(1.02); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .draggable { cursor: grab; user-select: none; }
        .draggable:active { cursor: grabbing; }
        .drop-zone.drag-over { background-color: #e0e7ff; border-color: #6366f1; transform: scale(1.05); }
        .matched-item { opacity: 0.3; pointer-events: none; }
        .star-active { color: #f59e0b !important; fill: #f59e0b; }
        .shake { animation: shake 0.5s linear; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .leaderboard-scroll { max-height: 250px; overflow-y: auto; scrollbar-width: thin; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="sticky top-0 z-20 bg-white shadow-sm border-b border-slate-200 p-4">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-indigo-600">台語學習通</h1>
                <nav class="flex bg-slate-100 p-1 rounded-xl">
                    <button id="navStudy" class="nav-btn px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600">學習</button>
                    <button id="navGame" class="nav-btn px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500 hover:text-indigo-600 transition-all">遊戲</button>
                </nav>
            </div>
            <div id="studyControls" class="flex items-center gap-2">
                <select id="categorySelect" class="bg-slate-100 border-none rounded-lg px-3 py-2 text-sm font-medium text-slate-700 focus:ring-2 focus:ring-indigo-500">
                    <option value="all">載入分類...</option>
                </select>
                <button id="toggleFavorites" class="bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium hover:bg-amber-50">⭐ 收藏夾</button>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 sm:p-6 max-w-4xl w-full mx-auto">
        <!-- 載入中 -->
        <div id="loadingOverlay" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p id="loadingText" class="text-slate-500 text-center px-4">正在同步資料中...</p>
        </div>

        <!-- 學習視窗 -->
        <div id="studyView" class="hidden">
            <div class="flex flex-wrap gap-2 mb-6">
                <button id="playPageBtn" class="flex-1 py-3 bg-indigo-100 text-indigo-700 font-bold rounded-xl hover:bg-indigo-200 transition-all">📄 播放本頁</button>
                <button id="playAllBtn" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-all">🔁 連續播放</button>
                <button id="stopPlayBtn" class="hidden px-6 py-3 bg-rose-100 text-rose-600 font-bold rounded-xl hover:bg-rose-200 transition-all">停止</button>
            </div>
            <div id="wordGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            
            <!-- 分頁控制 -->
            <div id="pagination" class="flex items-center justify-center gap-4 mt-10 mb-20">
                <button id="prevPage" class="p-3 rounded-full bg-white border border-slate-200 disabled:opacity-30 hover:bg-slate-50">◀</button>
                <div class="flex items-center gap-2 bg-white border border-slate-200 px-4 py-2 rounded-xl shadow-sm">
                    <span class="text-slate-500 text-sm font-bold">第</span>
                    <select id="pageSelect" class="bg-transparent border-none focus:ring-0 font-bold text-indigo-600 cursor-pointer"></select>
                    <span id="totalPagesText" class="text-slate-500 text-sm font-bold">/ 1 頁</span>
                </div>
                <button id="nextPage" class="p-3 rounded-full bg-white border border-slate-200 disabled:opacity-30 hover:bg-slate-50">▶</button>
            </div>
        </div>

        <!-- 遊戲視窗 -->
        <div id="gameView" class="hidden">
            <div id="gameStartScreen" class="py-8 bg-white rounded-3xl shadow-xl border p-8">
                <h2 class="text-3xl font-bold mb-6 text-center">挑戰賽設定</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-1">選擇模式</label>
                        <select id="gameModeSelect" class="w-full p-3 bg-slate-100 rounded-xl border-none">
                            <option value="listen">聽力選選樂</option>
                            <option value="match">拖拉配對王</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-1">單字範圍</label>
                        <select id="gameScopeSelect" class="w-full p-3 bg-slate-100 rounded-xl border-none">
                            <option value="all">所有單字</option>
                            <option value="current">目前分類</option>
                            <option value="fav">僅限星號收藏 (⭐)</option>
                        </select>
                    </div>
                </div>
                <button id="startGameBtn" class="w-full py-4 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg hover:bg-indigo-700 mb-8 transition-transform active:scale-95">開始挑戰</button>
                
                <div class="border-t pt-6">
                    <h3 class="font-bold text-indigo-500 mb-4 text-sm flex items-center gap-2">🏆 榮譽榜 (前 30 強)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <div class="text-slate-400 text-xs font-bold mb-2">【聽力選選樂】</div>
                            <div id="leaderboardListen" class="leaderboard-scroll space-y-1 text-sm">
                                <div class="text-slate-400 italic">載入中...</div>
                            </div>
                        </div>
                        <div>
                            <div class="text-slate-400 text-xs font-bold mb-2">【拖拉配對王】</div>
                            <div id="leaderboardMatch" class="leaderboard-scroll space-y-1 text-sm">
                                <div class="text-slate-400 italic">載入中...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 聽力遊戲 -->
            <div id="gamePlayListen" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <div class="bg-indigo-100 px-4 py-2 rounded-full font-bold text-indigo-700">得分: <span id="listenScore">0</span></div>
                    <button class="exit-game-btn text-slate-400 font-bold hover:text-rose-500">結束</button>
                </div>
                <div class="bg-white rounded-3xl shadow-xl p-8 mb-6 text-center">
                    <button id="listenMainAudioBtn" class="w-24 h-24 bg-indigo-600 text-white rounded-full mx-auto text-4xl shadow-lg hover:scale-105 transition-all">🔊</button>
                </div>
                <div id="listenOptions" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>

            <!-- 配對遊戲 -->
            <div id="gamePlayMatch" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <div class="bg-indigo-100 px-4 py-2 rounded-full font-bold text-indigo-700">得分: <span id="matchScore">0</span></div>
                    <button class="exit-game-btn text-slate-400 font-bold hover:text-rose-500">結束</button>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div id="matchWordsCol" class="space-y-3"></div>
                    <div id="matchPojCol" class="space-y-3"></div>
                </div>
                <div id="matchFeedback" class="mt-8 text-center font-bold h-6"></div>
            </div>
            
            <!-- 結算介面 -->
            <div id="gameResultScreen" class="hidden text-center py-12 bg-white rounded-3xl shadow-xl p-8">
                <h2 class="text-3xl font-bold mb-2">挑戰結束！</h2>
                <p id="gameResultMsg" class="text-slate-500 font-bold mb-4">您的最終得分為：</p>
                <div class="text-7xl font-black text-indigo-600 mb-8" id="finalScore">0</div>
                <div id="nameInputArea" class="mb-8">
                    <label class="block text-sm font-bold text-slate-400 mb-2">請輸入您的名字留名榮譽榜：</label>
                    <input type="text" id="playerNameInput" maxlength="10" placeholder="您的暱稱..." class="p-3 border-2 border-indigo-100 rounded-xl text-center font-bold focus:border-indigo-500 outline-none w-full max-w-xs mx-auto block">
                </div>
                <button id="saveExitBtn" class="px-8 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 transition-all">儲存並返回</button>
            </div>
        </div>
    </main>

    <audio id="audioPlayer" class="hidden"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 全域狀態 ---
        let db, auth, user;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'taigi-learning-pro';
        
        let allData = [];
        let filteredData = [];
        let favorites = JSON.parse(localStorage.getItem('taigi_favs') || '[]');
        let currentPage = 1;
        const pageSize = 8;
        let isAutoPlaying = false;
        let isShowFavoritesOnly = false;
        let playList = [];
        let currentPlayIndex = -1;
        
        let gameScore = 0;
        let activeGameMode = '';
        let currentQuestion = null;
        let gamePool = [];

        const audioPlayer = document.getElementById('audioPlayer');

        // --- 初始化 ---
        async function init() {
            await loadCSVData();
            
            // Firebase 初始化 (遵照規則 3: 先 Auth 再操作)
            try {
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
                if (firebaseConfig) {
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    // 認證
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    onAuthStateChanged(auth, (u) => {
                        user = u;
                        if (user) {
                            setupLeaderboardListeners();
                            finishLoading();
                        }
                    });
                } else {
                    console.warn("No Firebase config found. Running in offline mode.");
                    finishLoading();
                }
            } catch (err) {
                console.error("Firebase Auth Error:", err);
                finishLoading();
            }
        }

        function finishLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('studyView').classList.remove('hidden');
            renderGrid();
        }

        // --- 資料處理 ---
        async function loadCSVData() {
            try {
                const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSIS-1UF7kUUYsxnNgBtsyYNI9n5GAKh-fxtJkKjaGBk9VXxk07WILC_rLoB2-0wrhVjuJIVgqgIdIL/pub?output=csv';
                const response = await fetch(url);
                const text = await response.text();
                const lines = text.split(/\r?\n/).filter(l => l.trim());
                
                allData = lines.slice(1).map((line, i) => {
                    const r = parseCSVLine(line);
                    return {
                        id: `item-${i}`,
                        word: r[1] || '',
                        audio: r[2] || '',
                        poj: r[5] || '',
                        meaning: r[6] || '',
                        category: r[7] || '未分類',
                        dictUrl: r[8] || ''
                    };
                }).filter(d => d.word && d.audio);

                const categories = ['all', ...new Set(allData.map(d => d.category))];
                const sel = document.getElementById('categorySelect');
                sel.innerHTML = categories.map(c => `<option value="${c}">${c === 'all' ? '所有分類' : c}</option>`).join('');
            } catch (err) {
                console.error("CSV Loading Failed:", err);
            }
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
                    else inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else { current += char; }
            }
            result.push(current.trim());
            return result;
        }

        // --- 學習畫面渲染 ---
        function renderGrid() {
            const grid = document.getElementById('wordGrid');
            const cat = document.getElementById('categorySelect').value;
            
            filteredData = allData.filter(d => {
                const matchCat = (cat === 'all' || d.category === cat);
                const matchFav = !isShowFavoritesOnly || favorites.includes(d.id);
                return matchCat && matchFav;
            });

            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            // 分頁
            const pageSelect = document.getElementById('pageSelect');
            pageSelect.innerHTML = Array.from({length: totalPages}, (_, i) => `<option value="${i+1}" ${currentPage === i+1 ? 'selected' : ''}>${i+1}</option>`).join('');
            document.getElementById('totalPagesText').innerText = `/ ${totalPages} 頁`;

            grid.innerHTML = '';
            const items = filteredData.slice((currentPage - 1) * pageSize, currentPage * pageSize);
            
            items.forEach(item => {
                const isFav = favorites.includes(item.id);
                const card = document.createElement('div');
                card.id = `card-${item.id}`;
                card.className = `word-card bg-white p-5 rounded-2xl shadow-sm border-2 border-slate-200 flex justify-between items-center cursor-pointer hover:border-indigo-300`;
                card.innerHTML = `
                    <div class="flex-grow">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl font-bold text-slate-800">${item.word}</span>
                            <span class="text-xl font-bold text-indigo-500 font-mono">${item.poj}</span>
                        </div>
                        <div class="flex gap-3 mt-1 items-center">
                            <span class="text-sm text-slate-400 font-medium">${item.meaning}</span>
                            ${item.dictUrl ? `<a href="${item.dictUrl}" target="_blank" class="text-indigo-400 text-xs" onclick="event.stopPropagation()">查字典</a>` : ''}
                            <span class="fav-btn cursor-pointer ${isFav ? 'star-active text-amber-500' : 'text-slate-300'} text-xl">★</span>
                        </div>
                    </div>
                    <button class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center">🔊</button>
                `;
                
                card.querySelector('.fav-btn').onclick = (e) => {
                    e.stopPropagation();
                    toggleFavorite(item.id);
                };
                
                card.onclick = () => {
                    if (isAutoPlaying) {
                        currentPlayIndex = filteredData.findIndex(d => d.id === item.id);
                        playFromIndex();
                    } else {
                        playAudio(item.audio);
                    }
                };
                grid.appendChild(card);
            });

            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
        }

        function toggleFavorite(id) {
            if (favorites.includes(id)) favorites = favorites.filter(f => f !== id);
            else favorites.push(id);
            localStorage.setItem('taigi_favs', JSON.stringify(favorites));
            renderGrid();
        }

        function playAudio(url) {
            audioPlayer.src = url;
            audioPlayer.play().catch(() => {});
        }

        // --- 自動播放邏輯 ---
        function startAutoPlay(isAll) {
            isAutoPlaying = true;
            document.getElementById('stopPlayBtn').classList.remove('hidden');
            currentPlayIndex = isAll ? 0 : (currentPage - 1) * pageSize;
            playFromIndex();
        }

        function playFromIndex() {
            if (!isAutoPlaying || currentPlayIndex >= filteredData.length) {
                stopAutoPlay();
                return;
            }
            const item = filteredData[currentPlayIndex];
            const itemPage = Math.floor(currentPlayIndex / pageSize) + 1;
            
            if (itemPage !== currentPage) {
                currentPage = itemPage;
                renderGrid();
            }

            document.querySelectorAll('.word-card').forEach(c => c.classList.remove('playing'));
            const card = document.getElementById(`card-${item.id}`);
            if (card) {
                card.classList.add('playing');
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            playAudio(item.audio);
        }

        audioPlayer.onended = () => {
            if (isAutoPlaying) {
                currentPlayIndex++;
                setTimeout(playFromIndex, 1000);
            }
        };

        function stopAutoPlay() {
            isAutoPlaying = false;
            document.getElementById('stopPlayBtn').classList.add('hidden');
            document.querySelectorAll('.word-card').forEach(c => c.classList.remove('playing'));
            audioPlayer.pause();
        }

        // --- 遊戲邏輯 ---
        function startGame() {
            const mode = document.getElementById('gameModeSelect').value;
            const scope = document.getElementById('gameScopeSelect').value;
            
            if (scope === 'all') gamePool = [...allData];
            else if (scope === 'current') gamePool = [...filteredData];
            else gamePool = allData.filter(d => favorites.includes(d.id));

            if (gamePool.length < 5) {
                const msg = scope === 'fav' ? "收藏夾單字不足 5 個！" : "目前範圍單字不足！";
                const modal = document.createElement('div');
                modal.className = "fixed inset-0 bg-black/50 flex items-center justify-center z-50";
                modal.innerHTML = `<div class="bg-white p-6 rounded-2xl max-w-xs w-full text-center">
                    <p class="mb-4 font-bold">${msg}</p>
                    <button class="bg-indigo-600 text-white px-6 py-2 rounded-lg" onclick="this.parentElement.parentElement.remove()">確定</button>
                </div>`;
                document.body.appendChild(modal);
                return;
            }

            activeGameMode = mode;
            gameScore = 0;
            document.getElementById('gameStartScreen').classList.add('hidden');
            
            if (mode === 'listen') {
                document.getElementById('gamePlayListen').classList.remove('hidden');
                document.getElementById('listenScore').innerText = '0';
                nextListenQuestion();
            } else {
                document.getElementById('gamePlayMatch').classList.remove('hidden');
                document.getElementById('matchScore').innerText = '0';
                nextMatchRound();
            }
        }

        function nextListenQuestion() {
            currentQuestion = gamePool[Math.floor(Math.random() * gamePool.length)];
            let options = [currentQuestion];
            while (options.length < 4) {
                const r = gamePool[Math.floor(Math.random() * gamePool.length)];
                if (!options.find(o => o.id === r.id)) options.push(r);
            }
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('listenOptions');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'p-5 bg-white border-2 border-slate-200 rounded-2xl font-bold text-xl hover:border-indigo-500 hover:bg-indigo-50 transition-all active:scale-95';
                btn.innerText = opt.word;
                btn.onclick = () => {
                    if (opt.id === currentQuestion.id) {
                        gameScore += 10;
                        document.getElementById('listenScore').innerText = gameScore;
                        nextListenQuestion();
                    } else {
                        endGame();
                    }
                };
                container.appendChild(btn);
            });
            playAudio(currentQuestion.audio);
        }

        function nextMatchRound() {
            const items = [...gamePool].sort(() => Math.random() - 0.5).slice(0, 5);
            const wordsCol = document.getElementById('matchWordsCol');
            const pojCol = document.getElementById('matchPojCol');
            wordsCol.innerHTML = ''; pojCol.innerHTML = '';
            
            const words = [...items].sort(() => Math.random() - 0.5);
            const pojs = [...items].sort(() => Math.random() - 0.5);
            
            words.forEach(it => {
                const div = document.createElement('div');
                div.id = `drag-${it.id}`;
                div.draggable = true;
                div.innerText = it.word;
                div.className = 'draggable p-4 bg-white border-2 border-indigo-200 rounded-xl font-bold text-xl text-center shadow-sm';
                div.ondragstart = (e) => e.dataTransfer.setData('text', it.id);
                wordsCol.appendChild(div);
            });

            pojs.forEach(it => {
                const div = document.createElement('div');
                div.className = 'drop-zone p-4 bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl font-mono text-lg text-center font-bold transition-all';
                div.innerText = it.poj;
                div.ondragover = (e) => { e.preventDefault(); div.classList.add('drag-over'); };
                div.ondragleave = () => div.classList.remove('drag-over');
                div.ondrop = (e) => {
                    e.preventDefault();
                    div.classList.remove('drag-over');
                    const draggedId = e.dataTransfer.getData('text');
                    if (draggedId === it.id) {
                        gameScore += 20;
                        document.getElementById('matchScore').innerText = gameScore;
                        playAudio(it.audio);
                        div.className = 'p-4 bg-green-100 border-2 border-green-500 rounded-xl font-bold text-lg text-center text-green-700 shadow-inner';
                        div.innerText = `✅ ${it.word}`;
                        document.getElementById(`drag-${it.id}`).classList.add('matched-item');
                        if (!document.querySelector('.draggable:not(.matched-item)')) {
                            setTimeout(nextMatchRound, 1000);
                        }
                    } else {
                        div.classList.add('shake');
                        setTimeout(() => div.classList.remove('shake'), 500);
                    }
                };
                pojCol.appendChild(div);
            });
        }

        function endGame() {
            document.getElementById('gamePlayListen').classList.add('hidden');
            document.getElementById('gamePlayMatch').classList.add('hidden');
            document.getElementById('gameResultScreen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = gameScore;
        }

        async function saveScore() {
            const name = document.getElementById('playerNameInput').value.trim() || '隱藏高手';
            if (!db || !user) return;

            try {
                const colName = `leaderboard_${activeGameMode}`;
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
                await addDoc(colRef, {
                    name,
                    score: gameScore,
                    uid: user.uid,
                    timestamp: Date.now()
                });
            } catch (e) {
                console.error("Score Save Error:", e);
            }
            
            document.getElementById('gameResultScreen').classList.add('hidden');
            document.getElementById('gameStartScreen').classList.remove('hidden');
        }

        // --- 榮譽榜監聽 ---
        function setupLeaderboardListeners() {
            if (!db) return;
            ['listen', 'match'].forEach(mode => {
                const colName = `leaderboard_${mode}`;
                const q = collection(db, 'artifacts', appId, 'public', 'data', colName);
                onSnapshot(q, (snapshot) => {
                    let scores = [];
                    snapshot.forEach(doc => scores.push(doc.data()));
                    // 規則 2: 記憶體中排序
                    const top30 = scores.sort((a, b) => b.score - a.score).slice(0, 30);
                    renderLeaderboard(mode, top30);
                }, (err) => console.error(err));
            });
        }

        function renderLeaderboard(mode, data) {
            const container = document.getElementById(mode === 'listen' ? 'leaderboardListen' : 'leaderboardMatch');
            if (data.length === 0) {
                container.innerHTML = '<div class="text-slate-300 italic">尚未有挑戰紀錄</div>';
                return;
            }
            container.innerHTML = data.map((item, idx) => `
                <div class="flex justify-between items-center p-2 rounded ${idx < 3 ? 'bg-indigo-50 font-bold' : 'bg-slate-50'}">
                    <span class="flex items-center gap-2">
                        <span class="text-xs text-indigo-300 w-4">${idx+1}</span>
                        <span class="truncate max-w-[100px]">${item.name}</span>
                    </span>
                    <span class="text-indigo-600 font-mono">${item.score}</span>
                </div>
            `).join('');
        }

        // --- UI 事件綁定 ---
        document.getElementById('navStudy').onclick = () => {
            document.getElementById('studyView').classList.remove('hidden');
            document.getElementById('gameView').classList.add('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.className = "nav-btn px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500 hover:text-indigo-600 transition-all");
            document.getElementById('navStudy').className = "nav-btn px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600";
        };

        document.getElementById('navGame').onclick = () => {
            document.getElementById('gameView').classList.remove('hidden');
            document.getElementById('studyView').classList.add('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.className = "nav-btn px-4 py-1.5 rounded-lg text-sm font-bold text-slate-500 hover:text-indigo-600 transition-all");
            document.getElementById('navGame').className = "nav-btn px-4 py-1.5 rounded-lg text-sm font-bold bg-white shadow-sm text-indigo-600";
        };

        document.getElementById('categorySelect').onchange = () => { currentPage = 1; renderGrid(); };
        document.getElementById('pageSelect').onchange = (e) => { currentPage = parseInt(e.target.value); renderGrid(); };
        document.getElementById('prevPage').onclick = () => { if (currentPage > 1) { currentPage--; renderGrid(); } };
        document.getElementById('nextPage').onclick = () => { if (currentPage < Math.ceil(filteredData.length / pageSize)) { currentPage++; renderGrid(); } };
        document.getElementById('toggleFavorites').onclick = () => { 
            isShowFavoritesOnly = !isShowFavoritesOnly; 
            document.getElementById('toggleFavorites').classList.toggle('bg-amber-100');
            renderGrid();
        };

        document.getElementById('playPageBtn').onclick = () => startAutoPlay(false);
        document.getElementById('playAllBtn').onclick = () => startAutoPlay(true);
        document.getElementById('stopPlayBtn').onclick = stopAutoPlay;
        
        document.getElementById('startGameBtn').onclick = startGame;
        document.querySelectorAll('.exit-game-btn').forEach(b => b.onclick = endGame);
        document.getElementById('listenMainAudioBtn').onclick = () => { if(currentQuestion) playAudio(currentQuestion.audio); };
        document.getElementById('saveExitBtn').onclick = saveScore;

        // 啟動
        init();

    </script>
</body>
</html>

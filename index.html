<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script src="https://www.cns11643.gov.tw/AIDB/static/js/cns11643.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台語認證系統 - 收藏與增強播放版</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
    
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f4f7f9; padding: 10px; padding-bottom: 120px; 
    }

    /* --- 控制面板 --- */
    .compact-panel {
      background: white; padding: 10px 15px; border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    }
    .panel-item { flex: 1; min-width: 120px; }
    .nav-group { flex: 1.5; min-width: 220px; }

    /* --- 播放遮罩 --- */
    #slideshow-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.96); z-index: 2000;
      display: none; align-items: center; justify-content: center; backdrop-filter: blur(12px);
    }
    #slide-content { width: 90%; max-width: 700px; }

    /* --- 卡片核心樣式 --- */
    .word-card { 
      width: 100%; min-height: 260px; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
      transform-style: preserve-3d; position: relative; 
      background: white; border-radius: 16px; border: 1px solid #e0e6ed; cursor: pointer;
    }
    .word-card.is-flipped { transform: rotateY(180deg); }

    /* 播放模式：響應式放大 */
    .word-card.playing-mode { 
      transform: scale(1.5); /* 手機版 1.5 倍 */
      min-height: 480px !important; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.7); 
      z-index: 2001;
    }

    @media (min-width: 768px) {
      .word-card.playing-mode {
        transform: scale(1.3); /* 寬螢幕 1.3 倍 */
        min-height: 520px !important;
      }
    }

    .word-card.no-example.playing-mode { min-height: 320px !important; }

    .card-front, .card-back { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      backface-visibility: hidden; border-radius: 16px; padding: 25px; 
      display: flex; flex-direction: column;
    }
    .card-front { border-left: 8px solid #007bff; }
    .card-back { transform: rotateY(180deg); background: #f0f7ff; border-left: 8px solid #28a745; overflow-y: auto; }
    
    /* 編號與星星 */
    .item-id-badge { position: absolute; top: 12px; right: 18px; color: #adb5bd; font-size: 0.85rem; font-weight: bold; }
    .star-btn { position: absolute; top: 10px; left: 15px; font-size: 1.4rem; color: #ffc107; cursor: pointer; z-index: 10; transition: 0.2s; }
    .star-btn:hover { transform: scale(1.2); }

    /* --- 例句區：空間最大化 --- */
    .example-box { 
      background: #f8f9fa; padding: 15px; border-left: 4px solid #3498db; 
      font-size: 1.4rem; color: #2c3e50; border-radius: 0 8px 8px 0; 
      margin-top: 15px; height: 110px; overflow-y: auto; transition: all 0.4s ease;
    }

    /* 播放時充份利用放大空間 */
    .playing-mode .example-box {
      flex-grow: 1; height: auto; min-height: 250px; 
      background: #ffffff; font-size: 1.6rem;
    }

    .example-box::-webkit-scrollbar { width: 6px; }
    .example-box::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 10px; }

    .word-title { font-size: 2.2rem; font-weight: 700; color: #1a202c; }
    .ipa-text { color: #e67e22; font-size: 1.5rem; margin-left: 50px; font-family: monospace; }

    /* --- 播放控制列 --- */
    #player-container { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 10px; display: none; z-index: 2200; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); }
    .nav-btn-overlay { position: absolute; top: 50%; transform: translateY(-50%); background: none; color: white; border: none; font-size: 3.5rem; opacity: 0.3; transition: 0.3s; z-index: 2300; }
    .nav-btn-overlay:hover { opacity: 1; }
  </style>
</head>
<body>

  <div id="slideshow-overlay">
    <button class="nav-btn-overlay" style="left: 10px;" onclick="manualPrev()"><i class="bi bi-chevron-left"></i></button>
    <div id="slide-content" onclick="toggleFlip(this)"></div>
    <button class="nav-btn-overlay" style="right: 10px;" onclick="manualNext()"><i class="bi bi-chevron-right"></i></button>
  </div>

  <div class="compact-panel">
    <div class="panel-item"><select id="sheetSelect" class="form-select form-select-sm border-0 bg-light" onchange="switchSheet(this.value)"></select></div>
    <div class="panel-item"><select id="categorySelect" class="form-select form-select-sm border-0 bg-light" onchange="filterByCategory(this.value)"></select></div>
    <div class="nav-group">
      <div class="input-group input-group-sm">
        <button class="btn btn-outline-primary" onclick="changePage(-1)"><i class="bi bi-chevron-left"></i></button>
        <select id="pageJumpSelect" class="form-select text-center" onchange="jumpToPage(this.value)"></select>
        <button class="btn btn-outline-primary" onclick="changePage(1)"><i class="bi bi-chevron-right"></i></button>
      </div>
    </div>
    <div class="d-flex gap-1">
      <button class="btn btn-sm btn-success px-3 rounded-pill" onclick="playCurrentPage()">播本頁</button>
      <button class="btn btn-sm btn-warning px-3 rounded-pill text-white" onclick="playAllContinuous()">播全部</button>
    </div>
  </div>

  <div id="app" class="row row-cols-1 row-cols-md-2 g-3"></div>

  <div id="player-container">
    <div class="container d-flex align-items-center gap-3">
      <div id="current-word" class="text-primary fw-bold small" style="min-width: 100px;"></div>
      <audio id="global-audio" controls class="flex-grow-1" style="height: 38px;"></audio>
      <button class="btn btn-sm btn-danger rounded-pill px-3" onclick="stopSequence()">停止</button>
    </div>
  </div>

  <script>
    let allData = [], filteredData = [], currentPage = 1, itemsPerPage = 10, currentSheet = "";
    let currentMode = "none", playlist = [], playlistIdx = 0, isPlaying = false;
    let starredList = JSON.parse(localStorage.getItem('starred_words') || "[]");

    async function init() {
      const response = await fetch(`${API_URL}?action=getSheets`);
      const names = await response.json();
      currentSheet = localStorage.getItem('last_sheet') || names[0];
      document.getElementById('sheetSelect').innerHTML = names.map(n => `<option value="${n}" ${n===currentSheet?'selected':''}>📚 ${n}</option>`).join('');
      await loadData();
    }

    async function loadData() {
      const [dataRes, catRes] = await Promise.all([
        fetch(`${API_URL}?sheet=${currentSheet}`),
        fetch(`${API_URL}?action=getCategories&sheet=${currentSheet}`).catch(() => null)
      ]);
      allData = await dataRes.json();
      if(catRes) {
        const cats = await catRes.json();
        document.getElementById('categorySelect').innerHTML = '<option value="all">📂 全部類別</option><option value="my_stars">⭐ 我的收藏</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
      }
      applyFilter(localStorage.getItem(`last_cat_${currentSheet}`) || "all");
      const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
      currentPage = Math.min(parseInt(localStorage.getItem(`last_page_${currentSheet}`) || 1), totalPages);
      updatePageJumpSelect(totalPages);
      render();
    }

    function toggleStar(id) {
      id = String(id);
      if (starredList.includes(id)) {
        starredList = starredList.filter(i => i !== id);
      } else {
        starredList.push(id);
      }
      localStorage.setItem('starred_words', JSON.stringify(starredList));
      if (document.getElementById('categorySelect').value === "my_stars") {
        filterByCategory("my_stars");
      } else {
        render();
      }
    }

    function applyFilter(cat) {
      document.getElementById('categorySelect').value = cat;
      if (cat === "my_stars") {
        filteredData = allData.filter(item => starredList.includes(String(item.id)));
      } else if (cat !== "all") {
        filteredData = allData.filter(item => item.cat === cat);
      } else { filteredData = allData; }
    }

    function render() {
      const app = document.getElementById('app');
      const start = (currentPage - 1) * itemsPerPage;
      app.innerHTML = filteredData.slice(start, start + itemsPerPage).map(item => createCardHTML(item)).join('');
      if (window.CNS11643) setTimeout(() => CNS11643.fixed(), 150);
      localStorage.setItem(`last_page_${currentSheet}`, currentPage);
    }

    function createCardHTML(item, isOverlay = false) {
      const hasExample = item.example && item.example.trim() !== "" && item.example !== "null";
      const playClass = isOverlay ? 'playing-mode' : '';
      const exampleClass = !hasExample ? 'no-example' : '';
      const isStarred = starredList.includes(String(item.id));

      return `
        <div class="col card-container">
          <div class="word-card ${playClass} ${exampleClass}" id="card-${item.id}" onclick="${isOverlay ? '' : 'this.classList.toggle(\'is-flipped\')'}">
            <i class="bi bi-star${isStarred?'-fill':''} star-btn" onclick="event.stopPropagation(); toggleStar('${item.id}')"></i>
            <span class="item-id-badge">#${item.id}</span>
            <div class="card-front">
              <div class="d-flex align-items-center mb-1">
                <button class="btn btn-primary rounded-circle me-3" style="width:40px; height:40px;" onclick="event.stopPropagation(); playSingleSlide('${item.id}')">
                  <i class="bi bi-play-fill"></i>
                </button>
                <span class="word-title">${item.word}</span>
              </div>
              <div class="ipa-text">${item.ipa || ''}</div>
              ${hasExample ? `<div class="example-box"><span class="badge bg-secondary mb-1">例：</span><br>${item.example}</div>` : ''}
            </div>
            <div class="card-back">
              <div class="p-1">
                <h6 class="text-success border-bottom pb-2">【解釋】</h6>
                <p class="small text-dark">${item.meaning || '尚未提供詳細解釋'}</p>
              </div>
            </div>
          </div>
        </div>`;
    }

    // --- 播放邏輯 ---
    function toggleFlip(el) {
      el.querySelector('.word-card').classList.toggle('is-flipped');
    }

    function playSingleSlide(id) { currentMode = "single"; startPlayback(id); }
    function playCurrentPage() { currentMode = "page"; startPlayback(filteredData[(currentPage-1)*itemsPerPage].id); }
    function playAllContinuous() { currentMode = "all"; startPlayback(filteredData[(currentPage-1)*itemsPerPage].id); }

    function startPlayback(id) {
      isPlaying = true;
      document.getElementById('slideshow-overlay').style.display = 'flex';
      document.getElementById('player-container').style.display = 'block';
      playlist = filteredData;
      playlistIdx = playlist.findIndex(i => String(i.id) === String(id));
      showSlide();
    }

    function showSlide() {
      if (!isPlaying) return;
      const item = playlist[playlistIdx];
      const slideBox = document.getElementById('slide-content');
      slideBox.innerHTML = createCardHTML(item, true);
      const audio = document.getElementById('global-audio');
      document.getElementById('current-word').innerText = `播放: ${item.word}`;
      audio.src = item.wordAudio.replace("dl=0", "raw=1");
      audio.play();
      audio.onended = () => {
        if (item.exampleAudio) {
          setTimeout(() => { if(!isPlaying) return; audio.src = item.exampleAudio.replace("dl=0", "raw=1"); audio.play(); audio.onended = handleSequenceEnd; }, 800);
        } else { handleSequenceEnd(); }
      };
    }

    function handleSequenceEnd() {
      if (!isPlaying) return;
      if (currentMode === "single") { stopSequence(); return; }
      if (currentMode === "page" && playlistIdx >= (currentPage * itemsPerPage) - 1) { stopSequence(); return; }
      manualNext();
    }

    function manualNext() {
      if (playlistIdx < playlist.length - 1) { playlistIdx++; syncPageByTrack(); showSlide(); } else { stopSequence(); }
    }

    function manualPrev() { if (playlistIdx > 0) { playlistIdx--; syncPageByTrack(); showSlide(); } }

    function syncPageByTrack() {
      const targetPage = Math.floor(playlistIdx / itemsPerPage) + 1;
      if (targetPage !== currentPage) {
        currentPage = targetPage;
        document.getElementById('pageJumpSelect').value = currentPage;
        render();
      }
    }

    function stopSequence() {
      isPlaying = false;
      document.getElementById('slideshow-overlay').style.display = 'none';
      document.getElementById('player-container').style.display = 'none';
      document.getElementById('global-audio').pause();
    }

    // --- 分頁與切換 ---
    function switchSheet(val) { currentSheet = val; localStorage.setItem('last_sheet', val); loadData(); }
    function filterByCategory(val) { localStorage.setItem(`last_cat_${currentSheet}`, val); applyFilter(val); currentPage = 1; updatePageJumpSelect(Math.ceil(filteredData.length / itemsPerPage)); render(); }
    function jumpToPage(val) { currentPage = parseInt(val); render(); window.scrollTo(0,0); }
    function changePage(s) {
      const total = Math.ceil(filteredData.length / itemsPerPage);
      if (currentPage + s >= 1 && currentPage + s <= total) jumpToPage(currentPage + s);
    }
    function updatePageJumpSelect(total) {
      const select = document.getElementById('pageJumpSelect');
      let options = "";
      for(let i=1; i<=total; i++) options += `<option value="${i}" ${i===currentPage?'selected':''}>第 ${i} 頁</option>`;
      select.innerHTML = options;
    }

    window.onload = init;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台語認證練習系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* 1. 引入完整的中日韓擴展字型，確保手機有字庫可抓 */
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap');
  
    body { 
      /* 強制加入系統支援罕用字的後備字型 */
      font-family: 'Noto Sans TC', 'Noto Sans CJK TC', 'Microsoft JhengHei', sans-serif;
      background-color: #f8f9fa; 
      padding: 15px; 
      padding-bottom: 120px !important; 
    }
  
    /* 2. 針對罕用字區塊強制使用支援擴展區的字型 */
    .word-title, .example-box {
      /* 這裡加入 'Apple Color Emoji' 是為了在 iOS 強制喚醒部分渲染機制 */
      font-family: 'Noto Sans TC', "PingFang TC", "STHeitiTC-Light", "LiHei Pro", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    .word-title, .example-box {
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      font-variant-ligatures: none;
    }

    .card-container { perspective: 1000px; margin-bottom: 20px; }
    .word-card { width: 100%; min-height: 280px; transition: transform 0.6s; transform-style: preserve-3d; position: relative; cursor: pointer; }
    .word-card.is-flipped { transform: rotateY(180deg); }
    .card-front, .card-back { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; padding: 20px; border: 1px solid #ddd; box-shadow: 0 4px 10px rgba(0,0,0,0.08); display: flex; flex-direction: column; background: white; }
    .card-front { border-left: 6px solid #007bff; z-index: 2; }
    .card-back { transform: rotateY(180deg); background: #f0f7ff; border-left: 6px solid #28a745; }
    .word-card.starred-border .card-front { border-left-color: #f1c40f; background-color: #fffdf0; }
    .playing-now { box-shadow: 0 0 20px #007bff !important; border: 2px solid #007bff !important; }
    .word-header { display: flex; align-items: center; margin-bottom: 10px; width: 100%; }
    .word-title { font-size: 2rem; color: #2c3e50; font-weight: bold; }
    .word-no { font-size: 0.85rem; color: #95a5a6; margin-left: auto; }
    .dict-link { text-decoration: none; font-size: 1.1rem; margin-left: 10px; color: #198754; }
    .ipa-text { color: #e67e22; font-family: 'Segoe UI', Arial, sans-serif; font-size: 1.5rem; margin-bottom: 8px; margin-left: 47px; }
    .badge-group { margin-bottom: 12px; margin-left: 47px; display: flex; gap: 5px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; }
    .bg-cat { background-color: #2ecc71; color: white; }
    .example-box { background: #f1f3f5; padding: 12px; border-left: 4px solid #3498db; font-size: 1.5rem; color: #34495e; border-radius: 0 4px 4px 0; flex-grow: 1; overflow-y: auto; line-height: 1.6; text-align: left; }
    .example-label { font-size: 0.85rem; color: #7f8c8d; font-weight: bold; margin-bottom: 4px; display: block; }
    .play-icon-btn { background: #007bff; color: white; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: none; margin-right: 12px; flex-shrink: 0; }
    .play-btn-sm { background: #3498db; color: white; border: none; border-radius: 4px; font-size: 0.7rem; padding: 2px 6px; margin-left: 8px; }
    .star-btn { background: none; border: none; font-size: 1.6rem; color: #ccc; cursor: pointer; padding: 0 5px; }
    .star-btn.active { color: #f1c40f; }
    #player-container { position: fixed; bottom: 0; left: 0; width: 100%; background: white; box-shadow: 0 -2px 15px rgba(0,0,0,0.1); padding: 15px; display: none; z-index: 1000; }
    .player-flex { display: flex; align-items: center; gap: 15px; max-width: 800px; margin: 0 auto; }
    #current-word { font-weight: bold; font-size: 1rem; color: #007bff; min-width: 100px; }
    audio { flex-grow: 1; height: 40px; }
  </style>
</head>
<body>

  <div id="sheet-buttons" class="d-flex justify-content-center flex-wrap gap-2 mb-3"></div>
  
  <div class="d-grid gap-2 mb-3">
    <button id="playAllBtn" class="btn btn-success fw-bold" onclick="playAllOnPage()">🎧 順序播放本頁全部</button>
  </div>

  <div class="row mb-3">
    <div class="col-12">
      <div class="input-group">
        <label class="input-group-text" for="categorySelect">篩選分類</label>
        <select class="form-select" id="categorySelect" onchange="filterByCategory(this.value)">
          <option value="all">全部類別</option>
          <option value="my_stars">⭐ 我的收藏</option>
        </select>
      </div>
    </div>
  </div>

  <div id="app" class="row row-cols-1 row-cols-md-2 g-3">
    <div class="col-12 text-center">初始化中...</div>
  </div>

  <div id="pagination" class="d-flex justify-content-between align-items-center mt-4 mb-5">
    <button id="prevBtn" class="btn btn-outline-primary" onclick="changePage(-1)">上一頁</button>
    <div class="d-flex align-items-center gap-2">
      <input type="number" id="pageInput" class="form-control text-center" style="width: 70px;" onchange="jumpToPage(this.value)" min="1">
      <span id="totalPages">/ 頁</span>
    </div>
    <button id="nextBtn" class="btn btn-outline-primary" onclick="changePage(1)">下一頁</button>
  </div>

  <div id="player-container">
    <div class="player-flex">
      <div id="current-word">尚未播放</div>
      <audio id="global-audio" controls></audio>
      <button class="btn btn-sm btn-outline-danger" onclick="stopSequence()">停止</button>
    </div>
  </div>

  <script>
    let allData = [];
    let filteredData = [];
    let currentPage = 1;
    const itemsPerPage = 10;
    const API_URL = "https://script.google.com/a/macros/guo.kh.edu.tw/s/AKfycbw_OHgjTJqP6OvnIYZl2L9XkkH_DacnLfcQHipsGX0EQg4OsU7dxo6LuH9862I-nSo_1g/exec"; 
    let currentSheet = "";
    let playlist = [];
    let playlistIdx = 0;
    let isAutoPlaying = false;

    async function init() {
      const savedSheet = localStorage.getItem('last_sheet');
      try {
        const response = await fetch(`${API_URL}?action=getSheets`);
        const names = await response.json();
        if (names && names.length > 0) {
          localStorage.setItem('cache_sheet_names', JSON.stringify(names));
          currentSheet = (savedSheet && names.includes(savedSheet)) ? savedSheet : names[0];
          setupSheetButtons(names);
          await loadData();
        }
      } catch (err) {
        const cachedNames = JSON.parse(localStorage.getItem('cache_sheet_names') || "[]");
        if(cachedNames.length > 0) {
          currentSheet = cachedNames[0];
          setupSheetButtons(cachedNames);
          loadData();
        }
      }
    }

    async function loadData() {
      if (!currentSheet) return;
      const cacheKey = `cache_data_${currentSheet}`;
      const cached = localStorage.getItem(cacheKey);
      if (cached) { allData = JSON.parse(cached); processAndRender(); }
      try {
        const [dataRes, catRes] = await Promise.all([
          fetch(`${API_URL}?sheet=${currentSheet}`),
          fetch(`${API_URL}?action=getCategories&sheet=${currentSheet}`).catch(() => null)
        ]);
        const newData = await dataRes.json();
        if (newData && !newData.error) {
          allData = newData;
          localStorage.setItem(cacheKey, JSON.stringify(allData));
          if (catRes) {
            const categories = await catRes.json();
            updateCategoryUI(categories);
          }
          processAndRender();
        }
      } catch (err) { console.error(err); }
    }

    function processAndRender() {
      const savedCat = localStorage.getItem(`last_cat_${currentSheet}`) || "all";
      document.getElementById('categorySelect').value = savedCat;
      applyFilter(savedCat);
      const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
      const savedPage = localStorage.getItem(`last_page_${currentSheet}`);
      currentPage = savedPage ? Math.min(parseInt(savedPage), totalPages) : 1;
      render();
    }

    function applyFilter(cat) {
      if (cat === "my_stars") {
        const list = getStarredList();
        filteredData = allData.filter(item => list.includes(String(item.id)));
      } else if (cat !== "all") {
        filteredData = allData.filter(item => item.cat === cat);
      } else { filteredData = allData; }
    }

    function filterByCategory(cat) {
      stopSequence();
      localStorage.setItem(`last_cat_${currentSheet}`, cat);
      currentPage = 1;
      applyFilter(cat);
      render();
    }

    // 處理字串中的 &#x...; 並轉為圖片 (改用更穩定的圖片來源)
    function fixRareChars(text) {
      if (!text) return "";
      
      // 同時處理十六進位 (&#x...) 與 十進位 (&#...)
      return text.replace(/&#([xX][0-9A-Fa-f]+|\d+);/g, (match, code) => {
        let hex;
        if (code.toLowerCase().startsWith('x')) {
          hex = code.substring(1).toLowerCase();
        } else {
          hex = parseInt(code, 10).toString(16).toLowerCase();
        }
    
        // 建立一個純文字字元 (供電腦版使用)
        const char = String.fromCodePoint(parseInt(hex, 16));
        
        // 建立一個穩定來源的圖片 (供手機版保險使用)
        // 改用全字庫的標準 WZ PNG 輸出介面
        const imgUrl = `https://www.cns11643.gov.tw/AIDB/png.do?components=1&font=0&code=${hex}`;
    
        // 使用一個容器，讓文字跟圖片擇一顯示最正確的
        return `<span class="rare-char-wrap" style="display:inline-flex; align-items:center;">
                  <span class="char-text" style="font-family: 'Noto Sans TC', sans-serif;">${char}</span>
                  <img src="${imgUrl}" 
                       style="height:1.1em; width:auto; vertical-align:middle; display:none;" 
                       onload="this.style.display='inline-block'; this.previousElementSibling.style.display='none';"
                       onerror="this.style.display='none'; this.previousElementSibling.style.display='inline-block';">
                </span>`;
      });
    }

    function render() {
      const app = document.getElementById('app');
      const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
      
      if (filteredData.length === 0) {
        app.innerHTML = '<div class="col-12 mt-5 text-center text-muted">目前沒有資料。</div>';
      } else {
        const start = (currentPage - 1) * itemsPerPage;
        const pagedData = filteredData.slice(start, start + itemsPerPage);
        const starredList = getStarredList();
        
        let html = '';
        pagedData.forEach(item => {
          const isStarred = starredList.includes(String(item.id));
          const hasEx = item.example && item.example !== "null" && item.example.trim() !== "";
          const hasDict = item.dictUrl && item.dictUrl !== "null" && item.dictUrl.trim() !== "";
          
          // 處理罕見字
          const processedWord = fixRareChars(item.word);
          const processedEx = fixRareChars(item.example);

          html += `
            <div class="col card-container">
              <div class="word-card ${isStarred ? 'starred-border' : ''}" data-id="${item.id}" onclick="this.classList.toggle('is-flipped')">
                <div class="card-front">
                  <div class="word-header">
                    <button class="play-icon-btn" onclick="event.stopPropagation(); jumpToAndPlay('${item.id}')">▶</button>
                    <span class="word-title">${processedWord}</span>
                    ${hasDict ? `<a href="${item.dictUrl}" target="_blank" class="dict-link" onclick="event.stopPropagation();">📖</a>` : ''}
                    <button class="star-btn ${isStarred ? 'active' : ''}" onclick="toggleStar('${item.id}', event)">★</button>
                    <span class="word-no">#${item.id}</span>
                  </div>
                  <div class="ipa-text">${item.ipa || ''}</div>
                  <div class="badge-group"><span class="badge bg-cat">${item.cat || '未分類'}</span></div>
                  ${hasEx ? `<div class="example-box"><span class="example-label"><button class="play-btn-sm" onclick="event.stopPropagation(); playOnlyExample('${item.exampleAudio}', '${item.word}')">🔊</button></span>${processedEx}</div>` : ''}
                </div>
                <div class="card-back">
                  <div class="word-header"><span class="word-title text-success">解釋</span></div>
                  <div class="mt-2 text-start flex-grow-1"><strong>華語詞義：</strong><p class="mt-2">${item.meaning || '尚未填寫'}</p></div>
                  <div class="mt-auto text-end text-secondary small">點擊卡片翻回正面</div>
                </div>
              </div>
            </div>`;
        });
        app.innerHTML = html;
      }
      
      document.getElementById('pageInput').value = currentPage;
      document.getElementById('totalPages').innerText = `/ ${totalPages} 頁`;
      document.getElementById('prevBtn').disabled = (currentPage <= 1);
      document.getElementById('nextBtn').disabled = (currentPage >= totalPages);

      // 全字庫修正
      if (typeof CNS11643 !== 'undefined') {
          CNS11643.fixed();
          setTimeout(() => { CNS11643.fixed(); }, 500);
      }
    }

    function changePage(s) { currentPage += s; localStorage.setItem(`last_page_${currentSheet}`, currentPage); render(); window.scrollTo(0,0); }
    function jumpToPage(v) { const p = parseInt(v); if (p >= 1) { currentPage = p; localStorage.setItem(`last_page_${currentSheet}`, p); render(); } }
    function setupSheetButtons(names) {
      const container = document.getElementById('sheet-buttons');
      container.innerHTML = names.map(n => `<button class="btn btn-sm ${n===currentSheet?'btn-primary':'btn-outline-primary'}" onclick="switchSheet('${n}')">${n}</button>`).join('');
    }
    function switchSheet(name) {
      if(currentSheet === name) return;
      currentSheet = name;
      localStorage.setItem('last_sheet', name);
      loadData();
      setupSheetButtons(JSON.parse(localStorage.getItem('cache_sheet_names') || "[]"));
    }
    function updateCategoryUI(cats) {
      const select = document.getElementById('categorySelect');
      const current = select.value;
      select.innerHTML = '<option value="all">全部類別</option><option value="my_stars">⭐ 我的收藏</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
      select.value = current;
    }
    function toggleStar(id, e) {
      e.stopPropagation();
      let list = getStarredList();
      const i = list.indexOf(String(id));
      if(i > -1) list.splice(i, 1); else list.push(String(id));
      localStorage.setItem('starred_words', JSON.stringify(list));
      render();
    }
    function getStarredList() { return JSON.parse(localStorage.getItem('starred_words') || "[]"); }

    function playSingle(url, label) {
      const p = document.getElementById('global-audio');
      document.getElementById('current-word').innerText = label;
      p.src = url.trim().replace("dl=0", "raw=1");
      p.play().catch(() => {});
    }
    function stopSequence() { isAutoPlaying = false; document.getElementById('global-audio').pause(); document.querySelectorAll('.word-card').forEach(c=>c.classList.remove('playing-now')); }
    
    function jumpToAndPlay(id) {
      const start = (currentPage - 1) * itemsPerPage;
      playlist = filteredData.slice(start, start + itemsPerPage).filter(i => i.wordAudio || i.exampleAudio);
      playlistIdx = playlist.findIndex(i => String(i.id) === String(id));
      if(playlistIdx !== -1) { stopSequence(); isAutoPlaying = true; startSeq(playlist[playlistIdx]); }
    }
    
    function startSeq(item) {
      if(!isAutoPlaying) return;
      document.getElementById('player-container').style.display = 'block';
      document.querySelectorAll('.word-card').forEach(c=>c.classList.remove('playing-now'));
      const card = document.querySelector(`[data-id="${item.id}"]`);
      if(card) { card.classList.add('playing-now'); card.scrollIntoView({behavior:'smooth', block:'center'}); }
      const audio = document.getElementById('global-audio');
      if(item.wordAudio && item.wordAudio !== "null") {
        playSingle(item.wordAudio, "📢 " + item.word);
        audio.onended = () => {
          if(item.exampleAudio && item.exampleAudio !== "null") {
            setTimeout(() => { if(isAutoPlaying) { playSingle(item.exampleAudio, "📖 例句"); audio.onended = nextSeq; } }, 800);
          } else nextSeq();
        };
      } else if(item.exampleAudio) { playSingle(item.exampleAudio, "📖 例句"); audio.onended = nextSeq; }
    }
    
    function nextSeq() {
      playlistIdx++;
      if(isAutoPlaying && playlistIdx < playlist.length) setTimeout(() => startSeq(playlist[playlistIdx]), 1200);
      else stopSequence();
    }
    
    function playAllOnPage() {
      const start = (currentPage - 1) * itemsPerPage;
      playlist = filteredData.slice(start, start + itemsPerPage).filter(i => i.wordAudio || i.exampleAudio);
      if(playlist.length > 0) { stopSequence(); isAutoPlaying = true; playlistIdx = 0; startSeq(playlist[0]); }
    }
    
    function playOnlyExample(url, name) { stopSequence(); document.getElementById('player-container').style.display='block'; playSingle(url, "📖 例句："+name); }

    window.onload = init;
  </script>
</body>
</html>

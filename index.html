<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script src="https://www.cns11643.gov.tw/AIDB/static/js/cns11643.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台語認證練習系統 - 投影片播放版</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
    
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f8f9fa; 
      padding: 15px; 
      padding-bottom: 140px !important; 
    }

    /* --- 投影片遮罩層 --- */
    #slideshow-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 2000;
      display: none; /* 預設隱藏 */
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }

    #slide-content {
      width: 90%;
      max-width: 600px;
      transform: scale(0.9);
      opacity: 0;
      transition: all 0.5s ease;
    }

    /* 投影片啟動時的動畫 */
    #slide-content.active {
      transform: scale(1.1);
      opacity: 1;
    }

    /* 播放中卡片的特殊樣式 (在遮罩內) */
    #slide-content .word-card {
      min-height: 450px !important;
      cursor: default;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    #slide-content .example-box {
      font-size: 1.8rem;
      background: #fff;
    }

    /* --- 原有卡片樣式 --- */
    .card-container { perspective: 1000px; margin-bottom: 20px; position: relative; }
    .word-card { 
      width: 100%; min-height: 280px; 
      transition: transform 0.6s, min-height 0.4s ease; 
      transform-style: preserve-3d; position: relative; 
      background-color: white; border-radius: 12px; border: 1px solid #ddd;
    }
    .word-card.is-flipped { transform: rotateY(180deg); }

    .card-front, .card-back { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      backface-visibility: hidden; border-radius: 12px; padding: 20px; 
      display: flex; flex-direction: column; overflow: hidden;
    }

    .card-front { border-left: 6px solid #007bff; z-index: 2; }
    .card-back { transform: rotateY(180deg); background: #f0f7ff; border-left: 6px solid #28a745; }
    
    .example-box { 
      background: #f1f3f5; padding: 10px; border-left: 4px solid #3498db; 
      font-size: 1.5rem; color: #34495e; border-radius: 0 4px 4px 0; 
      flex-grow: 1; transition: all 0.4s ease; overflow-y: auto; cursor: zoom-in;
    }
    
    /* 點擊放大 */
    .example-box.expanded {
      position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
      z-index: 100; background: white; border: 2px solid #3498db;
      padding: 20px; font-size: 2.2rem; cursor: zoom-out;
    }

    .word-title { font-size: 2rem; color: #2c3e50; font-weight: bold; }
    .ipa-text { color: #e67e22; font-size: 1.5rem; margin-left: 47px; }

    #player-container { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 15px; display: none; z-index: 2100; border-top: 2px solid #007bff; }
    .player-flex { display: flex; align-items: center; gap: 15px; max-width: 800px; margin: 0 auto; }
  </style>
</head>
<body>

  <div id="slideshow-overlay">
    <div id="slide-content"></div>
  </div>

  <div id="sheet-buttons" class="d-flex justify-content-center flex-wrap gap-2 mb-3"></div>
  
  <div class="d-grid gap-2 mb-3">
    <button class="btn btn-success fw-bold" onclick="playAllOnPage()">🎧 播放本頁 (投影片模式)</button>
    <button class="btn btn-warning fw-bold" onclick="playEverything()">🚀 全部播放 (自動換頁)</button>
  </div>

  <div class="row mb-3">
    <div class="col-12">
      <select class="form-select" id="categorySelect" onchange="filterByCategory(this.value)">
        <option value="all">全部類別</option>
        <option value="my_stars">⭐ 我的收藏</option>
      </select>
    </div>
  </div>

  <div id="app" class="row row-cols-1 row-cols-md-2 g-3"></div>

  <div id="pagination" class="d-flex justify-content-between align-items-center mt-4">
    <button class="btn btn-outline-primary" onclick="changePage(-1)">上一頁</button>
    <div id="totalPages">/ 頁</div>
    <button class="btn btn-outline-primary" onclick="changePage(1)">下一頁</button>
  </div>

  <div id="player-container">
    <div class="player-flex">
      <div id="current-word">尚未播放</div>
      <audio id="global-audio" controls></audio>
      <button class="btn btn-danger" onclick="stopSequence()">停止</button>
    </div>
  </div>

  <script>
    let allData = [], filteredData = [], currentPage = 1, itemsPerPage = 10;
    const API_URL = "https://script.google.com/a/macros/guo.kh.edu.tw/s/AKfycbw_OHgjTJqP6OvnIYZl2L9XkkH_DacnLfcQHipsGX0EQg4OsU7dxo6LuH9862I-nSo_1g/exec";
    let currentSheet = "", playlist = [], playlistIdx = 0, isAutoPlaying = false, isCrossPageMode = false;

    async function init() {
      const savedSheet = localStorage.getItem('last_sheet');
      const response = await fetch(`${API_URL}?action=getSheets`);
      const names = await response.json();
      currentSheet = (savedSheet && names.includes(savedSheet)) ? savedSheet : names[0];
      setupSheetButtons(names);
      await loadData();
    }

    async function loadData() {
      const [dataRes, catRes] = await Promise.all([
        fetch(`${API_URL}?sheet=${currentSheet}`),
        fetch(`${API_URL}?action=getCategories&sheet=${currentSheet}`).catch(() => null)
      ]);
      allData = await dataRes.json();
      const savedCat = localStorage.getItem(`last_cat_${currentSheet}`) || "all";
      const savedPage = localStorage.getItem(`last_page_${currentSheet}`) || 1;
      document.getElementById('categorySelect').value = savedCat;
      applyFilter(savedCat);
      currentPage = parseInt(savedPage);
      render();
    }

    function applyFilter(cat) {
      if (cat === "my_stars") {
        const list = JSON.parse(localStorage.getItem('starred_words') || "[]");
        filteredData = allData.filter(item => list.includes(String(item.id)));
      } else if (cat !== "all") {
        filteredData = allData.filter(item => item.cat === cat);
      } else { filteredData = allData; }
    }

    function render() {
      const app = document.getElementById('app');
      const start = (currentPage - 1) * itemsPerPage;
      const pagedData = filteredData.slice(start, start + itemsPerPage);
      app.innerHTML = pagedData.map(item => createCardHTML(item)).join('');
      document.getElementById('totalPages').innerText = `第 ${currentPage} / ${Math.ceil(filteredData.length / itemsPerPage) || 1} 頁`;
      localStorage.setItem(`last_page_${currentSheet}`, currentPage);
      if (window.CNS11643) setTimeout(() => CNS11643.fixed(), 150);
    }

    function createCardHTML(item) {
      return `
        <div class="col card-container">
          <div class="word-card" id="card-${item.id}" onclick="this.classList.toggle('is-flipped')">
            <div class="card-front">
              <div class="d-flex align-items-center">
                <button class="btn btn-primary btn-sm me-2" onclick="event.stopPropagation(); startSlideshow('${item.id}')">▶</button>
                <span class="word-title">${item.word}</span>
              </div>
              <div class="ipa-text">${item.ipa || ''}</div>
              <div class="example-box" onclick="toggleZoom(this, event)">
                <small>例句：</small><br>${item.example || ''}
              </div>
            </div>
            <div class="card-back">
              <div class="p-3"><strong>解釋：</strong><p>${item.meaning || ''}</p></div>
            </div>
          </div>
        </div>`;
    }

    function toggleZoom(el, e) {
      e.stopPropagation();
      el.classList.toggle('expanded');
    }

    // --- 投影片播放邏輯 ---
    function startSlideshow(id) {
      isAutoPlaying = true;
      document.getElementById('slideshow-overlay').style.display = 'flex';
      document.getElementById('player-container').style.display = 'block';
      
      const startIdx = filteredData.findIndex(i => String(i.id) === String(id));
      playlist = filteredData;
      playlistIdx = startIdx;
      showCurrentSlide();
    }

    function showCurrentSlide() {
      if (!isAutoPlaying) return;
      const item = playlist[playlistIdx];
      const slideContent = document.getElementById('slide-content');
      
      // 動畫切換
      slideContent.classList.remove('active');
      
      setTimeout(() => {
        slideContent.innerHTML = createCardHTML(item);
        slideContent.classList.add('active');
        
        // 播放音檔
        const audio = document.getElementById('global-audio');
        document.getElementById('current-word').innerText = `播放中：${item.word}`;
        audio.src = item.wordAudio.replace("dl=0", "raw=1");
        audio.play();
        
        audio.onended = () => {
          if (item.exampleAudio) {
            setTimeout(() => {
              audio.src = item.exampleAudio.replace("dl=0", "raw=1");
              audio.play();
              audio.onended = nextSlide;
            }, 800);
          } else { nextSlide(); }
        };
      }, 300);
    }

    function nextSlide() {
      playlistIdx++;
      if (playlistIdx < playlist.length) {
        // 如果跨過 10 張，自動同步更新背景頁碼
        if (playlistIdx % itemsPerPage === 0) changePage(1);
        setTimeout(showCurrentSlide, 1000);
      } else {
        stopSequence();
      }
    }

    function stopSequence() {
      isAutoPlaying = false;
      document.getElementById('slideshow-overlay').style.display = 'none';
      document.getElementById('player-container').style.display = 'none';
      document.getElementById('global-audio').pause();
    }

    function playAllOnPage() {
      const startIdx = (currentPage - 1) * itemsPerPage;
      startSlideshow(filteredData[startIdx].id);
    }

    function playEverything() {
      isCrossPageMode = true;
      playAllOnPage();
    }

    function switchSheet(name) {
      currentSheet = name;
      localStorage.setItem('last_sheet', name);
      loadData();
    }

    function setupSheetButtons(names) {
      document.getElementById('sheet-buttons').innerHTML = names.map(n => 
        `<button class="btn btn-sm ${n===currentSheet?'btn-primary':'btn-outline-primary'}" onclick="switchSheet('${n}')">${n}</button>`
      ).join('');
    }

    function filterByCategory(cat) {
      localStorage.setItem(`last_cat_${currentSheet}`, cat);
      applyFilter(cat);
      currentPage = 1;
      render();
    }

    function changePage(s) {
      currentPage += s;
      render();
    }

    window.onload = init;
  </script>
</body>
</html>

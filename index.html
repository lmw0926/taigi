<script>
    let allData = [];
    let filteredData = [];
    let currentPage = 1;
    const itemsPerPage = 10;
    
    // 請確保此處為你的最新 GAS API 連結
    const API_URL = "https://script.google.com/a/macros/guo.kh.edu.tw/s/AKfycbw_OHgjTJqP6OvnIYZl2L9XkkH_DacnLfcQHipsGX0EQg4OsU7dxo6LuH9862I-nSo_1g/exec"; 

    let currentSheet = "";
    let currentPlaylist = [];
    let currentIndex = 0;
    let isPlayingExample = false; // 狀態標籤：判斷目前是在播語詞還是例句

    async function init() {
      try {
        const response = await fetch(`${API_URL}?action=getSheets`);
        const names = await response.json();
        if (names && names.length > 0) {
          const btnContainer = document.getElementById('sheet-buttons');
          btnContainer.innerHTML = '';
          names.forEach((name, index) => {
            const btn = document.createElement('button');
            btn.innerText = name;
            btn.className = (index === 0) ? "btn btn-primary" : "btn btn-outline-primary";
            btn.onclick = () => switchSheet(name);
            btnContainer.appendChild(btn);
          });
          currentSheet = names[0];
          loadData();
        }
      } catch (err) {
        document.getElementById('app').innerHTML = "連線失敗。";
      }
    }

    async function loadData() {
      document.getElementById('app').innerHTML = `<div class="spinner-border text-primary"></div><p>載入 ${currentSheet} 中...</p>`;
      try {
        const [dataRes, catRes] = await Promise.all([
          fetch(`${API_URL}?sheet=${currentSheet}`),
          fetch(`${API_URL}?action=getCategories&sheet=${currentSheet}`)
        ]);
        allData = await dataRes.json();
        const categories = await catRes.json();

        const select = document.getElementById('categorySelect');
        select.innerHTML = '<option value="all">全部類別</option><option value="my_stars">⭐ 我的收藏</option>';
        categories.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = opt.innerText = cat;
          select.appendChild(opt);
        });

        filteredData = allData;
        currentPage = 1;
        render();
      } catch (err) {
        document.getElementById('app').innerHTML = "資料載入出錯。";
      }
    }

    /**
     * 核心播放函式：負責單次播放並解析 Drive 連結
     */
    function playAudio(url, displayName) {
      const audioPlayer = document.getElementById('global-audio');
      
      if (!url || url === "" || url === "null") {
        console.warn("無效的音檔網址:", displayName);
        return false;
      }
      
      const finalUrl = url.trim().replace("dl=0", "raw=1");
      document.getElementById('player-container').style.display = 'block';
      document.getElementById('current-word').innerText = "播放中: " + displayName;
      
      audioPlayer.src = finalUrl;
      audioPlayer.play().catch(e => console.log("播放被阻擋或失敗:", e));
      return true;
    }

    /**
     * 播放本頁所有單字 (語詞 + 例句 循環)
     */
    function playAllOnPage() {
      const start = (currentPage - 1) * itemsPerPage;
      // 篩選出至少有一種音檔的項目
      currentPlaylist = filteredData.slice(start, start + itemsPerPage)
                        .filter(item => (item.wordAudio && item.wordAudio !== "null") || (item.exampleAudio && item.exampleAudio !== "null"));
      
      if (currentPlaylist.length === 0) return alert("本頁無音檔可播放");
      
      currentIndex = 0;
      isPlayingExample = false; 
      playSequence();
    }

    /**
     * 播放序列控制
     */
    function playSequence() {
      if (currentIndex >= currentPlaylist.length) {
        document.getElementById('current-word').innerText = "✅ 全頁播放完畢";
        // 播放完畢後清除結束事件，避免影響單次點擊播放
        document.getElementById('global-audio').onended = null;
        return;
      }

      const item = currentPlaylist[currentIndex];
      const audioPlayer = document.getElementById('global-audio');
      
      if (!isPlayingExample) {
        // --- 1. 播放語詞 ---
        if (item.wordAudio && item.wordAudio !== "null") {
          playAudio(item.wordAudio, `(語詞) ${item.word}`);
          audioPlayer.onended = () => {
            // 語詞播完，準備播例句
            if (item.exampleAudio && item.exampleAudio !== "null") {
              isPlayingExample = true;
              setTimeout(playSequence, 800); // 停頓 0.8 秒後播例句
            } else {
              // 無例句，直接跳下一單字
              currentIndex++;
              isPlayingExample = false;
              setTimeout(playSequence, 1000);
            }
          };
        } else {
          // 若無語詞音檔則直接跳去播例句
          isPlayingExample = true;
          playSequence();
        }
      } else {
        // --- 2. 播放例句 ---
        if (item.exampleAudio && item.exampleAudio !== "null") {
          playAudio(item.exampleAudio, `(例句) ${item.word}`);
          audioPlayer.onended = () => {
            // 例句播完，換下一個單字
            currentIndex++;
            isPlayingExample = false;
            setTimeout(playSequence, 1200); // 單字間隔 1.2 秒
          };
        } else {
          // 若無例句音檔，換下一個單字
          currentIndex++;
          isPlayingExample = false;
          playSequence();
        }
      }
    }

    function render() {
      const app = document.getElementById('app');
      if (!filteredData || filteredData.length === 0) { app.innerHTML = "目前沒有資料。"; return; }

      const start = (currentPage - 1) * itemsPerPage;
      const pagedData = filteredData.slice(start, start + itemsPerPage);
      const totalPages = Math.ceil(filteredData.length / itemsPerPage);
      const starredList = getStarredList();
      
      let html = '';
      pagedData.forEach((item) => {
        const isStarred = starredList.includes(String(item.id));
        const starClass = isStarred ? 'active' : '';
        const starredCardClass = isStarred ? 'starred-border' : '';

        html += `
          <div class="card-container">
            <div class="word-card ${starredCardClass}" onclick="flipCard(this)">
              <div class="card-front">
                <div class="word-header">
                  <button class="play-icon-btn" onclick="event.stopPropagation(); stopAutoPlay(); playAudio('${item.wordAudio}', '${item.word}')">▶</button>
                  <span class="word-title">${item.word}</span>
                  <button class="star-btn ${starClass}" onclick="toggleStar('${item.id}', event)">★</button>
                  <span class="word-no">#${item.id}</span>
                </div>
                <div class="ipa-text" style="margin-left: 47px;">[ ${item.ipa || ''} ]</div>
                <div class="badge-group" style="margin-left: 47px;">
                  <span class="badge bg-cat">${item.cat || '未分類'}</span>
                </div>
                <div class="example-box">
                  <span class="example-label">例句：
                    <button class="play-btn-sm" onclick="event.stopPropagation(); stopAutoPlay(); playAudio('${item.exampleAudio}', '例句')">🔊 播放</button>
                  </span>
                  ${item.example || '（暫無例句）'}
                </div>
              </div>
              <div class="card-back">
                <div class="word-header"><span class="word-title" style="color:#28a745;">解釋</span></div>
                <div class="mt-2 text-start">
                  <strong>華語詞義：</strong>
                  <p class="mt-1">${item.meaning || '尚未填寫'}</p>
                </div>
                <div class="mt-auto text-end text-secondary small">點擊卡片翻回正面</div>
              </div>
            </div>
          </div>`;
      });
      
      app.innerHTML = html;
      document.getElementById('pageInput').value = currentPage;
      document.getElementById('totalPages').innerText = `/ ${totalPages} 頁`;
      document.getElementById('prevBtn').disabled = (currentPage === 1);
      document.getElementById('nextBtn').disabled = (currentPage === totalPages);
      
      if (typeof CNS11643 !== 'undefined') {
        setTimeout(() => { CNS11643.fixed(); }, 150);
      }
    }

    /**
     * 如果使用者點擊單個播放，應中斷「全頁播放」的序列
     */
    function stopAutoPlay() {
      currentIndex = 99999; 
      document.getElementById('global-audio').onended = null;
    }

    function switchSheet(name) {
      currentSheet = name;
      document.querySelectorAll('#sheet-buttons button').forEach(btn => {
        btn.className = (btn.innerText === name) ? "btn btn-primary" : "btn btn-outline-primary";
      });
      loadData();
    }

    function toggleStar(id, event) {
      event.stopPropagation();
      let list = getStarredList();
      const sid = String(id);
      const i = list.indexOf(sid);
      if (i > -1) list.splice(i, 1); else list.push(sid);
      localStorage.setItem('starred_words', JSON.stringify(list));
      render();
    }

    function getStarredList() {
      const s = localStorage.getItem('starred_words');
      return s ? JSON.parse(s) : [];
    }

    function filterByCategory(cat) {
      if (cat === "all") filteredData = allData;
      else if (cat === "my_stars") {
        const list = getStarredList();
        filteredData = allData.filter(item => list.includes(String(item.id)));
      } else {
        filteredData = allData.filter(item => item.cat === cat);
      }
      currentPage = 1; render();
    }

    function jumpToPage(v) {
      const p = parseInt(v);
      const total = Math.ceil(filteredData.length / itemsPerPage);
      if (p >= 1 && p <= total) { currentPage = p; render(); window.scrollTo(0,0); }
    }

    function changePage(s) { 
      currentPage += s; 
      render(); 
      window.scrollTo(0,0); 
    }

    function flipCard(e) { e.classList.toggle('is-flipped'); }

    window.onload = init;
  </script>

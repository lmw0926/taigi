<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script src="https://www.cns11643.gov.tw/AIDB/static/js/cns11643.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台語認證練習系統 - 卡片高度動態延伸版</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8f9fa; padding: 15px; padding-bottom: 120px !important; }
    
    .card-container { perspective: 1000px; margin-bottom: 20px; transition: all 0.4s ease; }
    
    /* 基礎卡片設定 */
    .word-card { 
      width: 100%; 
      min-height: 280px; 
      transition: transform 0.6s, min-height 0.4s ease; /* 增加高度變化的過渡 */
      transform-style: preserve-3d; 
      position: relative; 
      cursor: pointer; 
    }
    
    /* 核心修改：卡片放大 1.5 倍高度 (280px * 1.5 = 420px) */
    .word-card.expanded {
      min-height: 420px !important;
      z-index: 100;
    }

    .word-card.is-flipped { transform: rotateY(180deg); }
    .card-front, .card-back { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; padding: 20px; border: 1px solid #ddd; box-shadow: 0 4px 10px rgba(0,0,0,0.08); display: flex; flex-direction: column; background: white; overflow: hidden; }
    .card-front { border-left: 6px solid #007bff; z-index: 2; }
    .card-back { transform: rotateY(180deg); background: #f0f7ff; border-left: 6px solid #28a745; }
    
    .playing-now { box-shadow: 0 0 25px #007bff !important; border: 2px solid #007bff !important; }

    /* 例句區設定 */
    .example-box { 
      background: #f1f3f5; padding: 12px; border-left: 4px solid #3498db; 
      font-size: 1.5rem; color: #34495e; border-radius: 0 4px 4px 0; 
      flex-grow: 1; /* 讓它自動填滿空間 */
      transition: background-color 0.4s;
      overflow-y: auto; line-height: 1.6; text-align: left;
    }

    /* 當卡片展開時，背景稍微變色以示強調 */
    .word-card.expanded .example-box {
      background-color: #e3f2fd;
      border-left-color: #e67e22;
    }

    .word-header { display: flex; align-items: center; margin-bottom: 10px; width: 100%; }
    .word-title { font-size: 2rem; color: #2c3e50; font-weight: bold; }
    .word-no { font-size: 0.85rem; color: #95a5a6; margin-left: auto; }
    .dict-link { text-decoration: none; font-size: 1.1rem; margin-left: 10px; color: #198754; }
    .ipa-text { color: #e67e22; font-family: 'Segoe UI', Arial, sans-serif; font-size: 1.5rem; margin-bottom: 8px; margin-left: 47px; }
    .badge-group { margin-bottom: 12px; margin-left: 47px; display: flex; gap: 5px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; }
    .bg-cat { background-color: #2ecc71; color: white; }
    .play-icon-btn { background: #007bff; color: white; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: none; margin-right: 12px; flex-shrink: 0; }
    .play-btn-sm { background: #3498db; color: white; border: none; border-radius: 4px; font-size: 0.7rem; padding: 2px 6px; margin-left: 8px; }
    .star-btn { background: none; border: none; font-size: 1.6rem; color: #ccc; cursor: pointer; padding: 0 5px; }
    .star-btn.active { color: #f1c40f; }
    
    #player-container { position: fixed; bottom: 0; left: 0; width: 100%; background: white; box-shadow: 0 -2px 15px rgba(0,0,0,0.1); padding: 15px; display: none; z-index: 1000; }
    .player-flex { display: flex; align-items: center; gap: 15px; max-width: 800px; margin: 0 auto; }
    #current-word { font-weight: bold; font-size: 1rem; color: #007bff; min-width: 100px; }
    audio { flex-grow: 1; height: 40px; }
  </style>
</head>
<body>

  <div id="sheet-buttons" class="d-flex justify-content-center flex-wrap gap-2 mb-3"></div>
  
  <div class="d-grid gap-2 mb-3">
    <button id="playAllBtn" class="btn btn-success fw-bold" onclick="playAllOnPage()">🎧 播放本頁 (播完即止)</button>
    <button id="playEverythingBtn" class="btn btn-warning fw-bold" onclick="playEverything()">🚀 全部播放 (自動換頁直到最後)</button>
  </div>

  <div id="app" class="row row-cols-1 row-cols-md-2 g-3"></div>

  <div id="pagination" class="d-flex justify-content-between align-items-center mt-4 mb-5">
    <button id="prevBtn" class="btn btn-outline-primary" onclick="changePage(-1)">上一頁</button>
    <div class="d-flex align-items-center gap-2">
      <input type="number" id="pageInput" class="form-control text-center" style="width: 70px;" onchange="jumpToPage(this.value)" min="1">
      <span id="totalPages">/ 頁</span>
    </div>
    <button id="nextBtn" class="btn btn-outline-primary" onclick="changePage(1)">下一頁</button>
  </div>

  <div id="player-container">
    <div class="player-flex">
      <div id="current-word">尚未播放</div>
      <audio id="global-audio" controls></audio>
      <button class="btn btn-sm btn-outline-danger" onclick="stopSequence()">停止</button>
    </div>
  </div>

  <script>
    let allData = [];
    let filteredData = [];
    let currentPage = 1;
    const itemsPerPage = 10;
    const API_URL = "https://script.google.com/a/macros/guo.kh.edu.tw/s/AKfycbw_OHgjTJqP6OvnIYZl2L9XkkH_DacnLfcQHipsGX0EQg4OsU7dxo6LuH9862I-nSo_1g/exec"; 
    let currentSheet = "";
    let playlist = [];
    let playlistIdx = 0;
    let isAutoPlaying = false;
    let isCrossPageMode = false;

    async function init() {
      const savedSheet = localStorage.getItem('last_sheet');
      try {
        const response = await fetch(`${API_URL}?action=getSheets`);
        const names = await response.json();
        if (names && names.length > 0) {
          currentSheet = (savedSheet && names.includes(savedSheet)) ? savedSheet : names[0];
          setupSheetButtons(names);
          await loadData();
        }
      } catch (err) { console.error(err); }
    }

    async function loadData() {
      if (!currentSheet) return;
      try {
        const dataRes = await fetch(`${API_URL}?sheet=${currentSheet}`);
        allData = await dataRes.json();
        filteredData = allData;
        render();
      } catch (err) { console.error(err); }
    }

    function render() {
      const app = document.getElementById('app');
      const start = (currentPage - 1) * itemsPerPage;
      const pagedData = filteredData.slice(start, start + itemsPerPage);
      const starredList = JSON.parse(localStorage.getItem('starred_words') || "[]");

      app.innerHTML = pagedData.map(item => {
        const isStarred = starredList.includes(String(item.id));
        const hasEx = item.example && item.example !== "null";
        const hasDict = item.dictUrl && item.dictUrl !== "null";
        return `
          <div class="col card-container" id="container-${item.id}">
            <div class="word-card ${isStarred ? 'starred-border' : ''}" data-id="${item.id}" onclick="this.classList.toggle('is-flipped')">
              <div class="card-front">
                <div class="word-header">
                  <button class="play-icon-btn" onclick="event.stopPropagation(); jumpToAndPlay('${item.id}')">▶</button>
                  <span class="word-title">${item.word}</span>
                  ${hasDict ? `<a href="${item.dictUrl}" target="_blank" class="dict-link" onclick="event.stopPropagation();">📖</a>` : ''}
                  <button class="star-btn ${isStarred ? 'active' : ''}" onclick="toggleStar('${item.id}', event)">★</button>
                  <span class="word-no">#${item.id}</span>
                </div>
                <div class="ipa-text">${item.ipa || ''}</div>
                <div class="badge-group"><span class="badge bg-cat">${item.cat || '未分類'}</span></div>
                ${hasEx ? `<div class="example-box"><span class="example-label"><button class="play-btn-sm" onclick="event.stopPropagation(); playOnlyExample('${item.exampleAudio}', '${item.word}', '${item.id}')">🔊</button></span>${item.example}</div>` : ''}
              </div>
              <div class="card-back">
                <div class="mt-2 text-start flex-grow-1"><strong>華語詞義：</strong><p>${item.meaning || ''}</p></div>
              </div>
            </div>
          </div>`;
      }).join('');
      
      const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
      document.getElementById('pageInput').value = currentPage;
      document.getElementById('totalPages').innerText = `/ ${totalPages} 頁`;
    }

    function playSingle(url, label) {
      const p = document.getElementById('global-audio');
      document.getElementById('current-word').innerText = label;
      p.src = url.trim().replace("dl=0", "raw=1");
      return p.play();
    }

    function stopSequence() { 
      isAutoPlaying = false; 
      isCrossPageMode = false;
      document.getElementById('global-audio').pause(); 
      document.querySelectorAll('.word-card').forEach(c=> {
        c.classList.remove('playing-now');
        c.classList.remove('expanded');
      });
    }

    function jumpToAndPlay(id) {
      const start = (currentPage - 1) * itemsPerPage;
      playlist = filteredData.slice(start, start + itemsPerPage).filter(i => i.wordAudio || i.exampleAudio);
      playlistIdx = playlist.findIndex(i => String(i.id) === String(id));
      if(playlistIdx !== -1) { isAutoPlaying = true; startSeq(playlist[playlistIdx]); }
    }

    function startSeq(item) {
      if(!isAutoPlaying) return;
      document.getElementById('player-container').style.display = 'block';
      
      // 清除前一個狀態
      document.querySelectorAll('.word-card').forEach(c=> {
        c.classList.remove('playing-now');
        c.classList.remove('expanded');
      });

      const card = document.querySelector(`[data-id="${item.id}"]`);
      if(card) { 
        card.classList.add('playing-now'); 
        card.scrollIntoView({behavior:'smooth', block:'center'}); 
      }
      
      const audio = document.getElementById('global-audio');
      
      // 1. 播放語詞
      if(item.wordAudio && item.wordAudio !== "null") {
        playSingle(item.wordAudio, "📢 " + item.word);
        audio.onended = () => {
          // 2. 準備播放例句，展開卡片
          if(item.exampleAudio && item.exampleAudio !== "null") {
            if(card) card.classList.add('expanded'); // 展開卡片高度
            setTimeout(() => { 
              if(isAutoPlaying) { 
                playSingle(item.exampleAudio, "📖 例句"); 
                audio.onended = () => { 
                  if(card) card.classList.remove('expanded'); // 播完縮回
                  nextSeq(); 
                }; 
              } 
            }, 500);
          } else nextSeq();
        };
      } else if(item.exampleAudio) {
        if(card) card.classList.add('expanded');
        playSingle(item.exampleAudio, "📖 例句"); 
        audio.onended = () => { 
          if(card) card.classList.remove('expanded');
          nextSeq(); 
        };
      } else { nextSeq(); }
    }

    function nextSeq() {
      if(!isAutoPlaying) return;
      playlistIdx++;
      if(playlistIdx < playlist.length) {
        setTimeout(() => startSeq(playlist[playlistIdx]), 1000);
      } else if(isCrossPageMode) {
        // 自動換頁邏輯
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);
        if(currentPage < totalPages) {
          changePage(1);
          setTimeout(() => {
            const start = (currentPage - 1) * itemsPerPage;
            playlist = filteredData.slice(start, start + itemsPerPage).filter(i => i.wordAudio || i.exampleAudio);
            playlistIdx = 0;
            if(playlist.length > 0) startSeq(playlist[0]); else stopSequence();
          }, 1200);
        } else { stopSequence(); }
      } else { stopSequence(); }
    }

    function playAllOnPage() { isCrossPageMode = false; isAutoPlaying = true; jumpToAndPlay(filteredData[(currentPage-1)*itemsPerPage].id); }
    function playEverything() { isCrossPageMode = true; isAutoPlaying = true; jumpToAndPlay(filteredData[(currentPage-1)*itemsPerPage].id); }
    
    function playOnlyExample(url, name, id) {
      stopSequence();
      const card = document.querySelector(`[data-id="${id}"]`);
      if(card) card.classList.add('expanded');
      document.getElementById('player-container').style.display='block';
      playSingle(url, "📖 例句："+name);
      document.getElementById('global-audio').onended = () => {
        if(card) card.classList.remove('expanded');
      };
    }

    function changePage(s) { currentPage += s; render(); window.scrollTo(0,0); }
    function setupSheetButtons(names) { document.getElementById('sheet-buttons').innerHTML = names.map(n => `<button class="btn btn-sm btn-outline-primary" onclick="currentSheet='${n}';loadData()">${n}</button>`).join(''); }
    function toggleStar(id, e) { e.stopPropagation(); let list = JSON.parse(localStorage.getItem('starred_words') || "[]"); const i = list.indexOf(String(id)); if(i > -1) list.splice(i, 1); else list.push(String(id)); localStorage.setItem('starred_words', JSON.stringify(list)); render(); }

    window.onload = init;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script src="https://www.cns11643.gov.tw/AIDB/static/js/cns11643.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台語認證練習系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
  /* 1. 強制引入包含擴展區的雲端字型 */
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');

  body { 
    /* 優先順序：Google雲端字型 > 蘋果系統字型 > 微軟正黑體 */
    font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Microsoft JhengHei"; 
    background-color: #f8f9fa; 
    padding: 15px; 
    padding-bottom: 120px !important; 
  }

  /* 2. 針對罕見字的 CSS 渲染優化 */
  .word-title, .example-box {
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    font-variant-ligatures: none;
  }
  
  /* 其他原有的 CSS 請保留... */
</style>

<script>
  // ... 前面的變數定義與 init 維持不變 ...

  function render() {
    const app = document.getElementById('app');
    const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
    
    if (filteredData.length === 0) {
      app.innerHTML = '<div class="col-12 mt-5 text-center text-muted">目前沒有資料。</div>';
    } else {
      const start = (currentPage - 1) * itemsPerPage;
      const pagedData = filteredData.slice(start, start + itemsPerPage);
      const starredList = getStarredList();
      
      let html = '';
      pagedData.forEach(item => {
        const isStarred = starredList.includes(String(item.id));
        const hasEx = item.example && item.example !== "null" && item.example.trim() !== "";
        const hasDict = item.dictUrl && item.dictUrl !== "null" && item.dictUrl.trim() !== "";
      
        // --- 關鍵補強：主動偵測罕見字並轉換為圖片網址 ---
        // 這段會把 &#x22F0C; 這種編碼直接轉成全字庫圖片，確保手機不破圖且必顯示
        let processedWord = item.word;
        if (processedWord.includes('&#x')) {
          processedWord = processedWord.replace(/&#x([0-9A-Fa-f]+);/g, (match, hex) => {
            return `<img src="https://www.cns11643.gov.tw/AIDB/png.do?components=1&font=0&code=${hex}" style="height:1.2em; vertical-align:text-bottom; filter: contrast(120%);">`;
          });
        }
      
        html += `
          <div class="col card-container">
            <div class="word-card ${isStarred ? 'starred-border' : ''}" data-id="${item.id}" onclick="this.classList.toggle('is-flipped')">
              <div class="card-front">
                <div class="word-header">
                  <button class="play-icon-btn" onclick="event.stopPropagation(); jumpToAndPlay('${item.id}')">▶</button>
                  <span class="word-title">${processedWord}</span>
                  ${hasDict ? `<a href="${item.dictUrl}" target="_blank" class="dict-link" onclick="event.stopPropagation();">📖</a>` : ''}
                  <button class="star-btn ${isStarred ? 'active' : ''}" onclick="toggleStar('${item.id}', event)">★</button>
                  <span class="word-no">#${item.id}</span>
                </div>
                ... (後續 HTML 維持不變) ...
        `;
      });
      app.innerHTML = html;
    }
    
    document.getElementById('pageInput').value = currentPage;
    document.getElementById('totalPages').innerText = `/ ${totalPages} 頁`;
    document.getElementById('prevBtn').disabled = (currentPage <= 1);
    document.getElementById('nextBtn').disabled = (currentPage >= totalPages);

    // --- 關鍵修正：解決手機版罕見字不顯示的問題 ---
    if (typeof CNS11643 !== 'undefined') {
        // 第一次嘗試：立即修正
        CNS11643.fixed();
        
        // 第二次嘗試：延遲 300ms（等待手機 DOM 渲染完畢）
        setTimeout(() => { 
            console.log("執行手機版全字庫修正...");
            CNS11643.fixed(); 
        }, 300);

        // 第三次嘗試：延遲 1000ms（最後保險，處理載入較慢的罕見字）
        setTimeout(() => { 
            CNS11643.fixed(); 
        }, 1000);
    }
  }


    // 分頁與標籤功能
    function changePage(s) { 
      currentPage += s; 
      localStorage.setItem(`last_page_${currentSheet}`, currentPage); 
      render(); window.scrollTo(0,0); 
    }
    function jumpToPage(v) { 
      const p = parseInt(v); 
      if (p >= 1) { currentPage = p; localStorage.setItem(`last_page_${currentSheet}`, p); render(); } 
    }
    function setupSheetButtons(names) {
      const container = document.getElementById('sheet-buttons');
      container.innerHTML = names.map(n => `<button class="btn btn-sm ${n===currentSheet?'btn-primary':'btn-outline-primary'}" onclick="switchSheet('${n}')">${n}</button>`).join('');
    }
    function switchSheet(name) {
      if(currentSheet === name) return;
      currentSheet = name;
      localStorage.setItem('last_sheet', name);
      loadData();
      setupSheetButtons(JSON.parse(localStorage.getItem('cache_sheet_names') || "[]"));
    }
    function updateCategoryUI(cats) {
      const select = document.getElementById('categorySelect');
      const current = select.value;
      select.innerHTML = '<option value="all">全部類別</option><option value="my_stars">⭐ 我的收藏</option>' + 
        cats.map(c => `<option value="${c}">${c}</option>`).join('');
      select.value = current;
    }
    function toggleStar(id, e) {
      e.stopPropagation();
      let list = getStarredList();
      const i = list.indexOf(String(id));
      if(i > -1) list.splice(i, 1); else list.push(String(id));
      localStorage.setItem('starred_words', JSON.stringify(list));
      render();
    }
    function getStarredList() { return JSON.parse(localStorage.getItem('starred_words') || "[]"); }

    // 播放邏輯
    function playSingle(url, label) {
      const p = document.getElementById('global-audio');
      document.getElementById('current-word').innerText = label;
      p.src = url.trim().replace("dl=0", "raw=1");
      p.play().catch(() => {});
    }
    function stopSequence() { isAutoPlaying = false; document.getElementById('global-audio').pause(); document.querySelectorAll('.word-card').forEach(c=>c.classList.remove('playing-now')); }
    
    function jumpToAndPlay(id) {
      const start = (currentPage - 1) * itemsPerPage;
      playlist = filteredData.slice(start, start + itemsPerPage).filter(i => i.wordAudio || i.exampleAudio);
      playlistIdx = playlist.findIndex(i => String(i.id) === String(id));
      if(playlistIdx !== -1) { stopSequence(); isAutoPlaying = true; startSeq(playlist[playlistIdx]); }
    }
    
    function startSeq(item) {
      if(!isAutoPlaying) return;
      document.getElementById('player-container').style.display = 'block';
      document.querySelectorAll('.word-card').forEach(c=>c.classList.remove('playing-now'));
      const card = document.querySelector(`[data-id="${item.id}"]`);
      if(card) { card.classList.add('playing-now'); card.scrollIntoView({behavior:'smooth', block:'center'}); }
      
      const audio = document.getElementById('global-audio');
      if(item.wordAudio && item.wordAudio !== "null") {
        playSingle(item.wordAudio, "📢 " + item.word);
        audio.onended = () => {
          if(item.exampleAudio && item.exampleAudio !== "null") {
            setTimeout(() => { if(isAutoPlaying) { playSingle(item.exampleAudio, "📖 例句"); audio.onended = nextSeq; } }, 800);
          } else nextSeq();
        };
      } else if(item.exampleAudio) {
        playSingle(item.exampleAudio, "📖 例句"); audio.onended = nextSeq;
      }
    }
    
    function nextSeq() {
      playlistIdx++;
      if(isAutoPlaying && playlistIdx < playlist.length) setTimeout(() => startSeq(playlist[playlistIdx]), 1200);
      else stopSequence();
    }
    
    function playAllOnPage() {
      const start = (currentPage - 1) * itemsPerPage;
      playlist = filteredData.slice(start, start + itemsPerPage).filter(i => i.wordAudio || i.exampleAudio);
      if(playlist.length > 0) { stopSequence(); isAutoPlaying = true; playlistIdx = 0; startSeq(playlist[0]); }
    }
    
    function playOnlyExample(url, name) { stopSequence(); document.getElementById('player-container').style.display='block'; playSingle(url, "📖 例句："+name); }

    window.onload = init;
  </script>
</body>
</html>

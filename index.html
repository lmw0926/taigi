<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script src="https://www.cns11643.gov.tw/AIDB/static/js/cns11643.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台語認證練習系統 - 播放模式強化版</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
    
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f8f9fa; 
      padding: 15px; 
      padding-bottom: 140px !important; 
    }

    /* --- 投影片遮罩層 --- */
    #slideshow-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }

    #slide-content {
      width: 90%; max-width: 600px;
      transform: scale(0.8); opacity: 0;
      transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    #slide-content.active { transform: scale(1); opacity: 1; }

    /* --- 播放模式標籤 --- */
    #mode-badge {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: #ffc107; color: #000; padding: 5px 15px; border-radius: 20px;
      font-weight: bold; font-size: 1rem; z-index: 2100;
    }

    /* --- 卡片樣式 --- */
    .card-container { perspective: 1000px; margin-bottom: 20px; }
    .word-card { 
      width: 100%; min-height: 280px; 
      transition: transform 0.6s; transform-style: preserve-3d; position: relative; 
      background: white; border-radius: 15px; border: 1px solid #ddd; cursor: pointer;
    }
    .word-card.is-flipped { transform: rotateY(180deg); }

    .card-front, .card-back { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      backface-visibility: hidden; border-radius: 15px; padding: 20px; 
      display: flex; flex-direction: column;
    }

    .card-front { border-left: 8px solid #007bff; }
    .card-back { transform: rotateY(180deg); background: #f0f7ff; border-left: 8px solid #28a745; overflow-y: auto; }
    
    .example-box { 
      background: #f1f3f5; padding: 12px; border-left: 4px solid #3498db; 
      font-size: 1.4rem; color: #34495e; border-radius: 0 5px 5px 0; 
      flex-grow: 1; margin-top: 10px; cursor: zoom-in;
    }
    
    .example-box.expanded {
      position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
      z-index: 100; background: white; border: 2px solid #3498db;
      padding: 20px; font-size: 2rem; cursor: zoom-out;
    }

    .word-title { font-size: 2.2rem; font-weight: bold; }
    .ipa-text { color: #e67e22; font-size: 1.5rem; margin-left: 45px; font-family: monospace; }

    #player-container { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 15px; display: none; z-index: 2200; box-shadow: 0 -5px 20px rgba(0,0,0,0.2); }
    .player-flex { display: flex; align-items: center; gap: 15px; max-width: 900px; margin: 0 auto; }
    
    @media (max-width: 576px) { .word-title { font-size: 1.8rem; } .ipa-text { font-size: 1.2rem; } }
  </style>
</head>
<body>

  <div id="slideshow-overlay">
    <div id="mode-badge">播放中</div>
    <div id="slide-content"></div>
  </div>

  <div id="sheet-buttons" class="d-flex justify-content-center flex-wrap gap-2 mb-3"></div>
  
  <div class="d-grid gap-2 mb-3">
    <div class="row g-2">
        <div class="col-6"><button class="btn btn-success w-100 fw-bold" onclick="playCurrentPage()">🎧 播放整頁</button></div>
        <div class="col-6"><button class="btn btn-warning w-100 fw-bold" onclick="playAllContinuous()">🚀 全部播放</button></div>
    </div>
  </div>

  <div class="mb-3">
    <select class="form-select" id="categorySelect" onchange="filterByCategory(this.value)">
      <option value="all">全部類別</option>
      <option value="my_stars">⭐ 我的收藏</option>
    </select>
  </div>

  <div id="app" class="row row-cols-1 row-cols-md-2 g-3"></div>

  <div id="pagination" class="d-flex justify-content-between align-items-center mt-4">
    <button class="btn btn-outline-primary" onclick="changePage(-1)">上一頁</button>
    <div id="totalPages" class="fw-bold">/ 頁</div>
    <button class="btn btn-outline-primary" onclick="changePage(1)">下一頁</button>
  </div>

  <div id="player-container">
    <div class="player-flex">
      <div id="current-word" class="text-primary fw-bold" style="min-width: 100px;">尚未播放</div>
      <audio id="global-audio" controls class="flex-grow-1"></audio>
      <button class="btn btn-danger btn-sm" onclick="stopSequence()">停止</button>
    </div>
  </div>

  <script>
    let allData = [], filteredData = [], currentPage = 1, itemsPerPage = 10;
    const API_URL = "https://script.google.com/a/macros/guo.kh.edu.tw/s/AKfycbw_OHgjTJqP6OvnIYZl2L9XkkH_DacnLfcQHipsGX0EQg4OsU7dxo6LuH9862I-nSo_1g/exec";
    
    // 播放狀態控制
    let currentMode = "none"; // none, single, page, all
    let playlist = [], playlistIdx = 0, isPlaying = false;

    async function init() {
      const savedSheet = localStorage.getItem('last_sheet');
      const response = await fetch(`${API_URL}?action=getSheets`);
      const names = await response.json();
      currentSheet = (savedSheet && names.includes(savedSheet)) ? savedSheet : names[0];
      setupSheetButtons(names);
      await loadData();
    }

    async function loadData() {
      const [dataRes, catRes] = await Promise.all([
        fetch(`${API_URL}?sheet=${currentSheet}`),
        fetch(`${API_URL}?action=getCategories&sheet=${currentSheet}`).catch(() => null)
      ]);
      allData = await dataRes.json();
      const savedCat = localStorage.getItem(`last_cat_${currentSheet}`) || "all";
      const savedPage = localStorage.getItem(`last_page_${currentSheet}`) || 1;
      document.getElementById('categorySelect').value = savedCat;
      applyFilter(savedCat);
      currentPage = parseInt(savedPage);
      render();
    }

    function applyFilter(cat) {
      if (cat === "my_stars") {
        const list = JSON.parse(localStorage.getItem('starred_words') || "[]");
        filteredData = allData.filter(item => list.includes(String(item.id)));
      } else if (cat !== "all") {
        filteredData = allData.filter(item => item.cat === cat);
      } else { filteredData = allData; }
    }

    function render() {
      const app = document.getElementById('app');
      const start = (currentPage - 1) * itemsPerPage;
      const pagedData = filteredData.slice(start, start + itemsPerPage);
      app.innerHTML = pagedData.map(item => createCardHTML(item)).join('');
      document.getElementById('totalPages').innerText = `第 ${currentPage} / ${Math.ceil(filteredData.length / itemsPerPage) || 1} 頁`;
      localStorage.setItem(`last_page_${currentSheet}`, currentPage);
      if (window.CNS11643) setTimeout(() => CNS11643.fixed(), 150);
    }

    function createCardHTML(item) {
      return `
        <div class="col card-container">
          <div class="word-card" id="card-${item.id}" onclick="this.classList.toggle('is-flipped')">
            <div class="card-front">
              <div class="d-flex align-items-center">
                <button class="btn btn-primary rounded-circle me-3" style="width:40px; height:40px;" onclick="event.stopPropagation(); playSingleSlide('${item.id}')">▶</button>
                <span class="word-title">${item.word}</span>
                <span class="ms-auto text-muted small">#${item.id}</span>
              </div>
              <div class="ipa-text">${item.ipa || ''}</div>
              <div class="example-box" onclick="toggleZoom(this, event)">
                <small class="text-secondary fw-bold">例句：</small><br>${item.example || ''}
              </div>
            </div>
            <div class="card-back">
              <div class="p-2">
                <h5 class="text-success border-bottom pb-2">解釋與說明</h5>
                <p class="fs-5">${item.meaning || '暫無資料'}</p>
              </div>
            </div>
          </div>
        </div>`;
    }

    function toggleZoom(el, e) { e.stopPropagation(); el.classList.toggle('expanded'); }

    // --- 播放核心控制 ---
    
    function playSingleSlide(id) {
        currentMode = "single";
        startPlayback(id);
    }

    function playCurrentPage() {
        currentMode = "page";
        const startIdx = (currentPage - 1) * itemsPerPage;
        startPlayback(filteredData[startIdx].id);
    }

    function playAllContinuous() {
        currentMode = "all";
        const startIdx = (currentPage - 1) * itemsPerPage;
        startPlayback(filteredData[startIdx].id);
    }

    function startPlayback(id) {
      isPlaying = true;
      document.getElementById('slideshow-overlay').style.display = 'flex';
      document.getElementById('player-container').style.display = 'block';
      
      const badge = document.getElementById('mode-badge');
      if(currentMode === "single") badge.innerText = "單張播放";
      if(currentMode === "page") badge.innerText = "整頁播放";
      if(currentMode === "all") badge.innerText = "全部連續播放";

      playlist = filteredData;
      playlistIdx = playlist.findIndex(i => String(i.id) === String(id));
      showSlide();
    }

    function showSlide() {
      if (!isPlaying) return;
      const item = playlist[playlistIdx];
      const slideBox = document.getElementById('slide-content');
      
      slideBox.classList.remove('active');
      
      setTimeout(() => {
        slideBox.innerHTML = createCardHTML(item);
        slideBox.classList.add('active');
        
        const audio = document.getElementById('global-audio');
        document.getElementById('current-word').innerText = item.word;
        
        // 播放語音
        audio.src = item.wordAudio.replace("dl=0", "raw=1");
        audio.play();
        
        audio.onended = () => {
          if (item.exampleAudio) {
            setTimeout(() => {
              audio.src = item.exampleAudio.replace("dl=0", "raw=1");
              audio.play();
              audio.onended = handleSequenceEnd;
            }, 600);
          } else { handleSequenceEnd(); }
        };
      }, 300);
    }

    function handleSequenceEnd() {
        if (!isPlaying) return;

        // 1. 單張模式：播完直接停
        if (currentMode === "single") {
            setTimeout(stopSequence, 1000);
            return;
        }

        // 2. 整頁模式：判斷是否到達本頁最後一張
        if (currentMode === "page") {
            const endIdxOfPage = (currentPage * itemsPerPage) - 1;
            if (playlistIdx >= endIdxOfPage || playlistIdx >= playlist.length - 1) {
                setTimeout(stopSequence, 1000);
                return;
            }
        }

        // 3. 全部模式：檢查是否需要翻頁
        playlistIdx++;
        if (playlistIdx < playlist.length) {
            if (playlistIdx % itemsPerPage === 0) {
                currentPage++;
                render(); // 背景翻頁
            }
            setTimeout(showSlide, 1000);
        } else {
            setTimeout(stopSequence, 1000);
        }
    }

    function stopSequence() {
      isPlaying = false;
      currentMode = "none";
      document.getElementById('slideshow-overlay').style.display = 'none';
      document.getElementById('player-container').style.display = 'none';
      document.getElementById('global-audio').pause();
    }

    // --- 其他功能 ---
    function setupSheetButtons(names) {
      document.getElementById('sheet-buttons').innerHTML = names.map(n => 
        `<button class="btn btn-sm ${n===currentSheet?'btn-primary':'btn-outline-primary'}" onclick="switchSheet('${n}')">${n}</button>`
      ).join('');
    }

    function switchSheet(name) {
      currentSheet = name;
      localStorage.setItem('last_sheet', name);
      loadData();
    }

    function filterByCategory(cat) {
      localStorage.setItem(`last_cat_${currentSheet}`, cat);
      applyFilter(cat);
      currentPage = 1;
      render();
    }

    function changePage(s) {
        const total = Math.ceil(filteredData.length / itemsPerPage);
        if (currentPage + s >= 1 && currentPage + s <= total) {
            currentPage += s;
            render();
            window.scrollTo(0,0);
        }
    }

    window.onload = init;
  </script>
</body>
</html>

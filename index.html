<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script src="https://www.cns11643.gov.tw/AIDB/static/js/cns11643.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台語認證系統 - 例句強化版</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; background-color: #f4f7f9; padding: 10px; padding-bottom: 120px; }

    /* 控制面板 */
    .compact-panel { background: white; padding: 10px 15px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .panel-item { flex: 1; min-width: 120px; }
    
    /* 播放遮罩 (投影片模式) */
    #slideshow-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.96); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(12px); cursor: pointer; }
    #slide-content { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: default; }
    
    .word-card { width: 100%; min-height: 280px; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); transform-style: preserve-3d; position: relative; background: white; border-radius: 16px; border: 1px solid #e0e6ed; cursor: pointer; }
    .word-card.is-flipped { transform: rotateY(180deg); }
    .word-card.playing-mode { width: 85vw !important; height: 75vh !important; max-width: 700px; max-height: 850px; margin: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.7); z-index: 2001; cursor: default; }

    .card-front, .card-back { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; padding: 30px; display: flex; flex-direction: column; overflow: hidden; }
    .card-front { border-left: 10px solid #007bff; }
    .card-back { transform: rotateY(180deg); background: #f0f7ff; border-left: 10px solid #28a745; overflow-y: auto; }
    
    /* 例句方塊優化：調整為 1.5rem */
    .example-box { 
      background: #f8f9fa; 
      padding: 15px; 
      border-left: 5px solid #3498db; 
      font-size: 1.5rem; /* 已調整字體 */
      line-height: 1.6; 
      color: #2c3e50; 
      border-radius: 0 8px 8px 0; 
      margin-top: 20px; 
      height: 140px; 
      overflow-y: auto; 
    }
    .playing-mode .example-box { flex: 1; height: auto; background: #ffffff; font-size: 2rem; }

    /* 播放中即時亮框 (網頁模式用) */
    .now-playing-border { 
      outline: 4px solid #007bff !important; 
      outline-offset: 4px; 
      box-shadow: 0 0 15px rgba(0,123,255,0.4) !important;
    }

    /* 結束定位亮框 (黃色) */
    .highlight-card { 
      outline: 4px solid #ffc107 !important; 
      outline-offset: 4px; 
      box-shadow: 0 0 30px #ffc107 !important;
      transform: scale(1.03);
      z-index: 10;
    }

    .card-controls-right { position: absolute; top: 15px; right: 20px; display: flex; align-items: center; gap: 12px; z-index: 10; }
    .item-id-badge { color: #adb5bd; font-size: 1rem; font-weight: bold; }
    .star-btn { font-size: 1.6rem; color: #ffc107; cursor: pointer; }

    .word-title { font-size: 2.8rem; font-weight: 700; color: #1a202c; line-height: 1.2; display: flex; align-items: center; gap: 12px; }
    .ipa-text { color: #e67e22; font-size: 1.8rem; font-family: 'Courier New', monospace; margin-top: 5px; }
    
    #player-container { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 12px; display: none; z-index: 2200; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); }
    .nav-btn-overlay { position: absolute; top: 50%; transform: translateY(-50%); background: none; color: white; border: none; font-size: 4rem; opacity: 0.3; transition: 0.3s; z-index: 2300; }
  </style>
</head>
<body>

  <div id="slideshow-overlay" onclick="closeOnOverlay(event)">
    <button class="nav-btn-overlay" style="left: 5px;" onclick="event.stopPropagation(); manualPrev()"><i class="bi bi-chevron-left"></i></button>
    <div id="slide-content" onclick="event.stopPropagation(); toggleFlip(this)"></div>
    <button class="nav-btn-overlay" style="right: 5px;" onclick="event.stopPropagation(); manualNext()"><i class="bi bi-chevron-right"></i></button>
  </div>

  <div class="compact-panel">
    <div class="panel-item"><select id="sheetSelect" class="form-select" onchange="switchSheet(this.value)"></select></div>
    <div class="panel-item"><select id="categorySelect" class="form-select" onchange="handleCategoryChange(this.value)"></select></div>
    <div class="panel-item">
      <select id="playModeSelect" class="form-select border-primary text-primary fw-bold">
        <option value="slideshow">📽️ 投影片模式</option>
        <option value="web">🌐 網頁模式</option>
      </select>
    </div>
    <div class="nav-group d-flex gap-1" style="flex: 1.5; min-width: 220px;">
        <button class="btn btn-outline-primary" onclick="changePage(-1)">◀</button>
        <select id="pageJumpSelect" class="form-select text-center" onchange="jumpToPage(this.value)"></select>
        <button class="btn btn-outline-primary" onclick="changePage(1)">▶</button>
    </div>
    <div class="d-flex gap-1">
      <button class="btn btn-success px-3 rounded-pill" onclick="playCurrentPage()">播本頁</button>
      <button class="btn btn-warning px-3 rounded-pill text-white" onclick="playAllContinuous()">播全部</button>
    </div>
  </div>

  <div id="app" class="row row-cols-1 row-cols-md-2 g-3"></div>

  <div id="player-container">
    <div class="container d-flex align-items-center gap-3">
      <div id="current-word" class="text-primary fw-bold" style="min-width: 80px; font-size: 1.4rem;"></div>
      <audio id="global-audio" class="flex-grow-1" style="height: 40px;"></audio>
      <button id="main-play-pause-btn" class="btn btn-primary rounded-circle" style="width:50px; height:50px;" onclick="togglePlayPause()">
        <i class="bi bi-pause-fill fs-4"></i>
      </button>
      <button class="btn btn-danger rounded-pill px-4" onclick="stopSequence()">停止</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/a/macros/guo.kh.edu.tw/s/AKfycbw_OHgjTJqP6OvnIYZl2L9XkkH_DacnLfcQHipsGX0EQg4OsU7dxo6LuH9862I-nSo_1g/exec";
    let allData = [], filteredData = [], currentPage = 1, itemsPerPage = 10, currentSheet = "";
    let currentMode = "none", playlistIdx = 0, isPlaying = false;
    let starredList = JSON.parse(localStorage.getItem('starred_words') || "[]");

    async function init() {
      const response = await fetch(`${API_URL}?action=getSheets`);
      const names = await response.json();
      currentSheet = localStorage.getItem('last_sheet') || names[0];
      document.getElementById('sheetSelect').innerHTML = names.map(n => `<option value="${n}" ${n===currentSheet?'selected':''}>📚 ${n}</option>`).join('');
      await loadData();
      
      const audio = document.getElementById('global-audio');
      audio.onplay = () => updatePlayPauseUI(true);
      audio.onpause = () => updatePlayPauseUI(false);
      window.addEventListener('keydown', (e) => { if (e.code === 'Space' && isPlaying) { e.preventDefault(); togglePlayPause(); } });
    }

    function togglePlayPause() {
      const audio = document.getElementById('global-audio');
      audio.paused ? audio.play() : audio.pause();
    }

    function updatePlayPauseUI(playing) {
      document.getElementById('main-play-pause-btn').innerHTML = playing ? '<i class="bi bi-pause-fill fs-4"></i>' : '<i class="bi bi-play-fill fs-4"></i>';
    }

    async function loadData() {
      const [dataRes, catRes] = await Promise.all([
        fetch(`${API_URL}?sheet=${currentSheet}`),
        fetch(`${API_URL}?action=getCategories&sheet=${currentSheet}`).catch(() => null)
      ]);
      allData = await dataRes.json();
      if(catRes) {
        const cats = await catRes.json();
        document.getElementById('categorySelect').innerHTML = '<option value="all">📂 全部類別</option><option value="my_stars">⭐ 我的收藏</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
      }
      applyFilter(localStorage.getItem(`last_cat_${currentSheet}`) || "all");
      const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
      currentPage = Math.min(parseInt(localStorage.getItem(`last_page_${currentSheet}`)) || 1, totalPages);
      updatePageJumpSelect();
      render();
    }

    function applyFilter(cat) {
      document.getElementById('categorySelect').value = cat;
      if (cat === "my_stars") filteredData = allData.filter(item => starredList.includes(String(item.id)));
      else if (cat !== "all") filteredData = allData.filter(item => item.cat === cat);
      else filteredData = allData;
    }

    function handleCategoryChange(val) {
      localStorage.setItem(`last_cat_${currentSheet}`, val);
      applyFilter(val);
      currentPage = 1;
      updatePageJumpSelect();
      render();
    }

    function render() {
      const app = document.getElementById('app');
      const start = (currentPage - 1) * itemsPerPage;
      app.innerHTML = filteredData.slice(start, start + itemsPerPage).map(item => createCardHTML(item)).join('');
      if (window.CNS11643) setTimeout(() => CNS11643.fixed(), 150);
      localStorage.setItem(`last_page_${currentSheet}`, currentPage);
    }

    function createCardHTML(item, isOverlay = false) {
      const isStarred = starredList.includes(String(item.id));
      const hasExample = item.example && item.example !== "null" && item.example !== "";
      const hasDict = item.dictUrl && item.dictUrl !== "null" && item.dictUrl !== "";
      return `
        <div class="col" id="card-pos-${item.id}">
          <div class="word-card ${isOverlay ? 'playing-mode' : ''}" onclick="${isOverlay ? '' : 'this.classList.toggle(\'is-flipped\')'}">
            <div class="card-controls-right">
              <span class="item-id-badge">#${item.id}</span>
              <i class="bi bi-star${isStarred?'-fill':''} star-btn" onclick="event.stopPropagation(); toggleStar('${item.id}')"></i>
            </div>
            <div class="card-front">
              <div class="d-flex align-items-center mb-1">
                <button class="btn btn-primary rounded-circle me-4" style="width:50px; height:50px;" onclick="event.stopPropagation(); playSingleSlide('${item.id}')">
                   <i class="bi bi-play-fill fs-4"></i>
                </button>
                <div class="word-title">${item.word}${hasDict ? `<a href="${item.dictUrl}" target="_blank" class="dict-link" onclick="event.stopPropagation();"><i class="bi bi-link-45deg"></i></a>` : ''}</div>
              </div>
              <div class="ipa-text">${item.ipa || ''}</div>
              ${hasExample ? `<div class="example-box"><span class="badge bg-secondary mb-2 fs-6">例：</span>${item.example}</div>` : ''}
            </div>
            <div class="card-back"><div class="p-3"><h4 class="text-success border-bottom pb-2">【解釋】</h4><p style="font-size: 1.5rem;">${item.meaning || '尚未提供'}</p></div></div>
          </div>
        </div>`;
    }

    function jumpToPage(val, autoScroll = true) {
      currentPage = parseInt(val);
      if (document.getElementById('pageJumpSelect')) document.getElementById('pageJumpSelect').value = currentPage; 
      render();
      if (autoScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updatePageJumpSelect() {
      const total = Math.ceil(filteredData.length / itemsPerPage) || 1;
      let options = "";
      for(let i=1; i<=total; i++) options += `<option value="${i}" ${i===currentPage?'selected':''}>第 ${i} 頁</option>`;
      document.getElementById('pageJumpSelect').innerHTML = options;
    }

    function toggleStar(id) {
      id = String(id);
      starredList = starredList.includes(id) ? starredList.filter(i => i !== id) : [...starredList, id];
      localStorage.setItem('starred_words', JSON.stringify(starredList));
      if (document.getElementById('categorySelect').value === "my_stars") { applyFilter("my_stars"); updatePageJumpSelect(); }
      render();
    }

    function changePage(s) {
      const total = Math.ceil(filteredData.length / itemsPerPage);
      const nextPage = currentPage + s;
      if (nextPage >= 1 && nextPage <= total) jumpToPage(nextPage);
    }

    function toggleFlip(el) { el.querySelector('.word-card').classList.toggle('is-flipped'); }
    function playSingleSlide(id) { currentMode = "single"; startPlayback(id); }
    function playCurrentPage() { currentMode = "page"; startPlayback(filteredData[(currentPage-1)*itemsPerPage].id); }
    function playAllContinuous() { currentMode = "all"; startPlayback(filteredData[(currentPage-1)*itemsPerPage].id); }
    
    function startPlayback(id) { 
      isPlaying = true; 
      const uiMode = document.getElementById('playModeSelect').value;
      if (uiMode === 'slideshow') document.getElementById('slideshow-overlay').style.display = 'flex'; 
      document.getElementById('player-container').style.display = 'block'; 
      playlistIdx = filteredData.findIndex(i => String(i.id) === String(id)); 
      showSlide(); 
    }
    
    function showSlide() { 
      if (!isPlaying || playlistIdx === -1) return; 
      const item = filteredData[playlistIdx]; 
      const uiMode = document.getElementById('playModeSelect').value;
      syncPageByTrack();
      document.querySelectorAll('.word-card').forEach(c => c.classList.remove('now-playing-border'));
      if (uiMode === 'slideshow') {
        document.getElementById('slide-content').innerHTML = createCardHTML(item, true); 
      } else {
        setTimeout(() => {
            const el = document.getElementById(`card-pos-${item.id}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.querySelector('.word-card').classList.add('now-playing-border');
            }
        }, 100);
      }
      const audio = document.getElementById('global-audio'); 
      document.getElementById('current-word').innerText = item.word; 
      audio.src = item.wordAudio.replace("dl=0", "raw=1"); 
      audio.play(); 
      audio.onended = () => { 
        if (item.exampleAudio) { 
          setTimeout(() => { 
            if(!isPlaying) return; 
            audio.src = item.exampleAudio.replace("dl=0", "raw=1"); 
            audio.play(); 
            audio.onended = handleSequenceEnd; 
          }, 800); 
        } else handleSequenceEnd(); 
      }; 
    }

    function handleSequenceEnd() { 
      if (!isPlaying) return; 
      const isPageEnd = (currentMode === "page" && playlistIdx >= (currentPage * itemsPerPage) - 1);
      const isAllEnd = (playlistIdx >= filteredData.length - 1);
      if (currentMode === "single" || isPageEnd || isAllEnd) { stopSequence(); return; } 
      manualNext(); 
    }
    function manualNext() { if (playlistIdx < filteredData.length - 1) { playlistIdx++; showSlide(); } else stopSequence(); }
    function manualPrev() { if (playlistIdx > 0) { playlistIdx--; showSlide(); } }
    function syncPageByTrack() { 
      const targetPage = Math.floor(playlistIdx / itemsPerPage) + 1; 
      if (targetPage !== currentPage) jumpToPage(targetPage, false); 
    }

    function stopSequence() { 
      const lastPlayedItem = filteredData[playlistIdx];
      isPlaying = false; 
      document.getElementById('slideshow-overlay').style.display = 'none'; 
      document.getElementById('player-container').style.display = 'none'; 
      document.getElementById('global-audio').pause(); 
      updatePlayPauseUI(false);
      document.querySelectorAll('.word-card').forEach(c => c.classList.remove('now-playing-border'));
      if (!lastPlayedItem) return;
      setTimeout(() => {
        const targetEl = document.getElementById(`card-pos-${lastPlayedItem.id}`);
        if (targetEl) {
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          const cardInner = targetEl.querySelector('.word-card');
          if (cardInner) {
            cardInner.classList.add('highlight-card');
            setTimeout(() => cardInner.classList.remove('highlight-card'), 2000);
          }
        }
      }, 100); 
    }
    function switchSheet(val) { currentSheet = val; localStorage.setItem('last_sheet', val); loadData(); }
    function closeOnOverlay(e) { if (e.target.id === 'slideshow-overlay') stopSequence(); }
    window.onload = init;
  </script>
</body>
</html>

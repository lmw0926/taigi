<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script src="https://www.cns11643.gov.tw/AIDB/static/js/cns11643.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台語認證系統 - 投影片置頂版</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; background-color: #f4f7f9; padding: 10px; padding-bottom: 120px; }

    /* 控制面板 */
    .compact-panel { background: white; padding: 10px 15px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .panel-item { flex: 1; min-width: 120px; }
    
    /* 投影片模式遮罩 */
    #slideshow-overlay { 
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
      background: rgba(0, 0, 0, 0.96); z-index: 3000; display: none; 
      align-items: center; justify-content: center; backdrop-filter: blur(15px); 
      cursor: pointer; overflow: hidden;
    }
    
    /* 修改這裡：內容容器靠頂 */
    #slide-content { 
      width: 100%; height: 100%; 
      display: flex; 
      align-items: flex-start; /* 靠頂 */
      justify-content: center; 
      cursor: default; 
      padding: 30px 20px; /* 頂部間距 30px */
    }
    
    .overlay-card-wrapper {
      width: 95%; max-width: 800px;
      display: flex; 
      justify-content: center; 
      align-items: flex-start; /* 內層也靠頂 */
    }

    /* 離開按鈕 */
    .close-overlay-btn { 
      position: absolute; top: 15px; right: 15px; 
      background: rgba(255,255,255,0.1); color: white; border: none; 
      font-size: 2rem; width: 50px; height: 50px; border-radius: 50%; 
      z-index: 3500; transition: 0.3s; display: flex; align-items: center; justify-content: center;
    }
    .close-overlay-btn:hover { background: rgba(255,0,0,0.6); transform: rotate(90deg); }
    
    .nav-btn-overlay { 
      position: absolute; top: 50%; transform: translateY(-50%); 
      background: none; color: white; border: none; font-size: 5rem; 
      opacity: 0.2; transition: 0.3s; z-index: 3400; padding: 20px;
    }
    .nav-btn-overlay:hover { opacity: 1; }

    /* 卡片基礎樣式 */
    .col { scroll-margin-top: 85px; }
    .word-card { width: 100%; min-height: 280px; transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1); transform-style: preserve-3d; position: relative; background: white; border-radius: 20px; border: 1px solid #e0e6ed; cursor: pointer; }
    .word-card.is-flipped { transform: rotateY(180deg); }
    .playing-height { min-height: 420px !important; }
    
    /* 修正：投影片中的卡片高度不再強制 65vh，避免內容被推擠 */
    #slideshow-overlay .word-card { 
      height: auto; 
      min-height: 450px; 
      max-height: 85vh; 
      box-shadow: 0 20px 60px rgba(0,0,0,0.5); 
    }

    .card-front, .card-back { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; padding: 30px; display: flex; flex-direction: column; overflow: hidden; }
    .card-front { border-left: 12px solid #007bff; position: relative; }
    .card-back { transform: rotateY(180deg); background: #f0f7ff; border-left: 12px solid #28a745; overflow-y: auto; position: relative; }
    
    .card-top-controls { position: absolute; top: 15px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 500; }
    .item-id-badge { color: #adb5bd; font-size: 1rem; font-weight: bold; }
    .star-btn { font-size: 2rem; color: #ffc107; cursor: pointer; transition: 0.2s; }

    .example-box { background: #f8f9fa; padding: 18px; border-left: 6px solid #3498db; font-size: 1.5rem; line-height: 1.6; color: #2c3e50; border-radius: 0 10px 10px 0; margin-top: 20px; transition: all 0.3s ease; overflow-y: auto; flex-grow: 1; position: relative; cursor: zoom-in; }
    .example-expanded { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 400; margin-top: 0; border-radius: 20px; background: #ffffff; padding: 40px; cursor: zoom-out; font-size: 2rem; }

    .now-playing-border { outline: 5px solid #007bff !important; outline-offset: 5px; box-shadow: 0 10px 40px rgba(0,123,255,0.4) !important; }
    .highlight-card { outline: 5px solid #ffc107 !important; outline-offset: 5px; box-shadow: 0 0 40px #ffc107 !important; transform: scale(1.02); }

    .word-title { font-size: 3rem; font-weight: 700; color: #1a202c; line-height: 1.2; display: flex; align-items: center; gap: 15px; padding-right: 50px; }
    .ipa-text { color: #e67e22; font-size: 2rem; font-family: 'Courier New', monospace; margin-top: 8px; }
    
    #player-container { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 15px; display: none; z-index: 4000; box-shadow: 0 -5px 25px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <div id="slideshow-overlay" onclick="closeOnOverlay(event)">
    <button class="close-overlay-btn" onclick="stopSequence()"><i class="bi bi-x-lg"></i></button>
    <button class="nav-btn-overlay" style="left: 20px;" onclick="event.stopPropagation(); manualPrev()"><i class="bi bi-chevron-left"></i></button>
    <div id="slide-content" onclick="event.stopPropagation()"></div>
    <button class="nav-btn-overlay" style="right: 20px;" onclick="event.stopPropagation(); manualNext()"><i class="bi bi-chevron-right"></i></button>
  </div>

  <div class="compact-panel">
    <div class="panel-item"><select id="sheetSelect" class="form-select" onchange="switchSheet(this.value)"></select></div>
    <div class="panel-item"><select id="categorySelect" class="form-select" onchange="handleCategoryChange(this.value)"></select></div>
    <div class="panel-item">
      <select id="playModeSelect" class="form-select border-primary text-primary fw-bold">
        <option value="web" selected>🌐 網頁模式</option>
        <option value="slideshow">📽️ 投影片模式</option>
      </select>
    </div>
    <div class="nav-group d-flex gap-1" style="flex: 1.5; min-width: 220px;">
        <button class="btn btn-outline-primary" onclick="changePage(-1)">◀</button>
        <select id="pageJumpSelect" class="form-select text-center" onchange="jumpToPage(this.value)"></select>
        <button class="btn btn-outline-primary" onclick="changePage(1)">▶</button>
    </div>
    <div class="d-flex gap-1">
      <button class="btn btn-success px-3 rounded-pill" onclick="setModeAndPlay('page')">播本頁</button>
      <button class="btn btn-warning px-3 rounded-pill text-white" onclick="setModeAndPlay('all')">播全部</button>
    </div>
  </div>

  <div id="app" class="row row-cols-1 row-cols-md-2 g-3"></div>

  <div id="player-container">
    <div class="container d-flex align-items-center gap-3">
      <div id="current-word" class="text-primary fw-bold" style="min-width: 100px; font-size: 1.5rem;"></div>
      <audio id="global-audio" class="flex-grow-1" style="height: 45px;"></audio>
      <button id="main-play-pause-btn" class="btn btn-primary rounded-circle" style="width:55px; height:55px;" onclick="togglePlayPause()">
        <i class="bi bi-pause-fill fs-3"></i>
      </button>
      <button class="btn btn-danger rounded-pill px-4" onclick="stopSequence()">停止</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/a/macros/guo.kh.edu.tw/s/AKfycbw_OHgjTJqP6OvnIYZl2L9XkkH_DacnLfcQHipsGX0EQg4OsU7dxo6LuH9862I-nSo_1g/exec";
    let allData = [], filteredData = [], currentPage = 1, itemsPerPage = 10, currentSheet = "";
    let currentMode = "page"; 
    let playlistIdx = 0, isPlaying = false;
    let starredList = JSON.parse(localStorage.getItem('starred_words') || "[]");

    async function init() {
      const response = await fetch(`${API_URL}?action=getSheets`);
      const names = await response.json();
      currentSheet = localStorage.getItem('last_sheet') || names[0];
      document.getElementById('sheetSelect').innerHTML = names.map(n => `<option value="${n}" ${n===currentSheet?'selected':''}>📚 ${n}</option>`).join('');
      await loadData();
      const audio = document.getElementById('global-audio');
      audio.onplay = () => updatePlayPauseUI(true);
      audio.onpause = () => updatePlayPauseUI(false);
      window.addEventListener('keydown', (e) => { 
        if (e.code === 'Space' && isPlaying) { e.preventDefault(); togglePlayPause(); } 
        if (e.code === 'Escape' && isPlaying) { stopSequence(); }
      });
    }

    function togglePlayPause() {
      const audio = document.getElementById('global-audio');
      audio.paused ? audio.play() : audio.pause();
    }

    function updatePlayPauseUI(playing) {
      document.getElementById('main-play-pause-btn').innerHTML = playing ? '<i class="bi bi-pause-fill fs-3"></i>' : '<i class="bi bi-play-fill fs-3"></i>';
    }

    async function loadData() {
      const [dataRes, catRes] = await Promise.all([
        fetch(`${API_URL}?sheet=${currentSheet}`),
        fetch(`${API_URL}?action=getCategories&sheet=${currentSheet}`).catch(() => null)
      ]);
      allData = await dataRes.json();
      if(catRes) {
        const cats = await catRes.json();
        document.getElementById('categorySelect').innerHTML = '<option value="all">📂 全部類別</option><option value="my_stars">⭐ 我的收藏</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
      }
      const savedCat = localStorage.getItem(`last_cat_${currentSheet}`) || "all";
      applyFilter(savedCat);
      const savedPage = parseInt(localStorage.getItem(`last_page_${currentSheet}`)) || 1;
      const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
      currentPage = Math.min(savedPage, totalPages);
      updatePageJumpSelect();
      render();
    }

    function applyFilter(cat) {
      document.getElementById('categorySelect').value = cat;
      if (cat === "my_stars") filteredData = allData.filter(item => starredList.includes(String(item.id)));
      else if (cat !== "all") filteredData = allData.filter(item => item.cat === cat);
      else filteredData = allData;
      localStorage.setItem(`last_cat_${currentSheet}`, cat);
    }

    function handleCategoryChange(val) {
      applyFilter(val);
      currentPage = 1;
      updatePageJumpSelect();
      render();
    }

    function render() {
      const app = document.getElementById('app');
      const start = (currentPage - 1) * itemsPerPage;
      app.innerHTML = filteredData.slice(start, start + itemsPerPage).map(item => createCardHTML(item, false)).join('');
      if (window.CNS11643) setTimeout(() => CNS11643.fixed(), 150);
      localStorage.setItem(`last_page_${currentSheet}`, currentPage);
    }

    function createCardHTML(item, isOverlay = false) {
      const isStarred = starredList.includes(String(item.id));
      const hasExample = item.example && item.example !== "null" && item.example !== "";
      const hasDict = item.dictUrl && item.dictUrl !== "null" && item.dictUrl !== "";
      const cardInner = `
          <div class="word-card" onclick="handleCardClick(event, this)">
            <div class="card-top-controls">
              <span class="item-id-badge">#${item.id}</span>
              <i class="bi bi-star${isStarred?'-fill':''} star-btn" onclick="event.stopPropagation(); toggleStar('${item.id}', this)"></i>
            </div>
            <div class="card-front">
              <div class="d-flex align-items-center mb-1">
                <button class="btn btn-primary rounded-circle me-4" style="width:50px; height:50px;" onclick="event.stopPropagation(); startPlayback('${item.id}', 'from_card')">
                   <i class="bi bi-play-fill fs-4"></i>
                </button>
                <div class="word-title">${item.word}${hasDict ? `<a href="${item.dictUrl}" target="_blank" class="dict-link" style="font-size:1.5rem; opacity:0.5; color:#0d6efd;" onclick="event.stopPropagation();"><i class="bi bi-link-45deg"></i></a>` : ''}</div>
              </div>
              <div class="ipa-text">${item.ipa || ''}</div>
              ${hasExample ? `<div class="example-box" onclick="handleExampleToggle(event, this)"><span class="badge bg-secondary mb-2 fs-6">例：</span><br>${item.example}</div>` : ''}
            </div>
            <div class="card-back"><div class="p-3"><h4 class="text-success border-bottom pb-2">【解釋】</h4><p style="font-size: 1.6rem;">${item.meaning || '尚未提供'}</p></div></div>
          </div>`;
      return isOverlay ? `<div class="overlay-card-wrapper" id="card-pos-${item.id}">${cardInner}</div>` : `<div class="col" id="card-pos-${item.id}">${cardInner}</div>`;
    }

    function handleCardClick(e, el) {
      if (e.target.closest('.example-box') || e.target.closest('.card-top-controls') || e.target.closest('.btn-primary')) return;
      el.classList.toggle('is-flipped');
    }

    function handleExampleToggle(e, el) { e.stopPropagation(); el.classList.toggle('example-expanded'); }

    function setModeAndPlay(mode) {
      currentMode = mode;
      const firstIdOnPage = filteredData[(currentPage - 1) * itemsPerPage].id;
      startPlayback(firstIdOnPage, 'from_button');
    }

    function startPlayback(id, trigger) { 
      if (trigger === 'from_card' && !isPlaying) {
        playOnlyOne(id);
        return;
      }
      isPlaying = true; 
      const uiMode = document.getElementById('playModeSelect').value;
      if (uiMode === 'slideshow') document.getElementById('slideshow-overlay').style.display = 'flex'; 
      document.getElementById('player-container').style.display = 'block'; 
      playlistIdx = filteredData.findIndex(i => String(i.id) === String(id)); 
      showSlide(); 
    }

    function playOnlyOne(id) {
      const item = filteredData.find(i => String(i.id) === String(id));
      if (!item) return;
      const audio = document.getElementById('global-audio');
      const card = document.getElementById(`card-pos-${id}`)?.querySelector('.word-card');
      if (card) { card.classList.add('now-playing-border'); setTimeout(() => card.classList.remove('now-playing-border'), 2000); }
      audio.src = item.wordAudio.replace("dl=0", "raw=1");
      audio.play();
      audio.onended = () => {
        if (item.exampleAudio) {
          setTimeout(() => { audio.src = item.exampleAudio.replace("dl=0", "raw=1"); audio.play(); audio.onended = null; }, 800);
        }
      };
    }

    function showSlide() { 
      if (!isPlaying || playlistIdx === -1) return; 
      const item = filteredData[playlistIdx]; 
      const uiMode = document.getElementById('playModeSelect').value;
      syncPageByTrack();
      
      if (uiMode === 'slideshow') {
        document.getElementById('slide-content').innerHTML = createCardHTML(item, true); 
      } else {
        document.querySelectorAll('.word-card').forEach(c => c.classList.remove('now-playing-border', 'playing-height'));
        setTimeout(() => {
            const elPos = document.getElementById(`card-pos-${item.id}`);
            if (elPos) {
                elPos.scrollIntoView({ behavior: 'smooth', block: 'start' });
                const card = elPos.querySelector('.word-card');
                card.classList.add('now-playing-border', 'playing-height');
            }
        }, 100);
      }
      const audio = document.getElementById('global-audio'); 
      document.getElementById('current-word').innerText = item.word; 
      audio.src = item.wordAudio.replace("dl=0", "raw=1"); 
      audio.play(); 
      audio.onended = () => { 
        if (item.exampleAudio) { 
          setTimeout(() => { if(!isPlaying) return; audio.src = item.exampleAudio.replace("dl=0", "raw=1"); audio.play(); audio.onended = handleSequenceEnd; }, 800); 
        } else handleSequenceEnd(); 
      }; 
    }

    function handleSequenceEnd() { 
      if (!isPlaying) return; 
      const isPageEnd = (currentMode === "page" && playlistIdx >= (currentPage * itemsPerPage) - 1);
      const isAllEnd = (playlistIdx >= filteredData.length - 1);
      if (isPageEnd || isAllEnd) { stopSequence(); return; } 
      manualNext(); 
    }

    function manualNext() { if (playlistIdx < filteredData.length - 1) { playlistIdx++; showSlide(); } else stopSequence(); }
    function manualPrev() { if (playlistIdx > 0) { playlistIdx--; showSlide(); } }
    
    function syncPageByTrack() { 
      const targetPage = Math.floor(playlistIdx / itemsPerPage) + 1; 
      if (targetPage !== currentPage) jumpToPage(targetPage, false); 
    }

    function jumpToPage(val, autoScroll = true) {
      currentPage = parseInt(val);
      if (document.getElementById('pageJumpSelect')) document.getElementById('pageJumpSelect').value = currentPage; 
      render();
      if (autoScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updatePageJumpSelect() {
      const total = Math.ceil(filteredData.length / itemsPerPage) || 1;
      let options = "";
      for(let i=1; i<=total; i++) options += `<option value="${i}" ${i===currentPage?'selected':''}>第 ${i} 頁</option>`;
      document.getElementById('pageJumpSelect').innerHTML = options;
    }

    function stopSequence() { 
      const lastPlayedItem = filteredData[playlistIdx];
      isPlaying = false; 
      document.getElementById('slideshow-overlay').style.display = 'none'; 
      document.getElementById('player-container').style.display = 'none'; 
      document.getElementById('global-audio').pause(); 
      updatePlayPauseUI(false);
      document.querySelectorAll('.word-card').forEach(c => c.classList.remove('now-playing-border', 'playing-height'));
      if (lastPlayedItem) {
        setTimeout(() => {
          const targetEl = document.getElementById(`card-pos-${lastPlayedItem.id}`);
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            const cardInner = targetEl.querySelector('.word-card');
            if (cardInner) { cardInner.classList.add('highlight-card'); setTimeout(() => cardInner.classList.remove('highlight-card'), 2000); }
          }
        }, 100); 
      }
    }

    function toggleStar(id, el) {
      id = String(id);
      if (starredList.includes(id)) { starredList = starredList.filter(i => i !== id); el.classList.replace('bi-star-fill', 'bi-star'); }
      else { starredList.push(id); el.classList.replace('bi-star', 'bi-star-fill'); }
      localStorage.setItem('starred_words', JSON.stringify(starredList));
    }

    function changePage(s) {
      const total = Math.ceil(filteredData.length / itemsPerPage);
      const nextPage = currentPage + s;
      if (nextPage >= 1 && nextPage <= total) jumpToPage(nextPage);
    }

    function switchSheet(val) { 
      currentSheet = val; 
      localStorage.setItem('last_sheet', val); 
      loadData(); 
    }
    
    function closeOnOverlay(e) { if (e.target.id === 'slideshow-overlay') stopSequence(); }
    window.onload = init;
  </script>
</body>
</html>
